<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send a game · AGENTPARK</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07060f">
<link rel="icon" href="brand/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap">
<!-- "Unlock a game for a friend" (Daniel, 2026-10-20: mobile, WhatsApp or SMS, one or two taps). The daily message links here
     with ?u=<prompt code>&g=<AI-only game>; one tap on Text or WhatsApp opens the app with the message written, they pick a friend.
     The friend's link (play.html?g=&gift=<code>) opens the locked game and invites them to get their own (utm_source=gift). -->
<style>
:root { --ink: #FFFDF8; --muted: #CFCBE6; --gold: #FFC93C; --bg: #07060f; --card: #161124; --sms: #34C759; --wa: #25D366; color-scheme: dark }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 16px/1.35 "DM Sans", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
  min-height: 100vh; min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 24px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(16px, env(safe-area-inset-left)) }
main { width: min(440px, 100%); margin: 0 auto; display: grid; gap: 18px; text-align: center }
.cv { width: 180px; aspect-ratio: 3 / 4; margin: 0 auto; border-radius: 24px; background: var(--card) center / cover; position: relative; box-shadow: 0 24px 50px -20px rgba(0,0,0,.8) }
.cv span { position: absolute; top: -12px; right: -12px; font-size: 44px }
h1 { font: 800 30px/1.1 "Bricolage Grotesque", system-ui, sans-serif; margin: 0; text-wrap: balance }
h1 em { font-style: normal; color: var(--gold) }
p { margin: 0; color: var(--muted) }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px }
.btns a, .btns button { display: grid; place-items: center; gap: 6px; padding: 18px 8px; border-radius: 22px; border: 0; color: #fff; text-decoration: none;
  font: 700 18px/1.1 "DM Sans", system-ui, sans-serif; cursor: pointer }
.btns svg { width: 34px; height: 34px }
.sms { background: var(--sms) } .wa { background: var(--wa) }
.more { background: none; border: 0; color: var(--muted); font: 500 15px "DM Sans", system-ui, sans-serif; text-decoration: underline; cursor: pointer; padding: 8px }
.more[hidden] { display: none }
a:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px }
</style>
</head>
<body>
<main>
  <div class="cv" id="cv"><span>🎁</span></div>
  <h1>Give a friend <em id="nm">a secret game</em></h1>
  <p>It only opens from an AI. Your link unlocks it for them.</p>
  <div class="btns">
    <a class="sms" id="sms" href="#"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.4 1.3 4.6 3.4 6.1L4.5 21l4.3-2.3c1 .2 2.1.3 3.2.3 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></svg>Text it</a>
    <a class="wa" id="wa" href="#"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.6 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5.1-4.5-.1-.2-1.2-1.6-1.2-3.1s.8-2.2 1.1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.4z"/></svg>WhatsApp</a>
  </div>
  <button class="more" id="more" type="button" hidden>Send another way</button>
</main>
<script>
(function () {
  const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
  const u = /^[a-z0-9]{10}$/.test(q.get('u') || '') ? q.get('u') : '';
  const slug = /^[a-z0-9-]{3,80}$/.test(q.get('g') || '') ? q.get('g') : 'hunch-five-letter-word-guess';
  const link = `https://agentpark.co/arcade/play.html?g=${slug}${u ? '&gift=' + u : ''}&utm_source=gift&utm_medium=friend`;
  const ev = name => fetch('https://mcp.riffcade.com/api/ob', { method: 'POST', keepalive: true, headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ u, step: name, place: 'gift', src: 'gift' }) }).catch(() => {});
  let text = `I unlocked a game for you 🎁 It normally only opens from an AI. Play it here: ${link}`;
  const set = () => {
    // iOS and Android both open Messages with the text filled in from "sms:?&body="
    $('sms').href = 'sms:?&body=' + encodeURIComponent(text);
    $('wa').href = 'https://wa.me/?text=' + encodeURIComponent(text);
  };
  set();
  fetch('games.json').then(r => r.json()).then(gs => {
    const g = gs.find(x => x.slug === slug); if (!g) return;
    const name = g.name.split(':')[0];
    $('nm').textContent = name; $('cv').style.backgroundImage = `url('${g.cover || g.thumb}')`;
    text = `I unlocked ${name} for you 🎁 It normally only opens from an AI. Play it here: ${link}`; set();
  }).catch(() => {});
  $('sms').addEventListener('click', () => ev('gift_sms'));
  $('wa').addEventListener('click', () => ev('gift_wa'));
  if (navigator.share) { $('more').hidden = false; $('more').onclick = () => { ev('gift_share'); navigator.share({ text }).catch(() => {}); }; }
})();
</script>
</body>
</html>
