<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIP · AGENTPARK</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07060f">
<link rel="icon" href="brand/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap">
<!-- AGENTPARK VIP, $2.99 a month (Daniel, 2026-10-20). Checkout is a Stripe Payment Link in config.js VIP_LINK; until it's set,
     the button collects interest (onboard step vip_join) so we can see demand before taking money. -->
<style>
:root { --ink: #FFFDF8; --muted: #CFCBE6; --gold: #FFC93C; --bg: #07060f; --card: #161124; --line: #3a2d10; color-scheme: dark }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { margin: 0 }
body { background: radial-gradient(120% 60% at 50% 0%, #2b1f00 0%, var(--bg) 60%); background-color: var(--bg); color: var(--ink); font: 16px/1.4 "DM Sans", system-ui, -apple-system, sans-serif;
  min-height: 100vh; min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 24px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(16px, env(safe-area-inset-left)) }
main { width: min(440px, 100%); margin: 0 auto; display: grid; gap: 18px; text-align: center }
.crown { font-size: 64px; line-height: 1 }
h1 { font: 800 34px/1.05 "Bricolage Grotesque", system-ui, sans-serif; margin: 0; text-wrap: balance } h1 em { font-style: normal; color: var(--gold) }
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; text-align: left }
li { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center }
li b { font-size: 22px }
.price { color: var(--muted) } .price b { color: var(--ink); font: 800 26px "Bricolage Grotesque", sans-serif }
.go { display: block; background: var(--gold); color: #1E1B33; border: 0; border-radius: 999px; padding: 16px; font: 800 18px "DM Sans", sans-serif; text-decoration: none; cursor: pointer; width: 100% }
.note { color: var(--muted); font-size: 13px } a { color: inherit }
</style>
</head>
<body>
<main>
  <div class="crown">👑</div>
  <h1>AGENTPARK <em>VIP</em></h1>
  <ul>
    <li><b>🔒</b><span>Every AI-only game, any time, on any device</span></li>
    <li><b>👀</b><span>New games 3 days before everyone</span></li>
    <li><b>✨</b><span>Gold look for your hero</span></li>
    <li><b>🚫</b><span>No ads and no sponsored offers, ever</span></li>
  </ul>
  <div class="price"><b>$2.99</b> a month · cancel any time</div>
  <button class="go" id="go" type="button">Become VIP</button>
  <p class="note" id="msg">Your free daily games stay free.</p>
  <a class="note" href="./">← Back to the games</a>
</main>
<script src="config.js"></script>
<script src="habits.js"></script>
<script>
(function () {
  const C = window.RIFFCADE || {}, u = window.RiffHabits && RiffHabits.agentCode ? RiffHabits.agentCode() : '';
  const go = document.getElementById('go');
  const inApp = (() => { try { return localStorage.getItem('ap.app') === 'android'; } catch (e) { return false; } })();
  if (!inApp && /^https:\/\/(buy|checkout)\.stripe\.com\//.test(C.VIP_LINK || '')) {
    go.onclick = () => { location.href = C.VIP_LINK + (C.VIP_LINK.includes('?') ? '&' : '?') + 'client_reference_id=' + u; };
  } else {
    go.textContent = 'Join the VIP list';
    go.onclick = () => {
      fetch('https://mcp.riffcade.com/api/ob', { method: 'POST', keepalive: true, headers: { 'content-type': 'application/json' }, body: JSON.stringify({ u, step: 'vip_join', place: 'vip' }) }).catch(() => {});
      go.textContent = "You're on the list ✓"; go.disabled = true;
      document.getElementById('msg').textContent = "VIP opens soon. You'll see it in your daily games first.";
    };
  }
})();
</script>
</body>
</html>
