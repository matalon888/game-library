<body class="park">
<main class="home">
  <header class="top">
    <div class="brand"><a href="./" aria-label="AGENTPARK home">
      <img class="logo" src="brand/patch-mark.webp" alt="">
      <div><h1>agent<span>park</span></h1><div class="eyebrow" id="count">&nbsp;</div></div></a></div>
    <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Find a game" aria-label="Find a game" autocomplete="off"></label>
  </header>

  <div id="cont"></div>
  <div data-install></div>

  <nav class="nav" id="nav" aria-label="Game types">
    <div class="modes" id="modes" role="group"></div>
    <div class="chips" id="cats" role="group" aria-label="Categories"></div>
  </nav>

  <div id="shelves"></div>

  <footer class="gate">
    <div class="gate-cast" data-who="dog-trophy,hippo-cheer,giraffe-peek,panda-yoga" aria-hidden="true"></div>
    <p class="foot">Open-source games and AGENTPARK originals, all played right here, each with its author's licence. Tap ⓘ inside a game for credits. Park scores come from Claude's review of each game, plus players' stars once 3 or more have rated it. <a href="privacy.html">Privacy</a></p>
  </footer>
</main>
