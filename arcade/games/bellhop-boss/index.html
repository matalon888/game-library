<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<script src="/arcade/save.js" defer data-ap-save></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bellhop Boss</title>
<meta name="theme-color" content="#bde8ff">
<link rel="icon" href="data:,">
<style>
  .bb-joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.6);pointer-events:none;z-index:7;display:none}
  .bb-joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
  .bb-cash{position:fixed;left:50%;transform:translateX(-50%);top:calc(56px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;background:rgba(30,40,70,.55);border-radius:22px;padding:2px 18px 0 6px;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:28px;color:#fff;pointer-events:none;z-index:5}
  .bb-cash b{display:inline-flex;width:34px;height:22px;border-radius:4px;background:linear-gradient(#5fd068,#2f9e44);border:2px solid #d8ffd0;align-items:center;justify-content:center;font-size:15px;color:#e9ffe0}
  .bb-cash.bump{animation:bbb .25s ease-out}
  @keyframes bbb{50%{transform:translateX(-50%) scale(1.15)}}
  .bb-goal{position:fixed;left:50%;transform:translateX(-50%);top:calc(100px + env(safe-area-inset-top));font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:15px;color:#fff;background:rgba(30,40,70,.35);border-radius:12px;padding:1px 12px 0;pointer-events:none;z-index:5;white-space:nowrap}
  .hc-score{display:none}
  body .hc-card h1{text-shadow:0 6px 0 #d0436f,0 10px 22px rgba(120,20,60,.25)}
  body .hc-card p,body .hc-card .hint{text-shadow:0 2px 0 rgba(120,20,60,.4),0 0 10px rgba(120,20,60,.3)}
  body .hc-pop{-webkit-text-stroke:2px rgba(60,30,60,.55);paint-order:stroke fill}
</style>
</head>
<body>
<script type="module" src="game.js"></script>
</body>
</html>
