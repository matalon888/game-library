<!doctype html>
<html lang="en"><head>
<script src="/arcade/save.js" defer data-ap-save></script>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="data:,">
<title>Tidewing: Jet Fighter Combat</title>
<meta name="description" content="Fly a jet fighter over a sunny tropical archipelago: dogfight drone squadrons, break SAM walls, sink a drone carrier and bring down an airborne fortress.">
<meta property="og:title" content="Tidewing: Jet Fighter Combat">
<meta property="og:description" content="Free 3D jet combat in your browser: six missions plus a daily Intercept run with a world leaderboard.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
body{background:#7fd3ff}
#hud{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#dmg{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;background:radial-gradient(ellipse at center,rgba(255,40,60,0) 45%,rgba(255,30,60,.55) 100%)}
#cloudfog{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;background:radial-gradient(ellipse at center,rgba(255,255,255,.75),rgba(240,246,255,.95))}
.hc-card{font-family:'Lilita One','Baloo 2',system-ui,sans-serif}
.hc-card h1{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;letter-spacing:1px;color:#fff;-webkit-text-stroke:3px #1d1633;paint-order:stroke fill;text-shadow:0 6px 0 #1d1633}
.hc-card p{color:#fff;-webkit-text-stroke:1.5px #1d1633;paint-order:stroke fill;text-shadow:0 3px 0 rgba(29,22,51,.6)}
.hc-card .hint{color:#ffd23f;-webkit-text-stroke:2px #1d1633;paint-order:stroke fill;font-size:26px}
.hc-card.dim{background:linear-gradient(180deg,rgba(40,20,80,.35),rgba(40,20,80,.55))}
.tw-start{padding-top:calc(70px + env(safe-area-inset-top))!important;background:linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(30,20,70,.45))}
.tw-start h1{font-size:clamp(58px,17vw,104px)!important;color:#ffd23f!important;transform:rotate(-3deg)}
.tw-start h1 small{display:block;font-size:.3em;color:#fff;letter-spacing:3px;margin-top:6px;-webkit-text-stroke:2px #1d1633}
.tw-start .brief{font-size:15px;max-width:520px;font-family:'Chakra Petch',system-ui;font-weight:700}
.tw-start .hint{margin-top:auto!important;margin-bottom:8px!important}
#menu{width:100%;max-width:760px;margin-bottom:6px}
#menu .ms{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
#menu .mc{font:inherit;cursor:pointer;border:3px solid #1d1633;border-radius:14px;background:#fff;color:#1d1633;padding:6px 4px 5px;box-shadow:0 4px 0 #1d1633;display:flex;flex-direction:column;align-items:center;line-height:1.05;min-height:58px}
#menu .mc b{font-size:20px;color:#1f8fff}#menu .mc span{font-size:11px;font-family:'Chakra Petch',system-ui;font-weight:700}#menu .mc em{font-style:normal;font-size:10px;color:#ff7a1a;font-family:'Chakra Petch'}
#menu .mc.on{background:#ffd23f;transform:translateY(-2px)}#menu .mc.lk{opacity:.55;background:#d9dce8}#menu .mc.int{background:#ff7a1a;color:#fff}#menu .mc.int b,#menu .mc.int span{color:#fff}#menu .mc.int.on{background:#ff3d7f}
@media(min-width:700px){#menu .ms{grid-template-columns:repeat(7,1fr)}}
.hc-btn{font-family:'Lilita One',system-ui;background:#1f8fff;border:3px solid #1d1633;box-shadow:0 5px 0 #1d1633}
.tw-menu{background:#fff!important;color:#1d1633!important;font-size:18px!important;padding:8px 22px!important;margin-top:6px}
#ctl{position:fixed;inset:0;pointer-events:none;z-index:4;font-family:'Chakra Petch',system-ui}
#ctl .zone{position:absolute;left:0;bottom:0;width:52%;height:58%;pointer-events:auto;touch-action:none}
#ctl .base{position:absolute;left:96px;top:calc(100% - 140px);width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(29,22,51,.18);transition:opacity .2s;opacity:.65}
#ctl .base.on{opacity:1}
#ctl .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#fff;border:3px solid #1d1633;box-shadow:0 3px 0 #1d1633}
#ctl .lbl{position:absolute;left:96px;bottom:20px;transform:translateX(-50%);color:#fff;font-size:11px;opacity:.7;text-shadow:0 1px 2px #000}
#ctl .b{position:absolute;pointer-events:auto;touch-action:none;border:3px solid #1d1633;border-radius:50%;font:700 13px 'Chakra Petch',system-ui;color:#fff;box-shadow:0 4px 0 #1d1633;-webkit-user-select:none;user-select:none}
#ctl .b.on{transform:translateY(3px);box-shadow:0 1px 0 #1d1633;filter:brightness(1.15)}
#ctl .gun{right:18px;bottom:calc(30px + env(safe-area-inset-bottom));width:92px;height:92px;background:#ff3d4f;font-size:16px}
#ctl .msl{right:122px;bottom:calc(40px + env(safe-area-inset-bottom));width:74px;height:74px;background:#1f8fff}
#ctl .flr{right:30px;bottom:calc(136px + env(safe-area-inset-bottom));width:62px;height:62px;background:#ffb020;font-size:11px}
#ctl .boost{right:104px;bottom:calc(128px + env(safe-area-inset-bottom));width:60px;height:60px;background:#ff7a1a;font-size:11px}
#ctl .brake{right:166px;bottom:calc(118px + env(safe-area-inset-bottom));width:52px;height:52px;background:#7d6bd6;font-size:10px}
#ctl .cam{right:12px;top:calc(176px + env(safe-area-inset-top));width:46px;height:46px;background:rgba(29,22,51,.55);font-size:10px;border-radius:12px}
#ctl.desk .keys{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(29,22,51,.45);padding:5px 12px;border-radius:10px;white-space:nowrap}
</style>
</head><body>
<script type="module" src="./game.js"></script>
</body></html>
