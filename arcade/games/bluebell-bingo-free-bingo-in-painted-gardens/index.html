<!doctype html>
<html lang="en">
<head>
<script src="/arcade/save.js" defer data-ap-save></script>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bluebell Bingo: Free Bingo in Painted Gardens</title>
<meta name="description" content="Free, calm 75-ball bingo with big readable cards, automatic daubing and a gentle caller. Play 1 to 4 cards through painted garden rooms and fill a stamp album. For fun only.">
<meta property="og:title" content="Bluebell Bingo: Free Bingo in Painted Gardens">
<meta property="og:description" content="Calm bingo with very large cards, auto-daub, slow calling and a caller voice. Painted garden rooms, a stamp album, fair draws and free coins only.">
<meta name="theme-color" content="#F4EEE0">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="preload" as="image" href="./assets/bg/bluebell-bingo.webp">
<style>
:root{--navy:#1F2D54;--navy2:#2c3f70;--rose:#B04A5C;--rose2:#c9687a;--sage:#567854;--gold:#B08834;--gold2:#d9b45e;--ivory:#FAF6EC;--cream:#F4EEE0;--ink:#1F2D54;
  --serif:'Libre Baskerville',Baskerville,Georgia,'Times New Roman',serif;--fs:1;--tap:56px}
html.big{--fs:1.15}
html,body{background:#F4EEE0}
body{color:var(--ink);font-family:var(--serif)!important}
.hc-score,.hc-top,.hc-sub,.hc-pill{display:none!important}
.bb{color:var(--ink)}
.bb,.bb *{font-family:var(--serif);-webkit-font-smoothing:antialiased;box-sizing:border-box}
.bb-hidden{display:none!important}
button{font-family:var(--serif)}

/* painted background: two layers for a soft cross-fade */
#bb-bg{position:fixed;inset:0;z-index:0;background:#F4EEE0 url(./assets/kit/paper.webp) repeat;background-size:360px}
#bb-bg i{position:absolute;inset:0;background-size:cover;background-position:center 40%;transition:opacity 1.1s ease;opacity:0}
#bb-bg i.on{opacity:1}
#bb-veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(250,246,236,.66),rgba(250,246,236,.18) 75%);opacity:0;transition:opacity .9s}
#bb-veil.on{opacity:1}
#bb-petals{position:fixed;inset:0;z-index:60;pointer-events:none;width:100%;height:100%}

/* buttons */
.bb-btn{pointer-events:auto;border:0;padding:0;cursor:pointer;font-family:var(--serif);color:var(--ink);touch-action:manipulation;transition:transform .12s ease,filter .2s,opacity .3s;-webkit-tap-highlight-color:transparent}
.bb-btn:active{transform:translateY(2px) scale(.98)}
.bb-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.bb-ic{flex:none;width:var(--tap);height:var(--tap);border-radius:50%;background:none;display:grid;place-items:center;filter:drop-shadow(0 3px 4px rgba(31,45,84,.25))}
.bb-ic img{width:100%;height:100%;display:block}
.bb-ic.off img{filter:grayscale(.6) brightness(1.15);opacity:.7}
.bb-ivory{background:linear-gradient(180deg,#fffdf7,#f3ead6);border:2px solid var(--gold2);box-shadow:0 0 0 1px rgba(176,136,52,.35) inset,0 4px 10px rgba(31,45,84,.16);border-radius:18px}
.bb-navy{background:linear-gradient(180deg,#30457a,#1F2D54);color:#FAF6EC;border:3px solid var(--gold2);box-shadow:0 0 0 2px rgba(255,240,200,.25) inset,0 6px 0 #142040,0 10px 22px rgba(31,45,84,.3);border-radius:999px}
.bb-rose{background:linear-gradient(180deg,#c9687a,#a8404f);color:#FAF6EC;border:3px solid var(--gold2);box-shadow:0 0 0 2px rgba(255,230,230,.25) inset,0 6px 0 #7c2c39,0 10px 22px rgba(120,40,60,.3);border-radius:999px}

/* top bar */
#bb-top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:76px;right:10px;display:flex;align-items:center;gap:8px;z-index:30;pointer-events:none}
#bb-top .sp{flex:1}
.bb-coins{display:flex;align-items:center;gap:8px;height:52px;padding:0 8px 0 4px;border-radius:999px;font-weight:700;font-size:22px;white-space:nowrap}
.bb-coins img{width:42px;height:42px}
.bb-coins .plus{width:34px;height:34px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;font-size:26px;line-height:1;font-family:Georgia,serif;border:2px solid var(--gold2)}
.bb-stars{display:flex;align-items:center;gap:6px;height:52px;padding:0 14px 0 6px;border-radius:999px;font-weight:700;font-size:22px}
.bb-stars img{width:36px;height:36px}
.bump{animation:bbbump .45s ease}
@keyframes bbbump{40%{transform:scale(1.12)}}

/* the world board button, restyled to match the painted kit (kit/board.js sets position) */
.bd-trophy{width:58px!important;height:58px!important;background:url(./assets/icons/trophy.webp) center/100% no-repeat!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;font-size:0!important;filter:drop-shadow(0 3px 4px rgba(31,45,84,.25))}
.bd-trophy small{font-size:12px!important;bottom:-6px!important}

/* ---------------- start card */
.hc-card{color:var(--ink)!important}
.hc-card h1,.hc-card p{text-shadow:none!important}
.bb-title{padding-top:calc(60px + env(safe-area-inset-top))!important;justify-content:flex-start!important}
.bb-title .logo{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;padding:26px 30px 22px;margin-top:4vh;width:min(360px,92vw)}
.bb-title .logo:before{content:'';position:absolute;inset:0;background:url(./assets/kit/cartouche.webp) center/100% 100% no-repeat;opacity:.96;filter:drop-shadow(0 8px 18px rgba(31,45,84,.18))}
.bb-title .logo>*{position:relative}
.bb-title .gar{width:200px;margin:-58px 0 0}
.bb-title h1{font:700 calc(48px*var(--fs))/1.02 var(--serif)!important;color:var(--navy);letter-spacing:-.01em;margin:4px 0 2px!important}
.bb-title h1 small{display:block;font:italic 400 24px/1.2 var(--serif);color:var(--rose);margin-top:6px}
.bb-title .balls{display:flex;gap:6px;margin:10px 0 0}
.bb-title .balls span{width:50px;height:50px;background-size:100%;display:grid;place-items:center;font:700 24px/1 var(--serif);color:var(--navy);animation:bbfloat 4s ease-in-out infinite}
.bb-title .forfun{font:400 20px/1.35 var(--serif);color:var(--navy);margin-top:12px;background:rgba(250,246,236,.86);border-radius:14px;padding:6px 14px}
.bb-title>p{font:italic 400 21px/1.3 var(--serif)!important;color:var(--rose);background:rgba(250,246,236,.85);padding:4px 14px;border-radius:12px}
.bb-title .hint{font:700 24px/1 var(--serif)!important;color:#FAF6EC;background:linear-gradient(180deg,#30457a,#1F2D54);border:3px solid var(--gold2);border-radius:999px;padding:16px 38px;margin-bottom:9vh!important;box-shadow:0 6px 0 #142040,0 10px 22px rgba(31,45,84,.3);animation:bbbreathe 2.6s ease-in-out infinite!important}
@keyframes bbfloat{50%{transform:translateY(-5px)}}
@keyframes bbbreathe{50%{transform:scale(1.04)}}

/* ---------------- lobby */
#bb-lobby{position:fixed;inset:0;z-index:10;pointer-events:none}
#bb-map{position:absolute;pointer-events:auto}
#bb-map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bb-stop{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;background:none}
.bb-stop .med{width:var(--m,72px);height:var(--m,72px);border-radius:50%;background-size:190%;background-position:50% 88%;border:4px solid var(--gold2);box-shadow:0 0 0 2px #fffaf0,0 0 0 3px rgba(176,136,52,.6),0 6px 14px rgba(31,45,84,.28);position:relative}
.bb-stop .nm{font:700 calc(20px*var(--fs))/1.1 var(--serif);color:var(--navy);background:rgba(250,246,236,.92);padding:3px 9px;border-radius:10px;white-space:nowrap;box-shadow:0 2px 6px rgba(31,45,84,.12)}
.bb-stop .st{font:700 17px/1 var(--serif);color:#8a6a22;background:rgba(250,246,236,.85);padding:2px 7px;border-radius:8px}
.bb-stop.lock .med{filter:grayscale(.85) brightness(1.08);opacity:.75}
.bb-stop.lock .med:after{content:'';position:absolute;inset:22%;background:url(./assets/icons/lock.webp) center/100% no-repeat}
.bb-stop.sel .med{border-color:var(--rose);box-shadow:0 0 0 3px #fffaf0,0 0 0 6px var(--rose2),0 8px 18px rgba(176,74,92,.35)}
.bb-stop .pin{position:absolute;top:-30px;left:50%;width:34px;margin-left:-17px;animation:bbfloat 2.6s ease-in-out infinite}
.bb-stop .plant{position:absolute;bottom:-2px;right:calc(var(--m,72px)*-.42);height:calc(var(--m,72px)*var(--ps,.78));pointer-events:none;filter:drop-shadow(0 2px 2px rgba(31,45,84,.2))}
#bb-panel{position:absolute;pointer-events:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,rgba(255,253,247,.96),rgba(246,239,224,.96));border:2px solid var(--gold2);border-radius:26px;box-shadow:0 0 0 1px rgba(176,136,52,.3) inset,0 12px 30px rgba(31,45,84,.22)}
#bb-panel:before{content:'';position:absolute;left:-16px;top:-26px;width:78px;height:84px;background:url(./assets/kit/corner-roses.webp) center/contain no-repeat;pointer-events:none}
#bb-panel.side .bb-row{grid-template-columns:1fr 1fr}
.bb-roombox{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.bb-sheet.room{padding-top:16px}
.bb-sheet.room .x{top:10px;right:10px}
.bb-roombox .bb-rt{margin-right:52px}
.bb-pline{display:flex;align-items:center;gap:12px;font:400 calc(19px*var(--fs))/1.3 var(--serif);color:var(--navy)}
.bb-pline b{display:block;font-size:calc(21px*var(--fs))}
.bb-pline .bb-mini{flex:none}
.bb-start{height:72px;font:700 calc(28px*var(--fs))/1 var(--serif)}
.bb-start.daily{background:linear-gradient(180deg,#c9687a,#a8404f);box-shadow:0 0 0 2px rgba(255,230,230,.25) inset,0 6px 0 #7c2c39,0 10px 22px rgba(120,40,60,.3)}
.bb-rt{display:flex;align-items:center;gap:8px;text-align:center}
.bb-rt .nav{background:none;width:var(--tap);height:var(--tap);flex:none;font:700 30px/1 Georgia,serif;color:var(--navy)}
.bb-rt .nav:disabled{opacity:.3}
.bb-rt div{flex:1}
.bb-rt b{display:block;font:700 calc(25px*var(--fs))/1.1 var(--serif);color:var(--navy)}
.bb-rt small{display:block;font:italic 400 calc(20px*var(--fs))/1.3 var(--serif);color:var(--rose)}
.bb-rounds{display:flex;justify-content:center;gap:8px}
.bb-round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--serif);color:var(--navy);background:#fffaf0;border:2px solid rgba(176,136,52,.5);position:relative}
.bb-round.done{background:linear-gradient(180deg,#6d916a,#567854);color:#fff;border-color:var(--gold2)}
.bb-round.cur{border:3px solid var(--rose);box-shadow:0 0 0 4px rgba(176,74,92,.18);animation:bbbreathe 2.6s ease-in-out infinite}
.bb-round.hard:not(.done){background:#fbeaea}
.bb-round small{position:absolute;bottom:-11px;font-size:12px;color:var(--gold);letter-spacing:-1px;background:#fffaf0;border-radius:6px;padding:0 2px}
.bb-cardsel{display:flex;align-items:center;gap:8px}
.bb-cardsel>span{font:700 calc(20px*var(--fs))/1 var(--serif);width:58px;flex:none;color:var(--navy)}
.bb-cardsel button{flex:1;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:16px}
.bb-cardsel button b{display:flex;gap:3px}
.bb-cardsel button b i{width:14px;height:18px;border-radius:3px;background:#fffaf0;border:2px solid var(--navy);display:block}
.bb-cardsel button small{font:700 18px/1 var(--serif);display:flex;align-items:center;gap:3px;color:var(--sage)}
.bb-cardsel button small img{width:20px;height:20px}
.bb-cardsel button.sel{background:linear-gradient(180deg,#30457a,#1F2D54);border-color:var(--gold2)}
.bb-cardsel button.sel b i{border-color:var(--gold2);background:#FAF6EC}
.bb-cardsel button.sel small{color:#fff}
.bb-cardsel button.poor{opacity:.55}
.bb-boost{display:flex;align-items:center;gap:12px;min-height:64px;padding:6px 14px;border-radius:16px;text-align:left;font:400 calc(20px*var(--fs))/1.2 var(--serif)}
.bb-boost .bx{width:32px;height:32px;border-radius:9px;border:2px solid var(--navy);flex:none;display:grid;place-items:center;background:#fff}
.bb-boost.on .bx{background:var(--sage);border-color:var(--sage)}
.bb-boost.on .bx:after{content:'✓';color:#fff;font:700 22px/1 Georgia,serif}
.bb-boost span{flex:1;font-weight:700}
.bb-boost small{display:block;font:italic 400 calc(18px*var(--fs))/1.2 var(--serif);opacity:.85}
.bb-boost em{font-style:normal;display:flex;align-items:center;gap:4px;font-weight:700;color:var(--gold)}
.bb-boost em img{width:24px}
.bb-play{height:76px;font:700 calc(28px*var(--fs))/1 var(--serif);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.bb-play small{font:italic 400 18px/1 var(--serif);opacity:.9}
.bb-play.daily{background:linear-gradient(180deg,#c9687a,#a8404f);box-shadow:0 0 0 2px rgba(255,230,230,.25) inset,0 6px 0 #7c2c39,0 10px 22px rgba(120,40,60,.3)}
.bb-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bb-tile{height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:16px;font:700 calc(18px*var(--fs))/1.1 var(--serif);position:relative}
.bb-tile img{width:44px;height:44px}
.bb-tile .n{position:absolute;top:-8px;right:-4px;background:var(--rose);color:#fff;border-radius:999px;padding:3px 8px;font:700 15px/1 var(--serif);border:2px solid #fffaf0}
.bb-forfun{text-align:center;white-space:nowrap;font:italic 400 calc(20px*var(--fs))/1.25 var(--serif);color:var(--navy);background:none;text-decoration:underline;text-decoration-color:rgba(176,136,52,.6);text-underline-offset:4px;min-height:32px}

/* ---------------- play */
#bb-play{position:fixed;inset:0;z-index:10;pointer-events:none}
#bb-caller{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 12px}
.bb-bigball{position:relative;flex:none;width:var(--bs,104px);height:var(--bs,104px)}
.bb-bigball .ball{position:absolute;inset:0;background-size:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;filter:drop-shadow(0 6px 8px rgba(31,45,84,.28))}
.bb-bigball .ball b{font:700 calc(var(--bs,104px)*.36)/1 var(--serif);color:var(--navy);letter-spacing:-.02em}
.bb-bigball .ball small{font:700 calc(var(--bs,104px)*.15)/1 var(--serif);color:var(--rose);margin-bottom:1px}
.bb-bigball .ball.in{animation:bbroll .6s cubic-bezier(.2,.8,.25,1)}
@keyframes bbroll{0%{transform:translateX(120%) rotate(200deg);opacity:0}60%{opacity:1}100%{transform:none}}
.bb-bigball .wait{position:absolute;inset:0;display:grid;place-items:center;font:italic 400 20px/1.2 var(--serif);text-align:center;color:var(--navy);border-radius:50%;border:2px dashed rgba(176,136,52,.6)}
.bb-callinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bb-callline{font:700 calc(22px*var(--fs))/1.15 var(--serif);color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb-callline i{font-weight:400;color:var(--rose)}
.bb-recent{display:flex;gap:5px;min-height:46px}
.bb-recent span{width:46px;height:46px;flex:none;background-size:100%;display:grid;place-items:center;font:700 19px/1 var(--serif);color:var(--navy);animation:bbpopin .5s ease}
@keyframes bbpopin{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.bb-left{font:400 calc(20px*var(--fs))/1 var(--serif);color:var(--navy)}
.bb-left b{font-weight:700}
.bb-left.low b{color:var(--rose)}
#bb-caller.col{flex-direction:column;justify-content:center;gap:10px;padding:16px}
#bb-caller.col .bb-callinfo{align-items:center;flex:none;width:100%}
#bb-caller.col .bb-callline{text-align:center;font-size:calc(24px*var(--fs))}
#bb-caller.col .bb-pat{position:absolute;top:12px;right:12px}
#bb-caller.col .bb-recent span{width:54px;height:54px;font-size:22px}
.bb-pat{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;width:78px}
.bb-mini{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:62px;height:62px;padding:3px;background:#fffaf0;border:2px solid var(--gold2);border-radius:8px}
.bb-mini i{border-radius:2px;background:rgba(31,45,84,.1)}
.bb-mini i.on{background:var(--rose)}
.bb-pat small{font:700 15px/1.1 var(--serif);color:var(--navy);text-align:center}

#bb-cards{position:absolute;display:grid;justify-content:center;align-content:center;pointer-events:auto}
.bb-card{--cs:40px;--cw:var(--cs);position:relative;padding:calc(var(--cs)*.14);padding-top:calc(var(--cs)*.1);border-radius:calc(var(--cs)*.32);background:#fffdf6 url(./assets/kit/paper.webp);background-size:300px;border:2px solid var(--gold2);box-shadow:0 0 0 1px rgba(176,136,52,.3) inset,0 0 0 4px rgba(255,250,240,.9),0 0 0 5px rgba(176,136,52,.45),0 10px 24px rgba(31,45,84,.2);transition:box-shadow .5s}
.bb-card.ready{box-shadow:0 0 0 1px rgba(176,136,52,.3) inset,0 0 0 4px #fffaf0,0 0 0 7px var(--rose2),0 10px 28px rgba(176,74,92,.4)}
.bb-head{display:grid;grid-template-columns:repeat(5,var(--cw));height:calc(var(--cs)*.7);align-items:center;justify-items:center}
.bb-head span{width:calc(var(--cs)*.64);height:calc(var(--cs)*.64);background-size:100%;display:grid;place-items:center;font:700 calc(var(--cs)*.3)/1 var(--serif);color:var(--navy)}
.bb-grid{display:grid;grid-template-columns:repeat(5,var(--cw));grid-auto-rows:var(--cs);border:1.5px solid var(--gold);border-radius:6px;overflow:hidden;background:rgba(176,136,52,.55);gap:1px}
.bb-cell{position:relative;display:grid;place-items:center;background:#fffcf3;cursor:pointer}
.bb-cell b{position:relative;z-index:2;font:700 var(--nf,22px)/1 var(--serif);color:var(--navy);letter-spacing:-.01em;font-variant-numeric:lining-nums;transition:color .3s}
.bb-cell .dab{position:absolute;inset:6%;left:calc(50% - var(--cs)*.44);right:calc(50% - var(--cs)*.44);background-size:100%;background-repeat:no-repeat;opacity:0;transform:scale(1.5) rotate(-20deg);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.9,.3,1.2);z-index:1}
.bb-cell.on .dab{opacity:.92;transform:none}
.bb-cell.on b{color:var(--ink-on,#1F2D54)}
.bb-cell.free .dab{background-image:url(./assets/bingo/bluebell-posy.webp)!important;opacity:1;transform:none;inset:4%;background-size:contain;background-position:center}
.bb-cell.free b{display:none}
.bb-cell.called:not(.on){background:#fff3cf;box-shadow:inset 0 0 0 3px var(--gold2);animation:bbglow 2.4s ease-in-out infinite}
@keyframes bbglow{50%{box-shadow:inset 0 0 0 2px var(--gold2);background:#fff9e6}}
.bb-cell.nope{animation:bbshake .3s}
@keyframes bbshake{30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
.bb-cell.won{background:#fde7ea}
.bb-cell .pz{position:absolute;top:1px;right:1px;width:42%;height:42%;background-size:contain;background-repeat:no-repeat;background-position:center;z-index:3;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.bb-cell .pz.coin{background-image:url(./assets/kit/coin.webp)}
.bb-card.pick .bb-cell:not(.on){background:#eef4ea;box-shadow:inset 0 0 0 2px var(--sage)}
.bb-badge{position:absolute;top:-14px;right:10px;z-index:4;background:var(--rose);color:#fff;font:700 16px/1 var(--serif);padding:6px 10px;border-radius:999px;border:2px solid #fffaf0;box-shadow:0 3px 8px rgba(120,40,60,.3)}
.bb-full{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(250,246,236,.6);border-radius:inherit}
.bb-full b{font:700 26px/1 var(--serif);color:var(--rose);background:#fffaf0;border:2px solid var(--gold2);padding:10px 16px;border-radius:14px}

#bb-fair{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;pointer-events:auto;font:italic 400 20px/1.2 var(--serif);color:var(--navy);background:none;min-height:34px}
#bb-fair span{background:rgba(250,246,236,.85);padding:5px 12px;border-radius:12px;text-decoration:underline;text-decoration-color:rgba(176,136,52,.6);text-underline-offset:3px}
#bb-bar{position:absolute;display:flex;align-items:center;justify-content:center;gap:12px;pointer-events:auto}
#bb-power{width:76px;height:76px;border-radius:50%;flex:none;position:relative;background:conic-gradient(var(--gold2) calc(var(--p,0)*1%),rgba(31,45,84,.12) 0);padding:5px}
#bb-power .in{width:100%;height:100%;border-radius:50%;background:#fffaf0;display:grid;place-items:center}
#bb-power img{width:52px;height:52px;opacity:.55;transition:opacity .3s}
