<!doctype html>
<html lang="en">
<head>
<script src="/arcade/save.js" defer data-ap-save></script>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lantern Bay: Story Choices</title>
<meta name="description" content="A free 3D interactive story game: solve the mystery of a dark lighthouse in a cozy seaside town, choose who you fall for, and make choices that change your relationships and every chapter's ending.">
<meta property="og:title" content="Lantern Bay: Story Choices">
<meta property="og:description" content="A cozy 3D mystery-romance you play by choosing. A dark lighthouse, a purple tearoom, two very different crushes and a town full of secrets. Free in your browser.">
<meta name="theme-color" content="#1b2142">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500;1,9..144,700;1,9..144,900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2142;--navy2:#2b3463;--ink:#2a2440;--gold:#ffc85a;--gold2:#f39c32;--rose:#ff6f86;--cream:#fff8ef;--lilac:#a77bff;--teal:#1fb3bf;--serif:'Fraunces',Georgia,serif;--sans:'Nunito',system-ui,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy)!important;font-family:var(--sans);color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas.hc-canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
.hc-score,.hc-sub,.hc-top,.hc-pill{display:none!important}
.hc-card{background:transparent!important;backdrop-filter:none!important;justify-content:flex-start!important;padding:0!important;color:var(--ink)!important;font-family:var(--sans)!important}
.hc-card>h1,.hc-card>.hint,.hc-card>p{display:none!important}
.hc-pop{font-family:var(--serif)!important;font-style:italic;color:#fff!important;text-shadow:0 3px 14px rgba(0,0,0,.45)!important;z-index:40!important}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
body.playing .bd-trophy, body.playing .bd-toast, body.playing #keyP{display:none!important}

/* loading */
#load{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% 30%,#3a4682,#1b2142 70%);color:var(--cream);transition:opacity .6s}
#load h1{font:italic 900 46px/1 var(--serif);margin:0 0 6px;color:#fff3d6;text-shadow:0 0 24px rgba(255,200,90,.55)}
#load small{letter-spacing:.32em;font-weight:900;font-size:12px;color:var(--gold)}
#load .bar{width:200px;height:8px;border-radius:9px;background:rgba(255,255,255,.15);margin-top:28px;overflow:hidden}#load .bar i{display:block;height:100%;width:3%;background:linear-gradient(90deg,var(--gold),var(--rose));border-radius:9px;transition:width .2s}
#load .lh{font-size:40px;margin-bottom:14px;filter:drop-shadow(0 0 12px rgba(255,200,90,.8))}

/* top HUD */
.topbar{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:30;display:flex;gap:6px;align-items:center}
.pill{display:flex;align-items:center;gap:5px;height:36px;padding:0 12px 0 8px;border-radius:20px;border:0;background:rgba(255,248,239,.94);box-shadow:0 3px 0 rgba(27,33,66,.25),0 6px 16px rgba(0,0,0,.18);font:900 16px var(--sans);color:var(--ink)}
.pill .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.pill.coin .ic{background:radial-gradient(circle at 35% 30%,#fff2b0,#ffc23d 55%,#d98a12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.pill.key .ic{background:radial-gradient(circle at 35% 30%,#e8f7ff,#9fd6ff 55%,#4a8fd0)}
.pill.coin em{font-style:normal;width:18px;height:18px;border-radius:50%;background:#4cc36b;color:#fff;font-size:14px;line-height:18px;text-align:center;margin-left:2px}
.pill small{font-size:11px;font-weight:800;opacity:.6;margin-left:2px}
.rbtn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,248,239,.94);box-shadow:0 3px 0 rgba(27,33,66,.25);font-size:17px;display:grid;place-items:center;color:var(--ink)}
#menuBtn{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:30}
#chap{position:fixed;top:calc(12px + env(safe-area-inset-top));left:56px;right:178px;z-index:29;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);pointer-events:none}
#chap b{display:block;font:900 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;opacity:.92}
#chap span{display:block;font:italic 700 15px/1.15 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chap i{display:block;height:4px;border-radius:4px;background:rgba(255,255,255,.28);margin-top:5px;max-width:180px;overflow:hidden}#chap i u{display:block;height:100%;width:0;background:var(--gold);border-radius:4px;transition:width .4s}

/* story layer */
#fade{position:fixed;inset:0;background:#0d1128;opacity:0;pointer-events:none;z-index:20;transition:opacity .45s}
#loc{position:fixed;left:0;right:0;top:40%;z-index:21;text-align:center;color:var(--cream);opacity:0;transition:opacity .5s,transform .8s;transform:translateY(8px);pointer-events:none}
#loc.on{opacity:1;transform:none}
#loc small{display:inline-block;font:900 11px var(--sans);letter-spacing:.32em;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
#loc h2{font:italic 800 32px/1.1 var(--serif);margin:0 20px;text-shadow:0 2px 20px rgba(0,0,0,.5)}
#loc i{display:block;width:60px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#tapzone{position:fixed;inset:0;z-index:10}
#bubble{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 24px));box-sizing:border-box;z-index:22;pointer-events:none;
  background:#fff;border-radius:24px;padding:22px 22px 26px;box-shadow:0 10px 30px rgba(20,16,40,.28),0 2px 0 rgba(0,0,0,.05);transition:opacity .2s, transform .25s;font:700 18.5px/1.42 var(--sans);color:var(--ink);min-height:96px}
#bubble.off{opacity:0;transform:translate(-50%,14px)}
#bubble .tag{position:absolute;top:-17px;left:18px;padding:5px 16px 6px;border-radius:16px;color:#fff;font:800 17px/1 var(--serif);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.18);letter-spacing:.01em}
#bubble .tail{position:absolute;top:-9px;width:22px;height:22px;background:#fff;transform:rotate(45deg);border-radius:4px;left:calc(50% - 11px);transition:left .3s}
#bubble p{margin:0;position:relative;white-space:pre-wrap}
#bubble .more{position:absolute;right:18px;bottom:8px;font-size:13px;color:var(--rose);animation:bob 1s infinite;opacity:0}
#bubble.done .more{opacity:1}
@keyframes bob{50%{transform:translateY(3px)}}
#bubble.narr{background:rgba(27,33,66,.9);color:var(--cream);font:italic 500 19px/1.45 var(--serif);text-align:center;border:1px solid rgba(255,200,90,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#bubble.narr .tag,#bubble.narr .tail{display:none}
#bubble.narr .more{color:var(--gold)}
#bubble.think{background:#fff;border:2.5px dashed #c9bfe0;font-style:italic;color:#4a4266}
#bubble.think .tail{display:none}
#bubble.think::before,#bubble.think::after{content:'';position:absolute;background:#fff;border:2px dashed #c9bfe0;border-radius:50%}
#bubble.think::before{width:16px;height:16px;top:-24px;left:var(--tx,50%)}#bubble.think::after{width:9px;height:9px;top:-38px;left:calc(var(--tx,50%) + 12px)}
#choices{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(520px,calc(100% - 28px));z-index:23;display:flex;flex-direction:column;gap:10px}
#choices .prompt{margin:0 0 4px;padding:10px 16px;border-radius:16px;background:rgba(27,33,66,.86);color:var(--cream);font:italic 600 16px/1.35 var(--serif);text-align:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.opt{position:relative;display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:0;border-radius:18px;padding:15px 16px 15px 18px;background:#fff;color:var(--ink);font:800 16.5px/1.3 var(--sans);box-shadow:0 4px 0 #d8cde8,0 8px 18px rgba(20,16,40,.18);opacity:0;transform:translateY(16px) scale(.98);animation:optIn .38s cubic-bezier(.2,1.4,.4,1) forwards}
.opt:active{transform:translateY(3px)!important;box-shadow:0 1px 0 #d8cde8}
.opt span{flex:1}
.opt.prem{background:linear-gradient(180deg,#fff7dc,#ffe08f);box-shadow:0 4px 0 #e2a63c,0 8px 18px rgba(160,100,0,.25)}
.opt .cost{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:12px;background:#fff;font:900 15px var(--sans);color:#b06a00;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.opt .cost i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2b0,#ffc23d 55%,#d98a12);display:inline-block}
.opt .gem{position:absolute;top:-9px;left:14px;font:900 10px var(--sans);letter-spacing:.14em;background:linear-gradient(90deg,#ff6f86,#a77bff);color:#fff;padding:3px 8px;border-radius:8px}
.opt .paid{color:#3a9a55}
@keyframes optIn{to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:35;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.tchip{display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;border-radius:24px;background:rgba(255,248,239,.97);box-shadow:0 6px 18px rgba(0,0,0,.22);font:800 15px var(--sans);color:var(--ink);animation:chip 2.8s ease forwards}
.tchip img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#eee}
.tchip .h{color:var(--rose);font-size:17px}
.tchip.note{font:italic 700 15px var(--serif);background:rgba(27,33,66,.92);color:var(--cream);padding:8px 16px}
.tchip.gold{background:linear-gradient(90deg,#fff6d6,#ffe39a)}
@keyframes chip{0%{opacity:0;transform:translateY(-10px) scale(.9)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
#flash{position:fixed;inset:0;background:#fff6dc;opacity:0;pointer-events:none;z-index:19;transition:opacity .25s}

/* polaroid pop */
#snap{position:fixed;left:50%;top:22%;z-index:36;transform:translate(-50%,0) rotate(-4deg) scale(.6);opacity:0;pointer-events:none;background:#fff;padding:9px 9px 34px;border-radius:4px;box-shadow:0 14px 40px rgba(0,0,0,.35);transition:all .5s cubic-bezier(.2,1.3,.4,1)}
#snap.on{opacity:1;transform:translate(-50%,0) rotate(-4deg) scale(1)}
#snap img{display:block;width:150px;height:200px;object-fit:cover;background:#ddd}
#snap b{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:italic 700 13px var(--serif);color:var(--ink)}
#snap small{position:absolute;top:-12px;right:-12px;background:var(--rose);color:#fff;font:900 11px var(--sans);letter-spacing:.1em;padding:5px 9px;border-radius:12px;transform:rotate(8deg)}

/* lobby (inside the kit start card) */
.lob{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(56px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));box-sizing:border-box;pointer-events:none}
.lob>*{pointer-events:auto}
.logo{text-align:center;pointer-events:none!important;margin-top:4px}
.logo h1{margin:0;font:italic 900 clamp(46px,13vw,68px)/.95 var(--serif);color:#fff4dc;text-shadow:0 0 28px rgba(255,190,90,.65),0 3px 0 rgba(120,60,20,.35);letter-spacing:-.01em}
.logo .rib{display:inline-block;margin-top:8px;padding:6px 18px 7px;border-radius:14px;background:linear-gradient(90deg,var(--rose),#c06bff);color:#fff;font:900 12px var(--sans);letter-spacing:.34em;box-shadow:0 3px 0 rgba(80,20,60,.3)}
.lspace{flex:1}
.book{width:min(460px,100%);box-sizing:border-box;border-radius:26px;background:rgba(255,248,239,.95);box-shadow:0 14px 40px rgba(10,12,30,.4);padding:16px 16px 14px;position:relative;cursor:pointer}
.book .bk{font:900 11px var(--sans);letter-spacing:.24em;color:#9a7bd6;text-transform:uppercase}
.book h2{margin:4px 0 4px;font:italic 800 25px/1.08 var(--serif);color:var(--ink)}
.book p{margin:0 0 12px;font:600 14.5px/1.38 var(--sans);color:#5a5270}
.book .chn{position:absolute;right:14px;top:12px;font:900 12px var(--sans);color:#fff;background:var(--navy);border-radius:10px;padding:4px 9px}
.play{width:100%;border:0;border-radius:20px;padding:15px 18px;background:linear-gradient(180deg,#ffd77a,#f5a23a);color:#5a2c00;font:900 21px var(--sans);box-shadow:0 5px 0 #c9741c,0 10px 20px rgba(200,110,20,.3);display:flex;align-items:center;justify-content:center;gap:10px}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #c9741c}
.play .kc{display:flex;align-items:center;gap:4px;font-size:15px;background:rgba(255,255,255,.65);border-radius:12px;padding:3px 9px}
.play.free .kc{background:#4cc36b;color:#fff}
.lrow{display:flex;gap:8px;width:min(460px,100%);margin-top:10px}
.sq{flex:1;border:0;border-radius:18px;padding:9px 4px 8px;background:rgba(255,248,239,.95);box-shadow:0 4px 0 rgba(27,33,66,.35);font:900 12.5px var(--sans);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.sq .e{font-size:23px;line-height:1.1}
.sq b{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--rose);color:#fff;font:900 12px/20px var(--sans);padding:0 5px;box-sizing:border-box}
.who{margin-top:8px;display:flex;align-items:center;gap:8px;border:0;background:rgba(27,33,66,.7);color:var(--cream);border-radius:20px;padding:6px 14px 6px 6px;font:800 13.5px var(--sans);backdrop-filter:blur(6px)}
.who img{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:50% 10%;background:#3a4682}
.streak{margin-top:6px;font:800 13px var(--sans);color:#ffe2a6;text-shadow:0 1px 4px rgba(0,0,0,.5)}

/* sheets */
#sheet{position:fixed;inset:0;z-index:45;background:rgba(13,17,40,.55);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#sheet>.in{width:min(560px,100%);max-height:88%;display:flex;flex-direction:column;background:var(--cream);border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .35s cubic-bezier(.2,1.2,.4,1);padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:700px){#sheet{align-items:center}#sheet>.in{border-radius:28px;max-height:84%}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-h{display:flex;align-items:center;gap:10px;padding:18px 18px 10px}
.sh-h h3{flex:1;margin:0;font:italic 800 24px var(--serif)}
.sh-x{width:36px;height:36px;border-radius:50%;border:0;background:#ece3f3;font:900 16px var(--sans);color:var(--ink)}
.sh-b{overflow:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:6px;padding:0 16px 8px}
.tabs button{flex:1;border:0;border-radius:14px;padding:9px 6px;background:#ece3f3;font:900 13.5px var(--sans);color:#6a5a8a}
.tabs button.on{background:var(--navy);color:#fff}
.chrow{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:18px;background:#fff;margin-bottom:9px;box-shadow:0 3px 0 #e6dcef;position:relative}
.chrow .num{flex:0 0 46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(160deg,#ffe7b0,#ffc1cb)}
.chrow.soon{opacity:.62;background:#f6f1f8}.chrow.soon .num{background:#e7e1ef;filter:grayscale(1)}
.chrow h4{margin:0;font:italic 800 18px/1.15 var(--serif)}
.chrow small{display:block;font:900 10.5px var(--sans);letter-spacing:.16em;color:#9a7bd6;text-transform:uppercase;margin-bottom:2px}
.chrow p{margin:3px 0 0;font:600 13.5px/1.35 var(--sans);color:#5a5270}
.chrow .st{position:absolute;right:12px;top:12px;font:900 11px var(--sans);padding:3px 8px;border-radius:9px;background:#e8f8ec;color:#2f8a4a}
.chrow .st.cur{background:#fff0d0;color:#b06a00}.chrow .st.lock{background:#eee;color:#888}
.chrow button.rp{margin-top:8px;border:0;border-radius:12px;padding:6px 12px;background:#efe7f7;font:900 12.5px var(--sans);color:#5b3fa0}
.trail{position:relative;margin-left:22px;padding-left:22px;border-left:3px dashed #d7c9ea}
.person{background:#fff;border-radius:20px;padding:12px;margin-bottom:12px;box-shadow:0 3px 0 #e6dcef}
.person .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.person .ph img{width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:50% 8%;border:3px solid var(--c);background:#eee}
.person .ph h4{margin:0;font:italic 800 18px var(--serif)}
.person .ph small{font:800 12px var(--sans);color:#7a6f90}
.hearts{color:var(--rose);font-size:14px;letter-spacing:1px}
.hearts i{color:#e3d9ec;font-style:normal}
.pols{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px}
.pol{flex:0 0 108px;background:#fff;padding:6px 6px 26px;border-radius:3px;box-shadow:0 4px 12px rgba(0,0,0,.18);position:relative;transform:rotate(var(--r,-2deg))}
.pol img,.pol .blank{display:block;width:96px;height:124px;object-fit:cover;background:#ece6f2;border-radius:2px}
.pol .blank{display:grid;place-items:center;font-size:26px;color:#c9bcd9}
.pol b{position:absolute;left:4px;right:4px;bottom:5px;font:italic 700 10.5px/1.1 var(--serif);text-align:center;color:var(--ink)}
.pol .pr{position:absolute;top:-6px;right:-6px;font-size:14px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.stamp{background:#fff;border-radius:14px;padding:10px 8px;text-align:center;box-shadow:0 3px 0 #e6dcef;border:2px dashed #e3d6ef}
.stamp .i{font-size:30px}.stamp b{display:block;font:italic 800 12.5px/1.15 var(--serif);margin-top:4px}.stamp p{margin:4px 0 0;font:600 11px/1.3 var(--sans);color:#6a6082}
.stamp.off{opacity:.45;filter:grayscale(1)}.stamp.off .i{filter:blur(1px)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.week div{aspect-ratio:1;border-radius:12px;background:#efe7f7;display:grid;place-items:center;font:900 12px var(--sans);color:#9a8ab8}
.week div.ok{background:linear-gradient(160deg,#ffe7b0,#ffc1cb);color:var(--ink);font-size:18px}
.week div.today{outline:3px solid var(--gold)}
.mbtn{display:block;width:100%;border:0;border-radius:16px;padding:14px;margin-bottom:9px;background:#fff;font:900 16px var(--sans);color:var(--ink);box-shadow:0 3px 0 #e6dcef;text-align:left}
.mbtn.on{background:#e8f8ec}
input.name{width:100%;box-sizing:border-box;border:2px solid #e3d6ef;border-radius:14px;padding:12px 14px;font:800 18px var(--sans);color:var(--ink);background:#fff;margin:4px 0 10px;user-select:text;-webkit-user-select:text}
.note{font:600 13px/1.4 var(--sans);color:#6a6082;margin:4px 0 10px}
.keygate{text-align:center;padding:4px 6px 6px}
.keygate .big{font-size:52px}.keygate h4{margin:4px 0;font:italic 800 22px var(--serif)}.keygate p{font:600 15px/1.4 var(--sans);color:#5a5270;margin:0 0 14px}

/* outfit picker */
#outfit{position:fixed;left:0;right:0;bottom:0;z-index:24;padding:0 0 calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
#outfit .head{background:rgba(27,33,66,.9);color:var(--cream);font:italic 600 15px/1.3 var(--serif);text-align:center;padding:9px 16px;border-radius:16px;margin:0 14px 8px;max-width:500px}
#outfit .row{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 6px;width:100%;box-sizing:border-box;max-width:620px;scroll-snap-type:x mandatory}
.look{flex:0 0 104px;scroll-snap-align:center;border:0;border-radius:18px;background:#fff;padding:8px 6px 9px;box-shadow:0 4px 0 #d8cde8;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.look .sw{width:56px;height:56px;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.look b{font:800 12.5px/1.1 var(--sans);text-align:center}.look small{font:700 10.5px/1.15 var(--sans);color:#7a6f90;text-align:center}
.look.on{outline:3px solid var(--gold2);background:#fff8e6}
.look .c{position:absolute;top:-8px;right:-6px;display:flex;align-items:center;gap:3px;background:linear-gradient(180deg,#ffe08f,#f5b13a);border-radius:10px;padding:2px 7px;font:900 12px var(--sans);color:#6a3a00}
.look img.sw{object-fit:cover;object-position:50% 8%;background:#eee}
#outfit .ok{margin-top:6px;width:min(320px,80%)}
#outfit .agph-bar{margin:4px 14px 0;max-width:560px;width:calc(100% - 28px);box-sizing:border-box}

/* daily case board */
#case{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:24;width:min(560px,calc(100% - 20px))}
#case .clues{background:rgba(27,33,66,.92);color:var(--cream);border-radius:18px;padding:10px 14px;font:600 14px/1.4 var(--sans);margin-bottom:8px}
#case .clues b{color:var(--gold);font:900 11px var(--sans);letter-spacing:.2em;display:block;margin-bottom:2px}
#case .clues li{margin:2px 0 2px 16px}
#case .sus{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.su{border:0;border-radius:16px;background:#fff;padding:6px 3px 7px;box-shadow:0 4px 0 #d8cde8;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.su img{width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:50% 8%;background:#eee;border:3px solid var(--c)}
.su b{font:900 12px var(--sans)}.su span{font-size:15px;letter-spacing:1px}
.su.x{opacity:.4;filter:grayscale(1)}.su.x::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;font:900 44px var(--sans);color:#d43a4a}
.su.ok{background:#e8f8ec;outline:3px solid #4cc36b}
#case .crow{display:flex;gap:8px;margin-top:8px}#case .crow button{flex:1}
.ghost{border:0;border-radius:16px;padding:11px;background:rgba(255,248,239,.95);font:900 14px var(--sans);color:var(--ink);box-shadow:0 3px 0 rgba(27,33,66,.3)}

/* chapter end card (inside the kit win card) */
.endc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(30px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));box-sizing:border-box;background:radial-gradient(120% 70% at 50% 35%,rgba(43,52,99,.94),rgba(13,17,40,.97));color:var(--cream);text-align:center;overflow:auto}
.endc .k{font:900 12px var(--sans);letter-spacing:.3em;color:var(--gold)}
.endc h2{margin:6px 0 2px;font:italic 900 34px/1.05 var(--serif);color:#fff4dc;text-shadow:0 0 22px rgba(255,190,90,.45)}
.endc .cl{margin:14px auto 12px;max-width:440px;padding:14px 16px;border-radius:18px;border:1px solid rgba(255,200,90,.4);background:rgba(255,255,255,.06);font:italic 600 17.5px/1.45 var(--serif)}
.endc .cl small{display:block;font:900 10.5px var(--sans);font-style:normal;letter-spacing:.22em;color:var(--rose);margin-bottom:4px}
.endc .rels{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 10px}
.endc .rel{display:flex;align-items:center;gap:6px;background:rgba(255,248,239,.95);color:var(--ink);border-radius:20px;padding:4px 12px 4px 4px;font:900 13px var(--sans)}
.endc .rel img{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:50% 8%}
.endc .pols{justify-content:flex-start;max-width:min(100%,480px);margin:0 auto}
.endc .coins{display:flex;align-items:center;gap:8px;justify-content:center;margin:10px 0 4px;font:900 20px var(--sans)}
.endc .coins i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2b0,#ffc23d 55%,#d98a12)}
.endc .dbl{border:0;border-radius:16px;padding:10px 16px;background:linear-gradient(180deg,#8fe3a8,#3fb86a);color:#fff;font:900 15px var(--sans);box-shadow:0 4px 0 #2a8a4c;margin:4px 0 6px}
.endc .tap{margin-top:12px;font:800 14px var(--sans);opacity:.75;animation:bob 1.4s infinite}
.endc .grid{font-size:26px;letter-spacing:4px;margin:8px 0}
.hc-card .hc-btn{position:relative;z-index:2;margin:0!important;font:900 15px var(--sans)!important;padding:10px 22px!important;background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.3)!important;box-shadow:none!important;border-radius:16px!important}
.hc-card.hc-hidden{display:none!important}
.sharewrap{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:3}
@media (min-width:900px){ #bubble{bottom:28px} #choices{bottom:28px} .lob{padding-top:44px} }
