<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Doodle Legs</title>
<meta name="theme-color" content="#8f9cf7">
<link rel="icon" href="data:,">
<style>
  body { background: linear-gradient(180deg, var(--bg1, #8f9cf7), var(--bg2, #e9b9f4)); }
  .hc-card { background: rgba(70, 60, 160, .16); }
  .hc-card.dim { background: rgba(40, 30, 80, .42); }
  .hc-bar { position: relative; overflow: visible; }
  .hc-bar b { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 4px; border: 2px solid #fff; box-shadow: 0 2px 0 rgba(0,0,0,.15); transition: left .2s; }
  #pad { position: fixed; left: 0; right: 0; width: 90%; max-width: 520px; margin: 0 auto; bottom: calc(2.6% + env(safe-area-inset-bottom)); height: 27%; border-radius: 30px; z-index: 3;
    border: 3.5px dashed rgba(255,255,255,.9); background: rgba(255,255,255,.34); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 8px 24px rgba(60,40,140,.12);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); transition: transform .15s, background .2s; }
  #pad.hot { background: rgba(255,255,255,.5); }
  #pad.nudge { animation: nudge .5s ease-in-out 2; border-color: #fff36b; }
  @keyframes nudge { 50% { transform: scale(1.04); } }
  #pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #padHint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-weight: 800; font-size: 19px; color: rgba(255,255,255,.95);
    text-shadow: 0 2px 0 rgba(60,40,140,.25); pointer-events: none; transition: opacity .3s; }
  .tag { position: fixed; z-index: 2; transform: translate(-50%, -100%); padding: 1px 10px; border-radius: 9px; font-weight: 800; font-size: 13px;
    color: #fff; background: rgba(70, 70, 110, .55); pointer-events: none; white-space: nowrap; }
  .tag i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: 0; }
</style>
</head>
<body>
<div id="pad"><canvas id="ink"></canvas><div id="padHint">Tap or draw legs here!</div></div>
<script type="module" src="game.js"></script>
</body>
</html>
