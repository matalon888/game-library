<!DOCTYPE html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<script src="/arcade/save.js" defer data-ap-save></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<style>
  :root{--bg:#141527;--card:#20223d;--card2:#2b2e52;--ink:#eef0ff;--muted:#9aa0cf;--accent:#ffb703;--good:#4ade80}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(1000px 700px at 50% -10%,#232645,#141527);padding:22px}
  h1{margin:0;font-size:clamp(26px,5vw,42px);font-weight:800}
  .hud{display:flex;gap:28px;font-size:16px;color:var(--muted)}
  .hud b{color:var(--ink);font-size:22px}
  .grid{display:grid;grid-template-columns:repeat(4,84px);gap:12px}
  .card{width:84px;height:84px;position:relative;cursor:pointer;perspective:600px}
  .inner{position:absolute;inset:0;transition:transform .4s;transform-style:preserve-3d}
  .card.flip .inner,.card.matched .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;
    backface-visibility:hidden;font-size:40px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
  .front{background:linear-gradient(145deg,var(--card2),var(--card));color:transparent}
  .front::after{content:"?";color:var(--muted);font-size:34px;font-weight:800}
  .back{background:#fff;transform:rotateY(180deg)}
  .card.matched .back{background:#e9fff1;box-shadow:0 0 0 3px var(--good) inset}
  .btn{background:var(--accent);color:#241a00;border:none;padding:12px 24px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer}
  .btn:hover{opacity:.92}
  .win{color:var(--good);font-weight:800;min-height:22px}
</style>
</head>
<body>
  <h1>🧠 Memory Match</h1>
  <div class="hud"><span>Moves <b id="moves">0</b></span><span>Time <b id="time">0s</b></span><span>Pairs <b id="pairs">0/8</b></span></div>
  <div class="grid" id="grid"></div>
  <div class="win" id="win"></div>
  <button class="btn" id="restart">New Game</button>
<script>
const EMOJI=['🍎','🚀','🎸','🐱','🌸','⚽','🍕','🎲'];
const grid=document.getElementById('grid');
let first=null,lock=false,moves=0,matched=0,timer=null,seconds=0,started=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function build(){
  clearInterval(timer); seconds=0; moves=0; matched=0; started=false; first=null; lock=false;
  document.getElementById('moves').textContent=0;
  document.getElementById('time').textContent='0s';
  document.getElementById('pairs').textContent='0/8';
  document.getElementById('win').textContent='';
  grid.innerHTML='';
  const deck=shuffle([...EMOJI,...EMOJI]);
  deck.forEach(sym=>{
    const c=document.createElement('div'); c.className='card'; c.dataset.sym=sym;
    c.innerHTML=`<div class="inner"><div class="face front"></div><div class="face back">${sym}</div></div>`;
    c.onclick=()=>flip(c);
    grid.appendChild(c);
  });
}
function startTimer(){
  started=true;
  timer=setInterval(()=>{seconds++;document.getElementById('time').textContent=seconds+'s';},1000);
}
function flip(c){
  if(lock||c.classList.contains('flip')||c.classList.contains('matched'))return;
  if(!started)startTimer();
  c.classList.add('flip');
  if(!first){first=c;return;}
  moves++; document.getElementById('moves').textContent=moves;
  if(first.dataset.sym===c.dataset.sym){
    first.classList.add('matched'); c.classList.add('matched');
    first=null; matched++;
    document.getElementById('pairs').textContent=matched+'/8';
    if(matched===8){clearInterval(timer);
      document.getElementById('win').textContent=`🎉 Solved in ${moves} moves and ${seconds}s!`;}
  }else{
    lock=true;
    const a=first;setTimeout(()=>{if(first!==a)return;a.classList.remove('flip');c.classList.remove('flip');first=null;lock=false;},800);
  }
}
document.getElementById('restart').onclick=build;
build();
</script>
</body>
</html>
