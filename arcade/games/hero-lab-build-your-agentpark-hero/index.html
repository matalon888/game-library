<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hero Lab: Build Your AGENTPARK Hero</title>
<meta name="description" content="Pick a hero, villain, athlete, animal, robot or street-style icon, then gear them up with hats, shades, wings and weapons, recolor the outfit and take your hero into every AGENTPARK game.">
<meta property="og:title" content="Hero Lab: Build Your AGENTPARK Hero">
<meta property="og:description" content="Pick a hero, gear them up, recolor them and take them into every AGENTPARK game.">
<meta name="theme-color" content="#16133d">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;700;800;900&display=swap">
<style>
:root{--ink:#16133d;--ink2:#211d58;--ink3:#2d2873;--line:rgba(255,255,255,.09);--txt:#fff;--mut:#a9a4d8;--acc:#ff5dbb;--acc2:#7b5cff;--lime:#c6ff3d;--gold:#ffd23f;--tag:#3a86ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--txt);font-family:Rubik,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:0 0 54%;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,#ffffff 0%,#eae6ff 38%,#c9c3f5 70%,#a79fe8 100%);touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.topbar{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:4}
.brand{pointer-events:auto;display:flex;flex-direction:column;line-height:.9;filter:drop-shadow(0 3px 0 rgba(22,19,61,.18))}
.brand b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:28px;letter-spacing:.5px;background:linear-gradient(90deg,#7b5cff,#ff5dbb 60%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font-size:10px;font-weight:900;letter-spacing:3px;color:#5b55a8;margin-top:3px}
.actions{display:flex;gap:8px;pointer-events:auto}
.ibtn{width:46px;height:46px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 4px 0 #b9b2ee,0 8px 18px rgba(60,40,160,.18);transition:transform .12s}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9b2ee}
.savebtn{height:46px;padding:0 18px;border-radius:16px;background:linear-gradient(180deg,#d8ff63,#9be22d);color:#1b3300;font-weight:900;font-size:17px;letter-spacing:.5px;box-shadow:0 4px 0 #5f9a12,0 8px 18px rgba(80,140,0,.3);display:flex;align-items:center;gap:6px;transition:transform .12s}
.savebtn:active{transform:translateY(3px);box-shadow:0 1px 0 #5f9a12}
.plate{position:absolute;left:0;top:0;transform:translate(-50%,-100%);z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:3px;transition:opacity .25s;white-space:nowrap}
.plate .pname{font-family:'Lilita One',sans-serif;font-size:22px;line-height:1;padding:7px 16px 6px;border-radius:14px;color:#fff;background:linear-gradient(180deg,var(--tag),color-mix(in srgb,var(--tag) 70%,#000));box-shadow:0 4px 0 color-mix(in srgb,var(--tag) 55%,#000),0 10px 20px rgba(30,20,90,.25);border:2px solid rgba(255,255,255,.55);letter-spacing:.3px}
.plate .prole{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#4a438f;background:rgba(255,255,255,.8);padding:3px 9px;border-radius:9px}
.moves{position:absolute;left:0;right:0;bottom:34px;display:flex;justify-content:center;gap:7px;z-index:4;pointer-events:none}
.mv{pointer-events:auto;width:58px;height:48px;padding:0;border-radius:14px;flex-direction:column;justify-content:center;gap:1px!important;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);color:#2d2873;font-weight:800;font-size:10.5px;display:flex;align-items:center;gap:5px;box-shadow:0 3px 0 rgba(90,80,180,.35);transition:transform .12s}
.mv i{font-style:normal;font-size:18px;line-height:1}
.mv.on{background:#2d2873;color:#fff;box-shadow:0 3px 0 #110e33}
.mv:active{transform:translateY(2px) scale(.96)}
.zoom{position:absolute;right:10px;bottom:96px;display:flex;flex-direction:column;gap:6px;z-index:4}
.zoom button{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.85);color:#2d2873;font-weight:900;font-size:20px;box-shadow:0 3px 0 rgba(90,80,180,.35)}
.loader{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:6px solid rgba(123,92,255,.18);border-top-color:#7b5cff;animation:spin .8s linear infinite;z-index:3;opacity:0;transition:opacity .2s;pointer-events:none}
.loader.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{position:absolute;left:12px;bottom:92px;font-size:11px;font-weight:800;color:#5b55a8;letter-spacing:1px;text-transform:uppercase;opacity:.75;z-index:4;pointer-events:none;transition:opacity .6s}
#panel{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--ink);border-radius:26px 26px 0 0;margin-top:-22px;z-index:5;box-shadow:0 -10px 30px rgba(20,10,80,.3)}
.tabs{display:flex;gap:5px;padding:10px 8px 8px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 50px;min-width:50px;height:58px;border-radius:16px;background:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:11px;color:var(--mut);box-shadow:0 4px 0 #0d0b2a;transition:transform .12s,background .2s,color .2s}
.tab i{font-style:normal;font-size:21px;line-height:1;filter:saturate(.7)}
.tab.on{background:linear-gradient(180deg,#8d6bff,#6a45ff);color:#fff;box-shadow:0 4px 0 #3c22b3,0 8px 18px rgba(106,69,255,.4);transform:translateY(-2px)}
.tab.on i{filter:none;transform:scale(1.1)}
.tab:active{transform:translateY(2px)}
.chips{display:flex;gap:6px;padding:2px 10px 8px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.chips:empty{display:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:30px;padding:0 13px;border-radius:15px;background:var(--ink2);color:var(--mut);font-weight:800;font-size:12.5px;border:2px solid transparent;transition:all .15s}
.chip.on{background:#fff;color:var(--ink);border-color:#fff}
.body{flex:1;min-height:0;overflow-y:auto;padding:4px 10px calc(16px + env(safe-area-inset-bottom));scrollbar-width:thin;scrollbar-color:#3a347f transparent;touch-action:pan-y}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{position:relative;aspect-ratio:1/1.12;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--c,#7b5cff) 75%,#fff 10%),color-mix(in srgb,var(--c,#7b5cff) 55%,#16133d));box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .14s;display:block;width:100%}
.tile:active{transform:scale(.95)}
.tile img{position:absolute;inset:0 0 18% 0;width:100%;height:82%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3));transition:transform .25s}
.tile:hover img{transform:scale(1.06)}
.tile::before{content:'';position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 40%,rgba(255,255,255,.35),transparent 70%)}
.tile .nm{position:absolute;left:0;right:0;bottom:0;padding:5px 4px 6px;font-size:11.5px;font-weight:800;text-align:center;background:linear-gradient(0deg,rgba(14,10,46,.85),rgba(14,10,46,0));line-height:1.05;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.tile.on{outline:3px solid #fff;outline-offset:-3px;box-shadow:0 0 0 3px var(--acc2),0 6px 18px rgba(123,92,255,.6)}
.tile.on::after{content:'✓';position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--lime);color:#1b3300;font-weight:900;font-size:13px;display:grid;place-items:center}
.tile.soon img{filter:grayscale(1) brightness(.75) opacity(.55)}
.tile.soon .badge{position:absolute;top:7px;left:7px;font-size:9.5px;font-weight:900;letter-spacing:1px;background:rgba(10,8,40,.75);color:#ffd23f;padding:3px 6px;border-radius:7px}
.tile.none{display:grid;place-items:center;background:var(--ink2)}
.tile.none>span:first-child{font-size:30px;opacity:.6;margin-bottom:14px}
.tile .tg{position:absolute;top:7px;left:7px;font-size:13px}
.sec{margin:6px 2px 8px;font-size:12px;font-weight:900;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.sec button{font-size:11px;letter-spacing:1px;color:#fff;background:var(--ink3);padding:5px 10px;border-radius:9px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sw{width:38px;height:38px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.25);transition:transform .12s}
.sw.on{box-shadow:0 0 0 3px #fff,0 3px 0 rgba(0,0,0,.35);transform:scale(1.08)}
.sw:active{transform:scale(.9)}
.slider{margin:4px 0 14px}
.slider label{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--mut);margin-bottom:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;border-radius:9px;background:var(--trk,linear-gradient(90deg,#333,#fff));outline:none;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--ink3);box-shadow:0 3px 8px rgba(0,0,0,.4);cursor:grab}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--ink3)}
.lock{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--mut);margin:-4px 0 14px}
.tgl{width:46px;height:26px;border-radius:13px;background:var(--ink3);position:relative;transition:background .2s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tgl.on{background:#2ec27e}.tgl.on::after{left:23px}
.namebox{display:flex;gap:8px;margin:6px 0 12px}
.namebox input{flex:1;min-width:0;height:54px;border-radius:16px;border:3px solid var(--ink3);background:#0e0c2c;color:#fff;font-family:'Lilita One',sans-serif;font-size:24px;padding:0 14px;outline:none;user-select:text;-webkit-user-select:text}
.namebox input:focus{border-color:var(--acc2)}
.namebox button{width:54px;height:54px;border-radius:16px;background:var(--ink3);font-size:24px;box-shadow:0 4px 0 #0d0b2a}
.sugg{display:flex;flex-wrap:wrap;gap:7px}
.sugg button{height:34px;padding:0 12px;border-radius:12px;background:var(--ink2);font-weight:800;font-size:13px;box-shadow:0 3px 0 #0d0b2a}
.note{font-size:12.5px;line-height:1.45;color:var(--mut);margin:14px 2px 0}
.note b{color:#fff}
.slotchips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;background:#fff;color:var(--ink);font-weight:900;padding:10px 18px;border-radius:16px;box-shadow:0 8px 24px rgba(30,20,90,.3);z-index:30;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(12,9,40,.72);backdrop-filter:blur(6px);z-index:40;display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{width:min(560px,100%);background:var(--ink2);border-radius:24px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:28px;margin:2px 4px 4px}
.card p{margin:0 4px 12px;color:var(--mut);font-size:13.5px;line-height:1.4}
.card img{width:100%;border-radius:14px;display:block;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.card .row{display:flex;gap:8px;margin-top:14px}
.card .row a,.card .row button{flex:1;height:50px;border-radius:15px;display:grid;place-items:center;font-weight:900;font-size:15px;text-decoration:none;color:#fff;background:var(--ink3);box-shadow:0 4px 0 #0d0b2a}
.card .row .go{background:linear-gradient(180deg,#d8ff63,#9be22d);color:#1b3300;box-shadow:0 4px 0 #5f9a12;flex:1.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;display:block;line-height:50px;text-align:center}
body.back .brand{display:none}
.playas{pointer-events:auto;flex:0 1 auto;min-width:0;margin-right:8px;height:46px;padding:0 14px;border-radius:16px;background:linear-gradient(180deg,#8d6bff,#6a45ff);color:#fff;font-weight:900;font-size:14px;box-shadow:0 4px 0 #3c22b3,0 8px 18px rgba(106,69,255,.35);max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.playas b{font-weight:900;color:var(--lime)}
.playas:active{transform:translateY(3px);box-shadow:0 1px 0 #3c22b3}
.playas[hidden]{display:none}
.myh{margin:0 0 6px}
.myh .cnt{font-size:11px;letter-spacing:1px;color:var(--mut);background:var(--ink2);padding:3px 8px;border-radius:8px}
.mhrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px;margin:0 -2px}
.mhrow::-webkit-scrollbar{display:none}
.mh{position:relative;flex:0 0 auto}
.mhb{width:72px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mhb i{position:relative;display:block;width:68px;height:68px;border-radius:18px;overflow:hidden;background:radial-gradient(80% 70% at 50% 35%,#efeaff,#b9b0f2 70%,#8f84e0);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .14s}
.mhb i img{position:absolute;inset:2px;width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.mhb span{max-width:72px;font-size:11px;font-weight:800;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhb:active i{transform:scale(.93)}
.mhb.new i{background:transparent;border:2px dashed rgba(255,255,255,.3);box-shadow:none;display:grid;place-items:center;font-style:normal;font-size:28px;color:#fff;box-sizing:border-box}
.mh.on .mhb i{box-shadow:0 0 0 3px var(--lime),0 4px 0 rgba(0,0,0,.35)}
.mh.on .mhb.new i{border-color:var(--lime);box-shadow:none}
.mh.on .mhb span{color:#fff}
.mhx{position:absolute;top:-5px;right:-3px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#2d2873;color:#fff;font-size:11px;font-weight:900;box-shadow:0 2px 0 #0d0b2a;border:2px solid var(--ink)}
.mhx.arm{background:#ff4d6d}
@media (min-width:900px){
  #app{flex-direction:row}
  #stage{flex:1 1 auto}
  #panel{flex:0 0 440px;margin:0;border-radius:0;box-shadow:-10px 0 30px rgba(20,10,80,.25)}
  .tabs{padding:16px 12px 10px}
  .tab{height:66px;font-size:12px}
  .tab i{font-size:24px}
  .chips{padding:2px 14px 10px}
  .body{padding:4px 14px 20px}
  .grid{gap:11px}
  .brand b{font-size:38px}
  .topbar{padding:18px 22px 0}
  .moves{bottom:22px;gap:9px}
  .mv{width:68px;height:56px;font-size:12px}
  .mv i{font-size:22px}
  .hint{left:22px;bottom:30px}
  .zoom{right:22px;bottom:24px}
}
@media (max-height:700px) and (max-width:899px){#stage{flex-basis:50%}.tab{height:50px}.tab i{font-size:18px}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="topbar">
      <div class="brand"><b>HERO LAB</b><small>AGENTPARK</small></div>
      <button class="playas" id="playas" hidden>▶ Play as <b>Hero</b></button>
      <div class="actions"><button class="ibtn" id="rand" title="Randomize" aria-label="Randomize">🎲</button><button class="savebtn" id="save">💾 Save</button></div>
    </div>
    <div class="plate" id="plate"><span class="pname" id="pname">Hero</span><span class="prole" id="prole"></span></div>
    <div class="loader" id="loader"></div>
    <div class="hint" id="hint">Drag to spin · pinch to zoom</div>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
    <div class="moves" id="moves"></div>
  </div>
  <div id="panel">
    <nav class="tabs" id="tabs"></nav>
    <div class="chips" id="chips"></div>
    <div class="body" id="body"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card"><h2 id="mtitle">Hero saved!</h2><p id="mtext"></p><img id="mimg" alt="Hero share card"><div class="row"><a id="mdl" download="my-agentpark-hero.png" href="#">⬇ Card</a><button id="mshare">Share</button><button class="go" id="mdone">Done</button></div></div></div>
<script type="module" src="main.js"></script>
</body>
</html>
