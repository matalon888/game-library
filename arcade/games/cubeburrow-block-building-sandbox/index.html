<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<script src="/arcade/save.js" defer data-ap-save></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Cubeburrow: Block Building Sandbox</title>
<meta name="description" content="Explore a new block island every day: dig caves, chop trees, craft bricks, glass and lamps, and finish today's build goals before night falls. Free sandbox in your browser.">
<meta property="og:title" content="Cubeburrow: Block Building Sandbox">
<meta property="og:description" content="A first-person block island to dig, craft and build on, with a daily build challenge and a free sandbox.">
<meta name="theme-color" content="#7cc4ff">
<link rel="icon" href="data:,">
<style>
  body{background:#7cc4ff}
  .cb-cross{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;z-index:3;pointer-events:none}
  .cb-cross:before,.cb-cross:after{content:'';position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);border-radius:2px}
  .cb-cross:before{left:10px;top:0;width:2px;height:22px}.cb-cross:after{top:10px;left:0;height:2px;width:22px}
  .cb-ring{position:fixed;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:3;pointer-events:none;opacity:0;transition:opacity .1s}
  .cb-ring circle{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 2px rgba(0,0,0,.5))}
  .cb-goals{position:fixed;left:10px;top:calc(60px + env(safe-area-inset-top));z-index:5;background:rgba(18,24,48,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:16px;padding:8px 12px 9px;min-width:200px;max-width:min(270px,70vw);pointer-events:none;border:1px solid rgba(255,255,255,.18)}
  .cb-goals h3{margin:0 0 4px;font-size:13px;letter-spacing:.06em;font-weight:800;opacity:.85;display:flex;justify-content:space-between;gap:10px}
  .cb-goals h3 b{color:#ffd84d;font-size:15px;letter-spacing:0}
  .cb-g{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;line-height:1.25;margin-top:3px}
  .cb-g i{flex:none;width:18px;height:18px;border-radius:6px;border:2px solid rgba(255,255,255,.75);display:grid;place-items:center;font-style:normal;font-size:12px}
  .cb-g.done i{background:#57d16a;border-color:#57d16a}
  .cb-g.done span{opacity:.7;text-decoration:line-through}
  .cb-g em{margin-left:auto;font-style:normal;font-size:12px;opacity:.85;padding-left:6px;white-space:nowrap}
  .cb-time{position:fixed;right:10px;top:calc(12px + env(safe-area-inset-top));z-index:5;background:rgba(18,24,48,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:16px;padding:3px 12px;font-weight:800;font-size:20px;pointer-events:none;border:1px solid rgba(255,255,255,.18)}
  .cb-time.low{color:#ffd84d}
  .cb-exit{position:fixed;right:10px;top:calc(56px + env(safe-area-inset-top));z-index:6;font:inherit;font-weight:800;font-size:15px;color:#fff;background:rgba(18,24,48,.55);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:4px 12px;cursor:pointer}
  .cb-hot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:4px;padding:5px;background:rgba(18,24,48,.6);border-radius:16px;border:1px solid rgba(255,255,255,.2);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
  .cb-hot::-webkit-scrollbar{display:none}
  .cb-slot{flex:none;width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.12);position:relative;display:grid;place-items:center;cursor:pointer;border:2px solid transparent}
  .cb-slot.on{border-color:#fff;background:rgba(255,255,255,.3);box-shadow:0 0 0 2px rgba(255,216,77,.8)}
  .cb-slot img{width:36px;height:36px;image-rendering:pixelated;pointer-events:none}
  .cb-slot b{position:absolute;right:2px;bottom:-1px;font-size:13px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.9)}
  .cb-craft{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:6px;max-width:calc(100vw - 16px)}
  .cb-chip{display:flex;align-items:center;gap:2px;background:#fff;color:#2b2d42;border-radius:13px;padding:3px 8px 3px 5px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.22);animation:cbin .3s cubic-bezier(.2,1.6,.4,1) both;white-space:nowrap}
  .cb-chip:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
  .cb-chip img{width:24px;height:24px;image-rendering:pixelated}
  .cb-chip u{text-decoration:none;color:#ff8c42;margin:0 1px}
  .cb-chip:before{content:'🔨';font-size:13px;margin-right:2px}
  @keyframes cbin{from{opacity:0;transform:translateY(12px) scale(.7)}}
  .cb-btn{position:fixed;z-index:6;border-radius:50%;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.7);box-shadow:0 4px 12px rgba(0,0,0,.2);touch-action:none;cursor:pointer;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .cb-btn.on{background:rgba(255,255,255,.55);transform:scale(.94)}
  .cb-btn img{width:38px;height:38px;image-rendering:pixelated;pointer-events:none}
  .cb-btn small{position:absolute;bottom:-18px;font-size:12px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap}
  .cb-mine{width:84px;height:84px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom))}
  .cb-place{width:68px;height:68px;right:112px;bottom:calc(132px + env(safe-area-inset-bottom))}
  .cb-jump{width:62px;height:62px;right:26px;bottom:calc(262px + env(safe-area-inset-bottom))}
  .cb-joy{position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.5);z-index:3;pointer-events:none}
  .cb-joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .cb-keys{position:fixed;left:50%;transform:translateX(-50%);top:calc(18px + env(safe-area-inset-top));z-index:5;font-size:13px;font-weight:700;opacity:.85;pointer-events:none;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .cb-sg{background:rgba(18,24,48,.42);border-radius:18px;padding:10px 16px 12px;font-weight:700;font-size:16px;text-align:left;width:min(320px,86vw);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);margin-top:6px}
  .cb-sg h4{margin:0 0 4px;font-size:13px;letter-spacing:.08em;opacity:.8}
  .cb-sg div{margin-top:3px}
  .cb-modebtn{pointer-events:auto;font:inherit;font-weight:800;font-size:15px;color:#fff;background:rgba(18,24,48,.5);border:2px solid rgba(255,255,255,.55);border-radius:30px;padding:6px 16px;cursor:pointer;margin-top:4px}
  .cb-modebtn b{color:#ffd84d}
  .hc-card h1{text-shadow:0 5px 0 rgba(20,40,90,.35)}
  .hc-card p{text-shadow:0 2px 3px rgba(0,0,0,.35)}
  .hc-card .hint{text-shadow:0 2px 3px rgba(0,0,0,.4)}
  .cb-flashred{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(transparent 55%,rgba(255,80,60,.45));opacity:0;transition:opacity .25s}
  .cb-hidden{display:none!important}
</style>
</head>
<body>
<script type="module" src="game.js"></script>
</body>
</html>
