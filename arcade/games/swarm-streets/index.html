<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Swarm Streets</title>
<meta name="theme-color" content="#8d93a8">
<link rel="icon" href="data:,">
<style>
  .timer{position:fixed;top:calc(54px + env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:6;pointer-events:none;font-weight:800;font-size:34px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  .timer.hot{color:#ffdf3a;animation:tk .5s ease-in-out infinite}
  @keyframes tk{50%{transform:scale(1.12)}}
  .kills{position:fixed;top:calc(60px + env(safe-area-inset-top));right:14px;z-index:6;background:rgba(0,0,0,.28);border-radius:16px;padding:2px 12px;font-weight:800;font-size:16px;pointer-events:none}
  .rank{position:fixed;top:calc(60px + env(safe-area-inset-top));left:14px;z-index:6;background:rgba(0,0,0,.28);border-radius:16px;padding:2px 12px;font-weight:800;font-size:16px;pointer-events:none}
  .edge{position:fixed;z-index:4;pointer-events:none;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2);transition:opacity .2s}
  .edge::after{content:'';position:absolute;width:0;height:0;border:7px solid transparent;border-left:9px solid var(--c);left:28px;top:8px;transform-origin:-13px 7px;transform:rotate(var(--a))}
</style>
</head>
<body>
<div class="timer" id="timer">0:15</div>
<div class="kills" id="kills">☠ 0</div>
<div class="rank" id="rank">#1</div>
<script type="module" src="game.js"></script>
</body>
</html>
