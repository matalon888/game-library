<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<script src="/arcade/save.js" defer data-ap-save></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Keepsake Lane: Hidden Objects</title>
<meta name="description" content="Find hidden objects in the cozy 3D rooms of Nana's old house: turn and zoom each room, spot everything on the list, and recover a family keepsake in every scene. Free hidden object game.">
<meta property="og:title" content="Keepsake Lane: Hidden Objects">
<meta property="og:description" content="A cozy hidden object story in 3D rooms you can turn and zoom. Find the objects, restore Nana's house, recover the family keepsakes.">
<meta name="theme-color" content="#f6d7c3">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--plum:#4b2a45;--plum2:#6d3b62;--cream:#fff7ea;--gold:#ffc35a;--rose:#ff8fa8;--ui:#e46d8c}
body{background:#f6d7c3}
.hc-card,.hc-pop,.ks-hud,.ks-panel,.ks-bubble,.ks-mapcard,.ks-float,.ks-startbtns,.ks-load{font-family:'Fredoka','Baloo 2',system-ui,sans-serif}
.hc-card{justify-content:flex-start;padding-top:calc(70px + env(safe-area-inset-top))!important}
.hc-card h1{font-weight:700;color:#fff3d6;-webkit-text-stroke:3px var(--plum);paint-order:stroke fill;text-shadow:0 6px 0 var(--plum),0 12px 26px rgba(75,42,69,.35)!important;letter-spacing:.5px}
.hc-card p{color:#fff;-webkit-text-stroke:1.2px var(--plum);paint-order:stroke fill;text-shadow:0 3px 0 rgba(75,42,69,.5)!important;font-weight:600}
.hc-card .hint{color:#fff;font-weight:700;-webkit-text-stroke:1.5px var(--plum);paint-order:stroke fill;text-shadow:0 3px 0 var(--plum)!important;font-size:24px!important}
.hc-card.dim{background:linear-gradient(180deg,rgba(75,42,69,.15),rgba(75,42,69,.55))}
#ks-start{background:linear-gradient(180deg,rgba(255,236,214,.0) 35%,rgba(75,42,69,.42))}
#ks-start h1{font-size:clamp(58px,17vw,96px)!important;line-height:.86!important;transform:rotate(-3deg)}
#ks-start .hint{margin-top:auto;margin-bottom:calc(196px + env(safe-area-inset-bottom))!important}
.ks-sub{margin-top:-2px;font-weight:700;font-size:20px;letter-spacing:4px;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,#f28aa6,#d65f86);padding:3px 16px 2px;border-radius:12px;box-shadow:0 4px 0 var(--plum),0 8px 18px rgba(75,42,69,.3);border:2px solid var(--plum);transform:rotate(-3deg)}
.ks-startinfo{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:8px}
.ks-chap{background:rgba(255,247,234,.94);color:var(--plum);font-weight:600;font-size:15px;padding:5px 14px;border-radius:14px;border:2px solid rgba(75,42,69,.25)}
.ks-stars{color:#fff4c8;font-weight:700;font-size:17px;-webkit-text-stroke:1px var(--plum);paint-order:stroke fill}
.ks-startbtns{position:fixed;left:0;right:0;bottom:calc(132px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;z-index:11}
.ks-btn{font:inherit;font-weight:700;font-size:17px;color:var(--plum);background:linear-gradient(180deg,#fffaf0,#ffe6c8);border:3px solid var(--plum);border-radius:18px;padding:8px 16px 6px;box-shadow:0 5px 0 var(--plum);cursor:pointer}
.ks-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--plum)}
.ks-heroes{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(480px,calc(100% - 24px));z-index:11}
.ks-heroes .agph-bar{--agph-acc:#e46d8c;border:3px solid var(--plum);box-shadow:0 5px 0 var(--plum)}
/* HUD */
.ks-hud{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));height:62px;z-index:6;pointer-events:none;transition:opacity .3s,transform .3s}
.ks-off{opacity:0;pointer-events:none!important;transform:translateY(-8px)}
.ks-panel.ks-off{transform:translateY(30px)}
.ks-timer{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#fffaf0,#ffe9cf);border:3px solid var(--plum);border-radius:22px;padding:2px 16px 0 10px;box-shadow:0 4px 0 var(--plum);color:var(--plum)}
.ks-timer i{font-style:normal;font-size:20px}.ks-timer b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:58px}
.ks-timer.low{background:linear-gradient(180deg,#ffd6d6,#ff9a9a);animation:kslow .8s ease-in-out infinite}
.ks-timer.hit{animation:kshit .35s}
@keyframes kslow{50%{transform:translateX(-50%) scale(1.07)}}@keyframes kshit{30%{transform:translateX(-50%) translateX(-6px)}60%{transform:translateX(-50%) translateX(6px)}}
.ks-room{position:absolute;left:0;right:0;top:46px;text-align:center;font-weight:600;font-size:13px;color:#fff;-webkit-text-stroke:1px var(--plum);paint-order:stroke fill;text-shadow:0 2px 0 rgba(75,42,69,.5)}
.ks-score{position:absolute;right:12px;top:2px;display:flex;align-items:center;gap:4px;background:rgba(75,42,69,.78);border:2px solid rgba(255,255,255,.5);border-radius:16px;padding:2px 12px 0 8px;color:#fff;font-weight:700;font-size:20px}
.ks-score i{font-style:normal;color:var(--gold)}
.ks-mute{position:absolute;right:12px;top:40px;pointer-events:auto;background:rgba(75,42,69,.55);border:2px solid rgba(255,255,255,.45);border-radius:14px;font-size:16px;width:38px;height:30px;cursor:pointer}
/* bottom list */
.ks-panel{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:8px;align-items:stretch;transition:opacity .3s,transform .3s}
.ks-list{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px;background:linear-gradient(180deg,#fffaf1,#fbe8cf);border:3px solid var(--plum);border-radius:20px;box-shadow:0 5px 0 var(--plum),0 10px 30px rgba(75,42,69,.25);position:relative}
.ks-list::before{content:'';position:absolute;inset:3px;border:1.5px dashed rgba(109,59,98,.28);border-radius:15px;pointer-events:none}
.ks-item{position:relative;display:flex;align-items:center;justify-content:center;min-height:38px;border-radius:12px;background:rgba(255,255,255,.65);color:var(--plum);font-weight:600;font-size:15px;line-height:1.05;text-align:center;padding:2px 4px;transition:transform .25s,background .25s}
.ks-list.ks-many .ks-item{min-height:31px;font-size:13.5px}
.ks-item.sil img{height:36px;width:36px;object-fit:contain;filter:drop-shadow(0 1px 0 rgba(255,255,255,.8))}
.ks-list.ks-many .ks-item.sil img{height:29px;width:29px}
.ks-item .ok{position:absolute;right:3px;top:1px;font-style:normal;font-weight:700;color:#3aa66a;font-size:16px;opacity:0;transform:scale(.2);transition:all .3s cubic-bezier(.3,1.8,.5,1)}
.ks-item.done{background:rgba(196,236,203,.75);animation:ksdone .45s}
.ks-item.done span{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.ks-item.done .ok{opacity:1;transform:scale(1)}
@keyframes ksdone{40%{transform:scale(1.18)}}
.ks-tools{display:flex;flex-direction:column;gap:8px;width:66px}
.ks-hint,.ks-glass{position:relative;flex:1;border:3px solid var(--plum);border-radius:20px;background:linear-gradient(180deg,#ffe08a,#ffb347);box-shadow:0 5px 0 var(--plum);cursor:pointer;padding:0;display:grid;place-items:center;font-size:26px}
.ks-hint{flex:1.5}
.ks-hint svg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);transform:rotate(-90deg)}
.ks-hint svg circle{fill:none;stroke-width:5}.ks-hint .bg{stroke:rgba(75,42,69,.15)}.ks-hint .fg{stroke:#fff;stroke-dasharray:182;stroke-linecap:round;transition:stroke-dashoffset .25s}
.ks-hint:not(.ready){filter:saturate(.35) brightness(.95)}
.ks-hint.ready{animation:ksready 1.6s ease-in-out infinite}
@keyframes ksready{50%{transform:scale(1.05)}}
.ks-hint em,.ks-glass em{position:absolute;right:-6px;bottom:-6px;font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--plum);border-radius:10px;padding:1px 6px;min-width:12px}
.ks-hint em:empty{display:none}
.ks-glass{background:linear-gradient(180deg,#c9f2d4,#7fd6a0);font-size:20px}.ks-glass.empty{filter:grayscale(.8) opacity(.75)}
.ks-hint:active,.ks-glass:active{transform:translateY(3px);box-shadow:0 2px 0 var(--plum)}
.ks-zoom{position:fixed;right:10px;bottom:calc(196px + env(safe-area-inset-bottom));z-index:6;display:flex;flex-direction:column;gap:8px;transition:opacity .3s}
.ks-zoom button{width:44px;height:44px;border-radius:50%;border:3px solid var(--plum);background:rgba(255,250,240,.92);color:var(--plum);font-size:24px;font-weight:700;box-shadow:0 4px 0 var(--plum);cursor:pointer;line-height:1}
.ks-zoom button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--plum)}
/* Nana's speech bubble */
.ks-bubble{position:fixed;left:50%;transform:translateX(-50%);top:calc(286px + env(safe-area-inset-top));width:min(420px,calc(100% - 28px));z-index:12;display:flex;gap:10px;align-items:center;background:var(--cream);border:3px solid var(--plum);border-radius:22px;padding:8px 14px 8px 8px;box-shadow:0 6px 0 var(--plum),0 14px 30px rgba(75,42,69,.3);transition:opacity .3s,transform .3s;pointer-events:none}
.ks-bubble.ks-off{transform:translateX(-50%) translateY(10px)}
.ks-bubble img{width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,#ffe0ea,#ffc8a8);border:3px solid var(--plum);object-fit:cover;object-position:50% 12%;flex:none}
.ks-bubble b{color:#d65f86;font-size:14px;font-weight:700}.ks-bubble p{margin:0;color:var(--plum);font-size:15.5px;font-weight:500;line-height:1.25}
.ks-bubble.ks-low{top:auto;bottom:calc(150px + env(safe-area-inset-bottom))}
/* effects */
.ks-float{position:fixed;transform:translate(-50%,-50%);font-weight:700;pointer-events:none;z-index:20;-webkit-text-stroke:2px var(--plum);paint-order:stroke fill;text-shadow:0 3px 0 var(--plum);animation:ksfloat 1s ease-out forwards;white-space:nowrap}
@keyframes ksfloat{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-150%) scale(1)}}
.ks-miss{position:fixed;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:4px solid #ff5d6c;color:#ff5d6c;font-size:30px;font-weight:700;display:grid;place-items:center;pointer-events:none;z-index:20;animation:ksmiss .7s ease-out forwards;background:rgba(255,255,255,.35)}
@keyframes ksmiss{0%{transform:translate(-50%,-50%) scale(.4)}25%{transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}
.ks-fly{position:fixed;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none;z-index:21;transition:transform .6s cubic-bezier(.5,-0.3,.7,1),opacity .6s ease-in;filter:drop-shadow(0 6px 8px rgba(75,42,69,.35))}
/* win card */
.ks-win{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px}
.ks-wstars{display:flex;gap:6px}.ks-wstars i{font-style:normal;font-size:58px;color:rgba(75,42,69,.35);-webkit-text-stroke:3px var(--plum);paint-order:stroke fill;transition:transform .35s cubic-bezier(.3,1.8,.5,1),color .2s;transform:scale(.8)}
.ks-wstars i:nth-child(2){transform:scale(.9) translateY(-10px)}
.ks-wstars i.on{color:var(--gold);transform:scale(1.15)}.ks-wstars i:nth-child(2).on{transform:scale(1.3) translateY(-12px)}
.ks-wscore{display:flex;flex-direction:column;align-items:center;color:#fff;-webkit-text-stroke:1.5px var(--plum);paint-order:stroke fill}
.ks-wscore b{font-size:42px;font-weight:700;text-shadow:0 4px 0 var(--plum)}.ks-wscore small{font-size:15px;font-weight:600}
.ks-keep{display:flex;align-items:center;gap:10px;background:var(--cream);border:3px solid var(--plum);border-radius:18px;padding:10px 14px;max-width:340px;box-shadow:0 5px 0 var(--plum);text-align:left}
.ks-keep span{font-size:34px}.ks-keep b{color:#d65f86;font-size:16px;-webkit-text-stroke:0}.ks-keep p{margin:2px 0 0;color:var(--plum)!important;font-size:14.5px!important;-webkit-text-stroke:0!important;text-shadow:none!important;font-weight:500!important}
.hc-card .hc-btn{font-family:'Fredoka',system-ui;background:linear-gradient(180deg,#f28aa6,#d65f86);border:3px solid var(--plum);box-shadow:0 5px 0 var(--plum)}
/* journey map */
.ks-mapwrap{position:fixed;inset:0;z-index:30;background:rgba(75,42,69,.45);display:grid;place-items:center}
.ks-mapwrap[hidden]{display:none}
.ks-mapcard{position:relative;width:min(520px,calc(100% - 24px));max-height:calc(100% - 60px);overflow:auto;background:linear-gradient(180deg,#fffaf1,#fbe6cc);border:3px solid var(--plum);border-radius:24px;box-shadow:0 8px 0 var(--plum);padding:16px 14px;color:var(--plum)}
.ks-mapcard h2{margin:0;text-align:center;font-size:28px}.ks-mapsub{text-align:center;margin:2px 0 10px;font-size:14px;font-weight:600;opacity:.8}
.ks-x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--plum);cursor:pointer}
.ks-ch{background:rgba(255,255,255,.7);border-radius:16px;padding:8px 10px;margin-bottom:8px;border:2px solid rgba(75,42,69,.15)}
.ks-ch.locked{opacity:.55}
.ks-chh{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}.ks-chh b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#d65f86;color:#fff;font-size:15px}.ks-chh i{font-style:normal;margin-left:auto}
.ks-lv{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ks-lv button{font:inherit;border:2px solid var(--plum);border-radius:12px;background:#fff;color:var(--plum);padding:4px 0 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1}
.ks-lv button b{font-size:17px}.ks-lv button small{font-size:10px;color:#e0a020;min-height:11px}
.ks-lv button.cur{background:#ffe08a;box-shadow:0 0 0 3px #fff,0 0 0 5px #d65f86}
.ks-lv button:disabled{background:#eee;opacity:.6;cursor:default}
/* loading veil */
.ks-veil{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 40%,#ffe9d6,#f1c3b4);display:grid;place-items:center;transition:opacity .6s}
.ks-veil.gone{opacity:0;pointer-events:none}
.ks-load{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--plum)}.ks-load b{font-size:20px}
.ks-load i{display:block;width:200px;height:12px;border-radius:8px;background:rgba(75,42,69,.15);overflow:hidden;border:2px solid var(--plum)}.ks-load u{display:block;height:100%;width:0;background:linear-gradient(90deg,#f28aa6,#ffc35a);transition:width .2s}
@media (min-aspect-ratio:1/1) and (min-width:760px){
  .ks-panel{left:50%;right:auto;transform:translateX(-50%);width:min(860px,calc(100% - 40px))}
  .ks-panel.ks-off{transform:translateX(-50%) translateY(30px)}
  .ks-list{grid-template-columns:repeat(5,1fr)}
  .ks-tools{flex-direction:row;width:150px}
  .ks-zoom{bottom:auto;top:50%;transform:translateY(-50%)}
  .ks-bubble{top:auto;bottom:calc(150px + env(safe-area-inset-bottom));left:calc(50% - 300px);transform:none}
  .ks-bubble.ks-off{transform:translateY(10px)}
  #ks-start .hint{margin-bottom:150px!important}
  .ks-startbtns{bottom:96px}
  .ks-heroes{left:16px;transform:none;width:min(380px,30vw)}
}
</style>
</head>
<body>
<script type="module" src="game.js"></script>
</body>
</html>
