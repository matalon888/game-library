<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Starlit Crush: Romance Story Choices</title>
<meta name="description" content="A free kawaii 3D romance story game: start art college, name yourself, pick your outfits and choose who you fall for. Every choice changes how Sol, Mika and June feel about you.">
<meta property="og:title" content="Starlit Crush: Romance Story Choices">
<meta property="og:description" content="Art college, three crushes and a letter signed with a star. A sweet, funny interactive love story in chibi 3D where your choices shape every relationship. Free in your browser.">
<meta name="theme-color" content="#c9a8ff">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff5fa2;--pink2:#ff9fcb;--pink3:#ffd3e6;--lilac:#a97cff;--lilac2:#d9c6ff;--lilac3:#f1e9ff;--mint:#5fdcb6;--butter:#ffd95a;--ink:#4a2d6e;--ink2:#7b62a0;--cream:#fff8fc;--round:'Fredoka','Baloo 2',system-ui,sans-serif;--sans:'Nunito',system-ui,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#d9c6ff!important;font-family:var(--sans);color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas.hc-canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
.hc-score,.hc-sub,.hc-top,.hc-pill{display:none!important}
.hc-card{background:transparent!important;backdrop-filter:none!important;justify-content:flex-start!important;padding:0!important;color:var(--ink)!important;font-family:var(--sans)!important}
.hc-card>h1,.hc-card>.hint,.hc-card>p{display:none!important}
.hc-pop{font-family:var(--round)!important;color:#fff!important;text-shadow:0 3px 0 var(--pink),0 6px 18px rgba(120,40,120,.4)!important;z-index:40!important}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
body.playing .bd-trophy, body.playing .bd-toast, body.playing #keyP{display:none!important}

/* loading */
#load{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% 30%,#ffe3f1,#d9c6ff 60%,#b79aff);transition:opacity .6s}
#load .bar{width:210px;height:14px;border-radius:12px;background:#fff;margin-top:26px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(120,60,160,.2),0 3px 0 rgba(169,124,255,.35)}#load .bar i{display:block;height:100%;width:3%;background:linear-gradient(90deg,#ffb3d9,#ff5fa2);border-radius:12px;transition:width .2s}
#load small{margin-top:12px;font:800 13px var(--sans);color:var(--ink2);letter-spacing:.06em}
.logoT{font:700 clamp(54px,15vw,80px)/.86 var(--round);color:#fff;letter-spacing:-.01em;text-align:center;
  text-shadow:0 3px 0 #ff5fa2,0 6px 0 #c13f9b,0 10px 22px rgba(140,40,140,.35),-3px 0 0 #ff5fa2,3px 0 0 #ff5fa2,0 -3px 0 #ff5fa2}
.logoT em{display:block;font-style:normal;color:#fff6a8;text-shadow:0 3px 0 #a97cff,0 6px 0 #6b45c8,0 10px 22px rgba(80,40,160,.35),-3px 0 0 #a97cff,3px 0 0 #a97cff,0 -3px 0 #a97cff}
.logoT .sp{position:absolute;font-size:.36em;color:#fff6a8;text-shadow:0 0 12px #fff}

/* top HUD */
.topbar{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:30;display:flex;gap:6px;align-items:center}
.pill{display:flex;align-items:center;gap:5px;height:36px;padding:0 4px 0 4px;border-radius:20px;border:0;background:linear-gradient(180deg,#fff,#f6eeff);box-shadow:0 3px 0 rgba(140,100,200,.35),0 6px 14px rgba(120,60,160,.18),inset 0 -2px 0 rgba(169,124,255,.15);font:700 17px var(--round);color:var(--ink)}
.pill .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.pill .ic img{width:30px;height:30px;object-fit:contain}
.pill b{font-weight:700;min-width:22px;text-align:center}
.pill em{font-style:normal;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#ffb3e0,#ff5fa2);color:#fff;font:700 18px/24px var(--round);text-align:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.pill.key em{background:linear-gradient(180deg,#d4c2ff,#a97cff)}
.pill small{font:800 10.5px var(--sans);color:var(--ink2);margin-right:2px}
.rbtn{width:40px;height:40px;border-radius:14px;border:0;background:linear-gradient(180deg,#ffd0e8,#ff8fc4);box-shadow:0 3px 0 #d0559a,inset 0 2px 0 rgba(255,255,255,.6);font-size:18px;display:grid;place-items:center;color:#fff}
#menuBtn{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:30;font:700 20px var(--round)}
#chap{position:fixed;top:calc(10px + env(safe-area-inset-top));left:58px;right:184px;z-index:29;pointer-events:none}
#chap b{display:inline-block;font:700 11px var(--round);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--lilac);padding:2px 8px;border-radius:8px}
#chap span{display:block;margin-top:3px;font:700 14.5px/1.15 var(--round);color:#fff;text-shadow:0 1px 0 #b0569a,0 2px 8px rgba(80,30,100,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chap i{display:block;height:7px;border-radius:6px;background:rgba(255,255,255,.55);margin-top:4px;max-width:170px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(100,40,120,.25)}#chap i u{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb3d9,#ff5fa2);border-radius:6px;transition:width .4s}

/* story layer */
#fade{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#ffe6f3,#d9c6ff 70%);opacity:0;pointer-events:none;z-index:20;transition:opacity .4s}
#loc{position:fixed;left:0;right:0;top:38%;z-index:21;text-align:center;opacity:0;transition:opacity .4s,transform .7s cubic-bezier(.2,1.4,.4,1);transform:scale(.85);pointer-events:none}
#loc.on{opacity:1;transform:none}
#loc small{display:inline-block;font:700 13px var(--round);letter-spacing:.14em;color:#fff;background:var(--pink);text-transform:uppercase;margin-bottom:10px;padding:5px 14px;border-radius:12px;box-shadow:0 3px 0 #c13f8a}
#loc h2{font:700 38px/1.05 var(--round);margin:0 20px;color:#fff;text-shadow:0 3px 0 #a97cff,0 6px 0 #6b45c8,-2px 0 0 #a97cff,2px 0 0 #a97cff,0 -2px 0 #a97cff,0 10px 26px rgba(80,30,140,.35)}
#loc i{display:block;font-style:normal;font-size:22px;margin-top:6px}
#tapzone{position:fixed;inset:0;z-index:10}
#bubble{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 24px));box-sizing:border-box;z-index:22;pointer-events:none;
  background:linear-gradient(180deg,#fff,#fff6fb);border:3px solid #fff;border-radius:28px;padding:24px 22px 26px;box-shadow:0 0 0 3px var(--c,#ffb3d9),0 10px 28px rgba(110,50,140,.28);transition:opacity .2s,transform .25s cubic-bezier(.2,1.5,.4,1);font:800 18px/1.42 var(--sans);color:var(--ink);min-height:92px}
#bubble.off{opacity:0;transform:translate(-50%,16px) scale(.96)}
#bubble .tag{position:absolute;top:-21px;left:16px;padding:5px 16px 6px;border-radius:16px;color:#fff;font:700 19px/1 var(--round);border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.12),0 4px 10px rgba(80,30,100,.2);letter-spacing:.01em}
#bubble .tag small{font:700 12px var(--round);opacity:.85;margin-left:6px}
#bubble .tail{position:absolute;top:-13px;width:22px;height:22px;background:#fff;transform:rotate(45deg);border-radius:5px;left:calc(50% - 11px);transition:left .3s;box-shadow:-3px -3px 0 var(--c,#ffb3d9)}
#bubble p{margin:0;position:relative;white-space:pre-wrap}
#bubble .more{position:absolute;right:18px;bottom:7px;font-size:14px;color:var(--pink);animation:bob 1s infinite;opacity:0}
#bubble.done .more{opacity:1}
@keyframes bob{50%{transform:translateY(3px)}}
#bubble.narr{background:linear-gradient(180deg,rgba(255,248,252,.95),rgba(246,236,255,.95));--c:#d9c6ff;color:#5b3f88;font:700 18px/1.45 var(--sans);font-style:italic;text-align:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#bubble.narr .tag,#bubble.narr .tail{display:none}
#bubble.narr::before{content:'✦';position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:20px;color:var(--lilac);text-shadow:0 0 0 #fff,0 2px 0 #fff}
#bubble.think{border-style:dashed;--c:#d9c6ff;font-style:italic;color:#6a4f93}
#bubble.think .tail{display:none}
#bubble.think::before,#bubble.think::after{content:'';position:absolute;background:#fff;box-shadow:0 0 0 3px #d9c6ff;border-radius:50%}
#bubble.think::before{width:16px;height:16px;top:-26px;left:var(--tx,50%)}#bubble.think::after{width:9px;height:9px;top:-42px;left:calc(var(--tx,50%) + 14px)}
#choices{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(520px,calc(100% - 28px));z-index:23;display:flex;flex-direction:column;gap:11px}
#choices .prompt{margin:0 0 2px;padding:11px 16px;border-radius:20px;background:rgba(255,248,252,.93);color:#5b3f88;font:800 15.5px/1.35 var(--sans);text-align:center;box-shadow:0 0 0 3px #d9c6ff,0 6px 16px rgba(110,50,140,.2)}
.opt{position:relative;display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:0;border-radius:22px;padding:15px 16px 15px 18px;background:linear-gradient(180deg,#fff 0%,#fff 55%,#f6edff 100%);color:var(--ink);font:800 16.5px/1.3 var(--sans);box-shadow:0 5px 0 #c7b0f0,0 9px 18px rgba(110,50,140,.2),inset 0 -3px 0 rgba(169,124,255,.12);opacity:0;transform:translateY(16px) scale(.96);animation:optIn .42s cubic-bezier(.2,1.5,.4,1) forwards}
.opt::before{content:'';width:12px;height:12px;flex:0 0 12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--pink2) 60%);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pink3)}
.opt:active{transform:translateY(4px)!important;box-shadow:0 1px 0 #c7b0f0}
.opt span.t{flex:1}
.opt.prem{background:linear-gradient(180deg,#ffe6f4,#ffc4e3 55%,#ffb0d8);box-shadow:0 5px 0 #e2609f,0 9px 20px rgba(220,60,140,.3),inset 0 2px 0 rgba(255,255,255,.7)}
.opt.prem::before{background:radial-gradient(circle at 35% 35%,#fff,#ffd95a 60%);box-shadow:0 0 0 2px #fff,0 0 0 4px #ffb84a}
.opt .cost{display:flex;align-items:center;gap:3px;padding:4px 10px 4px 5px;border-radius:14px;background:#fff;font:700 16px var(--round);color:#c2367e;white-space:nowrap;box-shadow:0 2px 0 rgba(200,60,130,.25)}
.opt .cost img{width:22px;height:22px}
.opt .gem{position:absolute;top:-10px;left:16px;font:700 11px var(--round);letter-spacing:.1em;background:linear-gradient(90deg,#ff5fa2,#a97cff);color:#fff;padding:3px 9px;border-radius:9px;border:2px solid #fff}
.opt .paid{color:#19a77d}
@keyframes optIn{to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;top:calc(62px + env(safe-area-inset-top));transform:translateX(-50%);z-index:35;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:94vw}
.tchip{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 6px;border-radius:24px;background:#fff;box-shadow:0 0 0 3px var(--pink3),0 6px 16px rgba(110,50,140,.22);font:700 15px var(--round);color:var(--ink);animation:chip 2.8s ease forwards}
.tchip img{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:50% 10%;background:var(--lilac3)}
.tchip .h{color:var(--pink);font-size:17px;letter-spacing:-1px}
.tchip.note{background:linear-gradient(90deg,#fff,#fff0f8);padding:8px 16px;font:700 14.5px var(--round);color:#b03a7e}
.tchip.gold{background:linear-gradient(90deg,#fff8d6,#ffe9a6);box-shadow:0 0 0 3px #ffe08a,0 6px 16px rgba(160,110,0,.2)}
@keyframes chip{0%{opacity:0;transform:translateY(-10px) scale(.8)}10%{opacity:1;transform:scale(1.06)}16%{transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:19;transition:opacity .25s}

/* polaroid + sticker pop */
#snap{position:fixed;left:50%;top:20%;z-index:36;transform:translate(-50%,0) rotate(-5deg) scale(.5);opacity:0;pointer-events:none;background:#fff;padding:9px 9px 36px;border-radius:6px;box-shadow:0 14px 40px rgba(110,50,140,.35);transition:all .5s cubic-bezier(.2,1.4,.4,1)}
#snap.on{opacity:1;transform:translate(-50%,0) rotate(-5deg) scale(1)}
#snap img{display:block;width:150px;height:200px;object-fit:cover;background:#eee;border-radius:3px}
#snap b{position:absolute;left:0;right:0;bottom:9px;text-align:center;font:700 14px var(--round);color:var(--ink)}
#snap small{position:absolute;top:-14px;right:-14px;background:var(--pink);color:#fff;font:700 12px var(--round);letter-spacing:.06em;padding:6px 10px;border-radius:14px;transform:rotate(10deg);border:2px solid #fff}
#snap::before{content:'';position:absolute;top:-10px;left:50%;width:70px;height:22px;transform:translateX(-50%) rotate(3deg);background:rgba(255,179,217,.75)}
#stk{position:fixed;right:14px;top:calc(110px + env(safe-area-inset-top));z-index:36;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0;transform:scale(.3) rotate(-20deg);transition:all .45s cubic-bezier(.2,1.6,.4,1)}
#stk.on{opacity:1;transform:rotate(8deg)}
#stk img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 6px 8px rgba(110,50,140,.35))}
#stk b{margin-top:4px;background:#fff;border-radius:12px;padding:4px 10px;font:700 12.5px var(--round);color:var(--pink);box-shadow:0 3px 0 var(--pink3)}

/* letter */
#letter{position:fixed;inset:0;z-index:38;display:flex;align-items:center;justify-content:center;background:rgba(80,40,120,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
#letter.on{opacity:1;pointer-events:auto}
#letter .card{width:min(340px,84vw);background:linear-gradient(180deg,#fff9fc,#ffe8f3);border-radius:22px;padding:30px 24px 22px;box-shadow:0 0 0 4px #fff,0 0 0 8px #ffb3d9,0 20px 50px rgba(110,40,120,.4);transform:rotate(-2deg) scale(.7);transition:transform .5s cubic-bezier(.2,1.5,.4,1);position:relative;text-align:center}
#letter.on .card{transform:rotate(-2deg)}
#letter .seal{position:absolute;top:-26px;left:50%;transform:translateX(-50%);width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83d 60%,#e09a10);display:grid;place-items:center;font-size:26px;color:#fff;box-shadow:0 4px 0 #b97a00,0 0 0 4px #fff}
#letter p{font:600 19px/1.5 var(--round);color:#7a3a78;margin:6px 0 14px}
#letter small{font:800 13px var(--sans);color:var(--ink2);animation:bob 1.4s infinite;display:block}

/* name entry */
#namebox{position:fixed;inset:0;z-index:39;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#namebox .card{width:min(420px,calc(100% - 28px));background:#fff;border-radius:28px;padding:20px 18px 18px;box-shadow:0 0 0 3px #ffb3d9,0 12px 34px rgba(110,50,140,.3);text-align:center;animation:up .4s cubic-bezier(.2,1.4,.4,1)}
#namebox h3{margin:0 0 4px;font:700 24px var(--round);color:var(--ink)}
#namebox p{margin:0 0 12px;font:700 14px var(--sans);color:var(--ink2)}
input.name{width:100%;box-sizing:border-box;border:3px solid var(--lilac2);border-radius:18px;padding:13px 16px;font:700 22px var(--round);color:var(--ink);background:var(--lilac3);margin:0 0 12px;text-align:center;user-select:text;-webkit-user-select:text;outline:none}
input.name:focus{border-color:var(--pink2);background:#fff}

/* lobby (inside the kit start card) */
.lob{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(58px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));box-sizing:border-box;pointer-events:none}
.lob>*{pointer-events:auto}
.lob .logoT{pointer-events:none;position:relative;font-size:clamp(46px,12.5vw,74px)}
.lob .tagl{margin-top:12px;font:700 13px var(--round);letter-spacing:.14em;color:#fff;background:linear-gradient(90deg,#ff5fa2,#a97cff);padding:6px 16px;border-radius:14px;box-shadow:0 3px 0 rgba(120,40,140,.35);border:2px solid #fff;pointer-events:none}
.lspace{flex:1}
.book{width:min(440px,100%);box-sizing:border-box;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(250,242,255,.97));box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(201,168,255,.7),0 14px 36px rgba(90,40,130,.35);padding:16px 16px 14px;position:relative;cursor:pointer}
.book .bk{font:700 11.5px var(--round);letter-spacing:.14em;color:var(--lilac);text-transform:uppercase}
.book h2{margin:3px 0 4px;font:700 25px/1.08 var(--round);color:var(--ink)}
.book p{margin:0 0 12px;font:700 14px/1.38 var(--sans);color:#6f5a8e;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.book .chn{position:absolute;right:14px;top:12px;font:700 12.5px var(--round);color:#fff;background:var(--pink);border-radius:11px;padding:4px 10px;border:2px solid #fff;box-shadow:0 2px 0 #c13f8a}
.play{width:100%;border:0;border-radius:24px;padding:15px 18px;background:linear-gradient(180deg,#ffb3dd 0%,#ff6fae 55%,#ff4f9a 100%);color:#fff;font:700 24px var(--round);text-shadow:0 2px 0 #c2357c;box-shadow:0 6px 0 #c2357c,0 12px 22px rgba(220,60,140,.35),inset 0 3px 0 rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
.play::after{content:'';position:absolute;left:14px;right:14px;top:5px;height:38%;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #c2357c}
.play .kc{display:flex;align-items:center;gap:4px;font:700 15px var(--round);background:rgba(255,255,255,.95);color:#a97cff;border-radius:12px;padding:3px 10px;text-shadow:none}
.play.free .kc{background:#fff;color:#19a77d}
.play.mint{background:linear-gradient(180deg,#b6f5e1,#5fdcb6 55%,#33c49b);text-shadow:0 2px 0 #1f9a78;box-shadow:0 6px 0 #1f9a78,0 12px 22px rgba(40,160,120,.3),inset 0 3px 0 rgba(255,255,255,.55)}
.lrow{display:flex;gap:8px;width:min(440px,100%);margin-top:12px}
.sq{flex:1;border:0;border-radius:22px;padding:8px 4px 8px;background:linear-gradient(180deg,#fff,#f4ebff);box-shadow:0 4px 0 #c7b0f0,0 8px 16px rgba(110,50,140,.18);font:700 13px var(--round);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.sq img{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(110,50,140,.25))}
.sq b{position:absolute;top:-6px;right:-3px;min-width:22px;height:22px;border-radius:11px;background:var(--pink);color:#fff;font:700 13px/22px var(--round);padding:0 5px;box-sizing:border-box;border:2px solid #fff}
.who{margin-top:10px;display:flex;align-items:center;gap:8px;border:0;background:rgba(255,255,255,.88);color:var(--ink);border-radius:22px;padding:5px 14px 5px 5px;font:700 14px var(--round);box-shadow:0 3px 0 rgba(169,124,255,.45)}
.who img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 8%;background:var(--pink3)}
.streak{margin-top:8px;font:700 14px var(--round);color:#fff;background:linear-gradient(90deg,#ffb84a,#ff5fa2);padding:4px 12px;border-radius:12px;border:2px solid #fff;pointer-events:none}

/* sheets */
#sheet{position:fixed;inset:0;z-index:45;background:rgba(90,50,130,.4);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#sheet>.in{width:min(560px,100%);max-height:88%;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff8fc,#f6eeff);border-radius:30px 30px 0 0;box-shadow:0 -10px 40px rgba(90,40,130,.3),0 0 0 4px #fff;animation:up .38s cubic-bezier(.2,1.3,.4,1);padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:700px){#sheet{align-items:center}#sheet>.in{border-radius:30px;max-height:84%}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-h{display:flex;align-items:center;gap:10px;padding:18px 18px 10px}

.pol{flex:0 0 108px;background:#fff;padding:6px 6px 28px;border-radius:4px;box-shadow:0 4px 12px rgba(110,50,140,.2);position:relative;transform:rotate(var(--r,-2deg))}

.mbtn{display:block;width:100%;border:0;border-radius:18px;padding:14px;margin-bottom:9px;background:#fff;font:700 17px var(--round);color:var(--ink);box-shadow:0 4px 0 #e6dbf6;text-align:left}

/* outfit tray (like the mockup's wardrobe tray) */
#outfit{position:fixed;left:0;right:0;bottom:0;z-index:24;padding:0 0 calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
#outfit .head{background:rgba(255,248,252,.95);color:#6a4f93;font:700 14px/1.35 var(--sans);text-align:center;padding:9px 16px;border-radius:18px;margin:0 14px 8px;max-width:500px;box-shadow:0 0 0 3px #d9c6ff}

.look{flex:0 0 100px;scroll-snap-align:center;border:0;border-radius:22px;background:linear-gradient(180deg,#fff,#faf5ff);padding:9px 6px 9px;box-shadow:0 4px 0 #c7b0f0;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}

.look.on::after{content:'✓';position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:var(--pink);color:#fff;font:700 15px/24px var(--round);border:2px solid #fff}

.look .c img{width:18px;height:18px}
#outfit .play{width:min(300px,80%);margin-top:6px;font-size:21px;padding:12px}

.qb{border:0;border-radius:22px;background:linear-gradient(180deg,#fff,#f6eeff);padding:7px 3px 8px;box-shadow:0 4px 0 #c7b0f0;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
