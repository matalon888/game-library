<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bonk Brawl: Dodgeball Arena</title>
<meta name="description" content="Dodge the incoming throws, grab the ball and bonk every rival out of the arena: a free dodgeball game in your browser.">
<meta property="og:title" content="Bonk Brawl: Dodgeball Arena">
<meta property="og:description" content="Dodge, grab, throw. Knock out every rival in a free browser dodgeball arena game, no download.">
<meta name="theme-color" content="#9fb4ff">
<link rel="icon" href="data:,">
<style>
  .stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 4px rgba(255,255,255,.6);z-index:6;pointer-events:none;display:none}
  .stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .hearts{position:fixed;left:0;right:0;text-align:center;bottom:calc(28px + env(safe-area-inset-bottom));z-index:6;font-size:30px;letter-spacing:2px;pointer-events:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
  .hearts span{transition:opacity .3s,transform .3s;display:inline-block}
  .hearts span.off{opacity:.25;transform:scale(.7)}
</style>
</head>
<body>
<div class="stick" id="stick"><i></i></div>
<div class="hearts" id="hearts"></div>
<script type="module" src="game.js"></script>
</body>
</html>
