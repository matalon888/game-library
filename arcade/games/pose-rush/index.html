<!doctype html>
<html lang="en">
<head>
<script src="/arcade/save.js" defer data-ap-save></script>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pose Rush</title>
<meta name="theme-color" content="#22dcff">
<link rel="icon" href="data:,">
<style>
  .hdl{position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.12),inset 0 0 0 2px rgba(0,0,0,.08);z-index:6;pointer-events:none;opacity:0;transition:opacity .15s,transform .1s}
  .hdl.on{opacity:1}
  .hdl.grab{transform:scale(1.25);background:rgba(255,255,255,.35)}
  .tgt{position:fixed;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:5px solid #ffe14d;box-shadow:0 0 0 3px rgba(255,80,60,.6);z-index:5;pointer-events:none;opacity:0;animation:tp .6s ease-in-out infinite}
  .tgt.on{opacity:1}
  @keyframes tp{50%{transform:scale(1.18)}}
  .slow{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(20,40,120,.38) 100%)}
  .slow.on{opacity:1}
  .tip{position:fixed;left:0;right:0;bottom:calc(16% + env(safe-area-inset-bottom));text-align:center;font-weight:800;font-size:26px;letter-spacing:1px;z-index:6;pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.25);opacity:0;transition:opacity .2s}
  .tip.on{opacity:1;animation:hcpulse 1s ease-in-out infinite}
  .bang{position:fixed;left:50%;top:34%;z-index:7;pointer-events:none;font-weight:800;font-size:64px;color:#ffe14d;-webkit-text-stroke:3px #2b2d42;transform:translate(-50%,-50%) rotate(-8deg) scale(0);transition:transform .18s cubic-bezier(.3,1.8,.5,1)}
  .bang.on{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}
</style>
</head>
<body>
<div class="slow" id="slow"></div>
<div class="tip" id="tip">DRAG A LIMB TO HIT!</div>
<div class="bang" id="bang">BANG!</div>
<script type="module" src="game.js"></script>
</body>
</html>
