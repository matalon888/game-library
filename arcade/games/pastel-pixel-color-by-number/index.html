<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<script src="/arcade/save.js" defer data-ap-save></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pastel Pixel: Color by Number</title>
<meta name="description" content="Relaxing kawaii pixel art color by number: tap or drag to fill cute boba, pets and sweets, then watch your picture pop up in 3D voxels. Free, no timer, no fail.">
<meta property="og:title" content="Pastel Pixel: Color by Number">
<meta property="og:description" content="Color kawaii pixel art by number, then pop it up in 3D. A new daily pixel every day, a sticker album and packs to unlock.">
<meta name="theme-color" content="#f1e3ff">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
:root{--ink:#4b2a6e;--ink2:#8a6aa8;--lilacD:#6a3dc4;--lilac2:#8f5cf0;--mintD:#3fb88f;--round:'Fredoka','Nunito',system-ui,sans-serif;--sans:'Nunito',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--sans);color:var(--ink)}
body{background:radial-gradient(120% 70% at 50% 0%,#f6ecff 0%,#ecdcff 45%,#ffdcef 100%)}
body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.6;background-image:radial-gradient(circle at 20% 30%,#fff 0 1.6px,transparent 2.4px),radial-gradient(circle at 70% 60%,#fff 0 1.2px,transparent 2px),linear-gradient(45deg,rgba(255,255,255,.18) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.18) 75%),linear-gradient(45deg,rgba(255,255,255,.18) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.18) 75%);background-size:90px 90px,130px 130px,28px 28px,28px 28px;background-position:0 0,0 0,0 0,14px 14px}
.hide{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
img{-webkit-user-drag:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font:700 19px var(--round);border-radius:22px;padding:13px 22px;position:relative;transition:transform .1s cubic-bezier(.3,1.6,.5,1)}
.btn:active{transform:translateY(3px) scale(.97)}
.btn:after{content:'';position:absolute;left:12%;right:12%;top:5px;height:38%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.btn.pink{background:linear-gradient(180deg,#ffa3cf,#ff5ea5);color:#fff;text-shadow:0 2px 0 rgba(180,30,100,.35);box-shadow:0 5px 0 #d23f86,0 10px 24px rgba(220,60,140,.35)}
.btn.lilac{background:linear-gradient(180deg,#c7a6ff,#9563f2);color:#fff;text-shadow:0 2px 0 rgba(80,30,160,.35);box-shadow:0 5px 0 #6f42c9,0 10px 24px rgba(110,60,210,.3)}
.btn.soft{background:linear-gradient(180deg,#ffffff,#f3e9ff);color:var(--ink);box-shadow:0 4px 0 #dccaf5,0 8px 18px rgba(120,80,190,.14)}
.btn[disabled]{filter:saturate(.3);opacity:.6;pointer-events:none}
.btn small{font:800 13px var(--sans);opacity:.9}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px 0 8px;border-radius:999px;background:rgba(255,255,255,.9);box-shadow:0 3px 0 rgba(160,110,220,.25),0 8px 18px rgba(140,90,200,.14);font:700 17px var(--round);white-space:nowrap}
.chip .ic{font-size:19px;line-height:1}
.chip .plus{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#9df0cf,#41c993);color:#fff;font:900 17px/1 var(--sans);box-shadow:0 2px 0 #2ea676}
.coin{display:inline-block;width:24px;height:24px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff6c4,#ffcf3d 45%,#f0a020);box-shadow:inset 0 -2px 0 rgba(170,90,0,.35);position:relative}
.coin:after{content:'♥';position:absolute;inset:0;display:grid;place-items:center;font:900 12px/1 var(--sans);color:#ff7fb5}
.outline{color:#fff;-webkit-text-stroke:6px var(--lilacD);paint-order:stroke fill;text-shadow:0 4px 0 rgba(106,61,196,.45)}
#load{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 20%,#f6eaff,#ffd9ee);transition:opacity .5s}
#load .t{font:700 50px/1 var(--round);text-align:center}
/* ---------- gallery */
#home{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center}
#home .wrap{width:100%;max-width:980px;flex:1;display:flex;flex-direction:column;min-height:0;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.logo{font:700 36px/1 var(--round);letter-spacing:.3px}
.logo span{color:#ffe0f0}
.logo small{display:block;font:900 11.5px var(--sans);letter-spacing:2.2px;color:#a070d0;-webkit-text-stroke:0;text-shadow:none;margin-top:4px}
.hd .right{display:flex;gap:8px;margin-right:50px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;padding:10px 2px 110px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.daily{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#fff,#fff4fb);border-radius:28px;padding:12px;box-shadow:0 5px 0 #ecdcfb,0 12px 30px rgba(130,80,200,.12);margin-bottom:14px;width:100%;text-align:left;position:relative;overflow:hidden}
.daily:before{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#ffe0f0,transparent 70%)}
.daily canvas{width:112px;height:112px;border-radius:22px;background:#fbf7ff;flex:none;image-rendering:pixelated;box-shadow:inset 0 0 0 3px #fff,0 3px 0 #e8d8fa}
.daily .tx{flex:1;min-width:0;position:relative}
.daily .tx .k{font:900 11px var(--sans);letter-spacing:1.6px;color:#e0468f;text-transform:uppercase}
.daily .tx b{display:block;font:700 23px/1.1 var(--round);margin:2px 0}
.daily .tx span{font:800 13.5px var(--sans);color:var(--ink2)}
.daily .btn{margin-top:8px;padding:10px 18px;font-size:17px}
.chips{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.packs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;touch-action:pan-x;scrollbar-width:none}
.packs::-webkit-scrollbar{display:none}
.packs button{flex:none;display:flex;align-items:center;gap:6px;font:700 15px var(--round);padding:6px 14px 6px 6px;border-radius:999px;background:#fff;color:var(--ink);box-shadow:0 3px 0 #e6d6fa}
.packs button img{width:30px;height:30px}
.packs button.on{background:linear-gradient(180deg,#c7a6ff,#9563f2);color:#fff;box-shadow:0 3px 0 #6f42c9}
.packs button.lock{opacity:.6}
.packhd{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px 8px}
.packhd b{font:700 21px var(--round)} .packhd span{font:800 13px var(--sans);color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:900px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{position:relative;background:#fff;border-radius:24px;padding:10px 10px 8px;box-shadow:0 4px 0 #ecdcfb,0 10px 22px rgba(130,80,200,.1);text-align:center;transition:transform .15s}
.card:active{transform:scale(.97)}
.card canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;border-radius:16px;background:#fbf7ff;display:block}
.card b{display:block;font:700 15px/1.2 var(--round);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{font:800 11.5px var(--sans);color:var(--ink2)}
.card .badge{position:absolute;top:8px;left:8px;font:900 10px var(--sans);letter-spacing:.8px;padding:3px 8px;border-radius:999px;background:#ffe0ee;color:#d23f86;text-transform:uppercase}
.card .badge.big{background:#e6d6ff;color:#6a3dc4}
.card .ring{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:900 10px var(--sans);color:var(--ink);background:conic-gradient(#ff79b8 var(--p),#f1e6ff 0)}
.card .ring:before{content:'';position:absolute;inset:4px;border-radius:50%;background:#fff}
.card .ring i{position:relative;font-style:normal}
.card.done .ring{background:linear-gradient(180deg,#a5f3d6,#4fcf9f)} .card.done .ring:before{display:none} .card.done .ring i{color:#fff;font-size:15px}
.card.locked{filter:grayscale(.4);opacity:.7}
.lockmsg{grid-column:1/-1;background:#fff;border-radius:22px;padding:16px;text-align:center;font:800 15px var(--sans);color:var(--ink2);box-shadow:0 4px 0 #ecdcfb}
.lockmsg b{display:block;font:700 22px var(--round);color:var(--ink);margin-bottom:4px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:12;display:flex;gap:4px;background:rgba(255,255,255,.94);border-radius:28px;padding:6px 10px;box-shadow:0 6px 0 #e3d1f8,0 14px 30px rgba(110,60,190,.2)}
.nav button{display:flex;flex-direction:column;align-items:center;font:700 12.5px var(--round);color:var(--ink2);padding:0 12px;position:relative}
.nav img{width:44px;height:44px;filter:drop-shadow(0 3px 2px rgba(120,60,180,.18))}
.nav .dot{position:absolute;top:2px;right:10px;width:12px;height:12px;border-radius:50%;background:#ff4f9a;border:2px solid #fff}
/* ---------- play */
#play{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 4px;position:relative;z-index:3}
.round{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 30px/1 var(--round);color:var(--lilacD);box-shadow:0 4px 0 #dccaf5,0 8px 16px rgba(120,80,190,.14);flex:none}
.ph .ttl{flex:1;text-align:center;min-width:0}
.ph .ttl b{display:block;font:700 22px/1.05 var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:10px;border-radius:9px;background:rgba(255,255,255,.8);overflow:hidden;margin:5px auto 0;max-width:180px;box-shadow:inset 0 1px 2px rgba(120,60,180,.15)} .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffa3cf,#c7a6ff);border-radius:9px;transition:width .3s}
#cv{flex:1;min-height:0;width:100%;display:block;touch-action:none}
.tools{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:3}
.tool{width:54px;height:54px;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:25px;box-shadow:0 4px 0 #dccaf5,0 8px 18px rgba(120,80,190,.16);position:relative}
.tool:active{transform:translateY(2px)}
.tool small{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:linear-gradient(180deg,#ff9fca,#ff5ea5);color:#fff;font:900 12px/22px var(--sans);text-align:center;box-shadow:0 2px 0 #d23f86}
.tool small .coin{width:13px;height:13px;vertical-align:-2px} .tool small .coin:after{font-size:7px}
.pal{display:flex;justify-content:safe center;gap:10px;overflow-x:auto;padding:10px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.95));border-radius:28px 28px 0 0;box-shadow:0 -8px 30px rgba(120,60,190,.12);touch-action:pan-x;scrollbar-width:none;position:relative;z-index:3}
.pal::-webkit-scrollbar{display:none}
.sw{flex:none;width:58px;height:58px;border-radius:50%;position:relative;display:grid;place-items:center;font:700 21px var(--round);transition:transform .2s cubic-bezier(.3,1.7,.5,1)}
.sw .in{position:absolute;inset:5px;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),inset 0 3px 0 rgba(255,255,255,.5)}
.sw .in:after{content:'';position:absolute;left:9px;top:6px;width:18px;height:10px;border-radius:50%;background:rgba(255,255,255,.6);transform:rotate(-20deg)}
.sw .n{position:relative;z-index:1}
.sw svg{position:absolute;inset:0;transform:rotate(-90deg)}
.sw.on{transform:scale(1.14) translateY(-3px)}
.sw.on:before{content:'';position:absolute;inset:-5px;border-radius:50%;border:3px solid #8f5cf0}
.sw.fin .n{font-size:22px}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);z-index:90;background:#fff;color:var(--ink);font:700 16px var(--round);padding:10px 18px;border-radius:999px;box-shadow:0 5px 0 #dcc8f6,0 12px 26px rgba(110,60,190,.2);animation:toast 2.2s forwards;pointer-events:none;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px) scale(.8)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
/* ---------- overlays */
.ov{position:fixed;inset:0;z-index:60;background:rgba(80,40,130,.38);display:grid;place-items:center;padding:14px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(420px,100%);max-height:calc(100% - 10px);overflow:auto;background:linear-gradient(180deg,#fffaff,#f8efff);border-radius:32px;padding:18px;text-align:center;box-shadow:0 10px 0 #dcc8f6,0 30px 70px rgba(70,20,130,.35);position:relative;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
.sheet h3{margin:0;font:700 32px/1 var(--round)}
.sheet p{margin:8px 0;font:800 15px/1.35 var(--sans);color:var(--ink2)}
.sheet .row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap} .sheet .row .btn{flex:1;min-width:140px}
.vox{width:100%;height:300px;border-radius:26px;background:radial-gradient(circle at 50% 40%,#fff,#f3e6ff 70%);margin:10px 0 4px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 3px #fff}
.vox canvas{width:100%!important;height:100%!important;display:block}
.vox .hint{position:absolute;bottom:8px;left:0;right:0;font:800 12px var(--sans);color:#b79ad6;pointer-events:none}
.reward{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 14px 6px 8px;font:700 20px var(--round);box-shadow:0 3px 0 #ecdcfb}
.tapcont{font:800 13px var(--sans);color:#b79ad6;margin-top:10px}
.xbtn{position:absolute;z-index:3;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:#f1e6ff;font:700 22px/1 var(--round);color:var(--lilac2);display:grid;place-items:center}
.tabs{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.tabs button{font:700 14px var(--round);padding:7px 12px;border-radius:999px;background:#f1e6ff;color:var(--lilac2)} .tabs button.on{background:linear-gradient(180deg,#c7a6ff,#9563f2);color:#fff}
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.album .s{aspect-ratio:1;border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 #ecdcfb;padding:6px}
.album .s canvas{width:100%;height:100%;image-rendering:pixelated;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 2px 3px rgba(120,60,180,.3))}
.album .s.no canvas{filter:brightness(0) opacity(.08)}
.prog{height:12px;border-radius:9px;background:#efe4ff;overflow:hidden;margin:6px 0 10px} .prog b{display:block;height:100%;background:linear-gradient(90deg,#ffa3cf,#c7a6ff)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 #ecdcfb;margin:8px 0;font:700 16px var(--round);text-align:left}
.row2 small{display:block;font:800 12.5px var(--sans);color:var(--ink2)}
.week{display:flex;justify-content:center;gap:6px;margin:8px 0}
.week span{display:flex;flex-direction:column;align-items:center;font:900 11px var(--sans);color:var(--ink2);gap:3px}
.week span i{width:32px;height:32px;border-radius:50%;background:#f1e6ff;display:grid;place-items:center;font-style:normal;font-size:16px}
.week span i.on{background:linear-gradient(180deg,#ffb17a,#ff6f8f)} .week span i.fz{background:linear-gradient(180deg,#e0f2ff,#8fc8f5)}
.share{font:700 20px/1.3 ui-monospace,Menlo,monospace;background:#fff;border-radius:18px;padding:10px 12px;margin:8px auto;white-space:pre;display:inline-block;text-align:left;box-shadow:0 4px 0 #ecdcfb}
#fx{position:fixed;inset:0;z-index:80;pointer-events:none}
body.playing .bd-trophy{display:none}
@media (min-width:700px){ .logo{font-size:44px} .vox{height:360px} .sheet{width:min(460px,100%)} }
</style>
</head>
<body>
<div id="load"><div class="t outline">Pastel<br>Pixel</div></div>
<canvas id="fx"></canvas>
<script type="module" src="game.js"></script>
</body>
</html>
