<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Shade Shop</title>
<meta name="theme-color" content="#c7b3ff">
<link rel="icon" href="data:,">
<style>
  .cmp{position:fixed;left:0;right:0;top:46%;display:flex;justify-content:center;align-items:center;gap:14px;z-index:6;pointer-events:none;transition:opacity .3s}
  .cmp .sw{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.14);transition:background .35s}
  .cmp .pct{min-width:108px;text-align:center;font-weight:800;font-size:40px;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.16)}
  .cmp .lab{position:absolute;top:52px;font-size:12px;font-weight:800;opacity:.9;letter-spacing:1px}
  .cmp .swrap{position:relative;display:flex;flex-direction:column;align-items:center}
  .paints{position:fixed;left:0;right:0;top:calc(46% + 70px);display:flex;justify-content:center;gap:12px;z-index:6}
  .paints button{width:58px;height:58px;border-radius:50%;border:5px solid #fff;padding:0;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18),inset 0 -8px 12px rgba(0,0,0,.18),inset 0 8px 10px rgba(255,255,255,.45);transition:transform .08s}
  .paints button:active,.paints button.hit{transform:translateY(3px) scale(.92)}
  .paints.off{pointer-events:none;opacity:0;transition:opacity .3s}
  .dobtn{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;font:inherit;font-weight:800;font-size:24px;color:#fff;background:#22c55e;border:0;border-radius:40px;padding:12px 40px;box-shadow:0 6px 0 #15803d;cursor:pointer;animation:dop 1s ease-in-out infinite}
  .dobtn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #15803d}
  @keyframes dop{50%{transform:translateX(-50%) scale(1.07)}}
  .rst{position:fixed;right:16px;top:calc(46% + 6px);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#7b5cff;font-size:22px;font-weight:800;z-index:7;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .banner{position:fixed;left:50%;top:64%;transform:translateX(-50%) rotate(-3deg) scale(0);z-index:8;background:linear-gradient(#ff7eb6,#ff3d8b);border:4px solid #fff;border-radius:18px;padding:6px 26px;font-weight:800;font-size:34px;white-space:nowrap;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
  .banner.on{transform:translateX(-50%) rotate(-3deg) scale(1)}
  .banner.bad{background:linear-gradient(#a3a3c2,#6d6d8f)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="cmp" id="cmp"><div class="swrap"><div class="sw" id="swT"></div><div class="lab">TARGET</div></div><div class="pct" id="pct">0%</div><div class="swrap"><div class="sw" id="swM"></div><div class="lab">YOURS</div></div></div>
<div class="paints" id="paints"></div>
<button class="rst" id="rst" aria-label="empty pot">↺</button>
<button class="dobtn hidden" id="done">PAINT IT!</button>
<div class="banner" id="banner">90% ACCURATE</div>
<script type="module" src="game.js"></script>
</body>
</html>
