<!doctype html>
<html lang="en">
<head>
<script src="/arcade/save.js" defer data-ap-save></script>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Untwine</title>
<meta name="theme-color" content="#2c6266">
<link rel="icon" href="data:,">
<style>
  body { background: radial-gradient(120% 80% at 50% 38%, #3f8487 0%, #2b6064 48%, #1b3c40 100%) !important; }
  .hc-card { background: rgba(10, 40, 44, .30); }
  .hc-card.dim { background: rgba(20, 20, 30, .50); }
  .hc-lvl.next { color: #2b6064 !important; }
  .moves { position: fixed; top: calc(58px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 5; pointer-events: none;
    width: 74px; padding: 4px 0 2px; border-radius: 14px; text-align: center; font-family: 'Baloo 2', system-ui, sans-serif; color: #fff;
    background: linear-gradient(180deg, #ffa24a, #f0702a); box-shadow: 0 5px 0 #b74d17, 0 8px 16px rgba(0,0,0,.25); transition: transform .15s; }
  .moves b { display: block; font-size: 11px; letter-spacing: 1.5px; font-weight: 800; opacity: .9; line-height: 1.1; }
  .moves span { display: block; font-size: 38px; font-weight: 800; line-height: .95; text-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .moves.low { background: linear-gradient(180deg, #ff6b6b, #e03a4a); box-shadow: 0 5px 0 #9e1f2c, 0 8px 16px rgba(0,0,0,.25); }
  .moves.bump { transform: translateX(-50%) scale(1.18); }
  .tangles { position: fixed; top: calc(130px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; z-index: 5; pointer-events: none;
    font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 15px; color: rgba(255,255,255,.8); }
</style>
</head>
<body>
<div class="moves hc-hidden" id="moves"><b>MOVES</b><span id="movesN">0</span></div>
<div class="tangles hc-hidden" id="tangles"></div>
<script type="module" src="game.js"></script>
</body>
</html>
