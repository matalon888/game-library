<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Quiver Duel: Archery</title>
<meta name="description" content="Drag to aim, read the wind and release: out-shoot a rival archer arrow by arrow on the target rings in this free archery game in your browser.">
<meta property="og:title" content="Quiver Duel: Archery">
<meta property="og:description" content="Turn-based archery duel against a rival archer: aim, read the wind, hit the gold. Free in your browser.">
<meta name="theme-color" content="#bfe6ff">
<link rel="icon" href="data:,">
<style>
  .duel{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;z-index:6;display:flex;flex-direction:column;gap:6px;pointer-events:none;font-weight:800}.duel .row{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.2);border-radius:14px;padding:4px 10px}.duel .nm{width:58px;font-size:15px}.duel .dots{flex:1;display:flex;gap:5px}.duel .dots span{flex:1;height:24px;border-radius:8px;background:rgba(255,255,255,.25);font-size:15px;line-height:24px;text-align:center}.duel .tot{width:40px;text-align:right;font-size:24px}.duel .row.on{box-shadow:0 0 0 3px #fff inset}.wind{position:fixed;top:calc(96px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;font-weight:800;font-size:18px;background:rgba(255,255,255,.85);color:#33415c;border-radius:16px;padding:2px 14px;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.1)}.wind span{display:inline-block;transition:transform .3s}
</style>
</head>
<body>
<div class="duel" id="duel"></div><div class="wind" id="wind"></div>
<script type="module" src="game.js"></script>
</body>
</html>
