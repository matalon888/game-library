<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money kit demo</title>
<link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:16px/1.35 system-ui,sans-serif;color:#2b2140;padding:14px 14px 40px;transition:background .3s}
  body.A{background:linear-gradient(180deg,#ffcf8a,#ff9a6a)} body.B{background:linear-gradient(180deg,#e9d4ff,#ffd1ec)} body.C{background:#efe6d2;font-family:Georgia,serif}
  h1{margin:0 0 8px;font-size:22px}
  .hud{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
  .hud span{background:rgba(255,255,255,.75);border-radius:99px;padding:6px 12px;font-weight:700}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1;min-height:48px;border:0;border-radius:12px;font:700 16px system-ui;background:rgba(255,255,255,.5);cursor:pointer}
  .tabs button[aria-pressed=true]{background:#2b2140;color:#fff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid button{min-height:48px;border:0;border-radius:12px;background:#fff;font:600 15px system-ui;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12)}
  h2{font-size:15px;margin:14px 0 6px;opacity:.8;text-transform:uppercase;letter-spacing:.05em}
  pre{background:rgba(255,255,255,.7);border-radius:12px;padding:10px;font-size:11.5px;white-space:pre-wrap;max-height:320px;overflow:auto}
  #log{font-size:13px;min-height:1.4em}
</style>
</head>
<body class="A">
<h1>Money kit · demo</h1>
<div class="tabs" role="group" aria-label="Style">
  <button data-style="A" aria-pressed="true">A · Hero Lab</button><button data-style="B">B · Kawaii</button><button data-style="C">C · Storybook</button>
</div>
<div class="hud"><span id="coins">🪙 0</span><span id="lives">♥ 5/5</span><span id="flags"></span></div>
<div id="log" role="status"></div>

<h2>Store</h2>
<div class="grid">
  <button data-do="shop">M.shop()</button><button data-do="buy:coins_s">buy coins_s</button>
  <button data-do="buy:coins_m">buy coins_m</button><button data-do="buy:coins_l">buy coins_l</button>
  <button data-do="buy:remove_ads">buy remove_ads</button><button data-do="buy:season_pass">buy season_pass</button>
  <button data-do="buy:starter_pack">buy starter_pack</button><button data-do="pay">toggle fake AP_PAY</button>
</div>
<h2>Reward videos</h2>
<div class="grid">
  <button data-do="rw:hint">rewarded('hint')</button><button data-do="rw:moves">rewarded('moves')</button>
  <button data-do="rw:revive">rewarded('revive')</button><button data-do="rw:double">rewarded('double')</button>
  <button data-do="rw:lives">rewarded('lives')</button><button data-do="sound">game sound on/off</button>
</div>
<h2>Break ads</h2>
<div class="grid">
  <button data-do="break">breakAd('level-end')</button><button data-do="break4">breakAd at level 4, gap cleared</button>
</div>
<h2>Coins & lives</h2>
<div class="grid">
  <button data-do="add">add(50,'win')</button><button data-do="spend">spend(100,'hint')</button>
  <button data-do="use">useLife()</button><button data-do="refill">refillLives()</button>
  <button data-do="reset">reset() (QA)</button><button data-do="app">toggle AP_APP.adFree</button>
</div>
<h2>M.debug()</h2>
<pre id="dbg"></pre>

<script type="module">
import { money } from './money.js';
const q = new URLSearchParams(location.search);
let style = ['A', 'B', 'C'].includes(q.get('style')) ? q.get('style') : 'A';
const Ms = {};
const M = () => Ms[style] || (Ms[style] = money({ game: 'money-demo-' + style, style }));
const $ = id => document.getElementById(id);
const log = t => { $('log').textContent = t; };
function render() {
  const m = M(), L = m.lives();
  $('coins').textContent = '🪙 ' + m.coins();
  $('lives').textContent = L.unlimited ? '♥ ∞' : `♥ ${L.n}/${L.max}` + (L.nextAt ? ` · +1 in ${Math.ceil((L.nextAt - Date.now()) / 60000)}m` : '');
  $('flags').textContent = [m.adFree() && 'ad-free', m.hasPass() && 'pass'].filter(Boolean).join(' · ') || 'no flags';
  $('dbg').textContent = JSON.stringify(m.debug(), null, 1);
}
function setStyle(s) {
  style = s; document.body.className = s;
  document.querySelectorAll('[data-style]').forEach(b => b.setAttribute('aria-pressed', b.dataset.style === s));
  M().onChange(render); render();
}
document.querySelectorAll('[data-style]').forEach(b => b.onclick = () => setStyle(b.dataset.style));
// a fake game soundtrack, to hear the kit mute it during ads
let ctx, osc;
addEventListener('ap:ad', e => log(`ap:ad ${e.detail.phase} (${e.detail.type} · ${e.detail.placement}) · audio ${ctx ? ctx.state : 'none'}`));
document.querySelectorAll('[data-do]').forEach(b => b.onclick = async () => {
  const d = b.dataset.do, m = M();
  if (d === 'shop') { await m.shop(); log('shop closed'); }
  else if (d.startsWith('buy:')) log(`buy(${d.slice(4)}) → ${await m.buy(d.slice(4))}`);
  else if (d.startsWith('rw:')) log(`rewarded(${d.slice(3)}) → ${await m.rewarded(d.slice(3))}`);
  else if (d === 'break') log(`breakAd → ${await m.breakAd('level-end')} · ${m.debug().ads.last.reason}`);
  else if (d === 'break4') { m.reset(); m.level(3); log(`(reset, level 3) breakAd → ${await m.breakAd('level-end')} · ${m.debug().ads.last.reason}`); }
  else if (d === 'add') log('add → ' + m.add(50, 'win'));
  else if (d === 'spend') log('spend(100) → ' + m.spend(100, 'hint'));
  else if (d === 'use') log('useLife → ' + m.useLife());
  else if (d === 'refill') { m.refillLives(); log('refilled'); }
  else if (d === 'reset') { m.reset(); log('reset'); }
  else if (d === 'app') { dispatchEvent(new CustomEvent('ap:app', { detail: { inApp: false, adFree: !(window.AP_APP && window.AP_APP.adFree) } })); log('AP_APP.adFree = ' + window.AP_APP.adFree); }
  else if (d === 'pay') {
    if (window.AP_PAY) { delete window.AP_PAY; log('AP_PAY off (test purchases)'); }
    else { window.AP_PAY = { prices: { coins_s: '€1.09' }, buy: async sku => confirm('Fake provider checkout for ' + sku + '?') }; log('AP_PAY on (fake provider)'); }
  }
  else if (d === 'sound') {
    ctx = ctx || new AudioContext();
    if (osc) { osc.stop(); osc = null; log('sound off'); }
    else { osc = ctx.createOscillator(); const g = ctx.createGain(); g.gain.value = .03; osc.connect(g).connect(ctx.destination); osc.start(); log('sound on · ctx ' + ctx.state); }
  }
  render();
});
// break4 helper: jump to level 4 for the demo
if (q.has('lvl')) M().level(+q.get('lvl'));
setStyle(style);
setInterval(render, 5000);
window.M = M;
</script>
</body>
</html>
