<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Cube Trek</title>
<meta name="theme-color" content="#5a2fd8">
<link rel="icon" href="data:,">
<style>
  body{background:radial-gradient(120% 80% at 50% 30%,#4f7bff 0%,#4a3fe0 45%,#3a1fa8 100%)!important}
  .ct-goal{position:fixed;left:50%;top:calc(112px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(12,16,48,.55);border:2px solid rgba(255,255,255,.18);border-radius:16px;padding:3px 14px 1px;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:19px;color:#fff;pointer-events:none;z-index:5;white-space:nowrap}
  .ct-goal .gem{width:20px;height:20px;transform:rotate(45deg);border-radius:4px;background:linear-gradient(135deg,#e9fbff,#4fd8ff 45%,#1c7cf0);box-shadow:0 0 10px rgba(120,230,255,.9)}
  .ct-goal.bump{animation:ctb .3s ease-out}
  @keyframes ctb{50%{transform:translateX(-50%) scale(1.18)}}
  body .hc-card h1{text-shadow:0 6px 0 #2a1785,0 10px 24px rgba(0,0,0,.25)}
  body .hc-pop{-webkit-text-stroke:2px #2a1785;paint-order:stroke fill}
  .hc-sub{display:none}
</style>
</head>
<body>
<script type="module" src="game.js"></script>
</body>
</html>
