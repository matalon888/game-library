<!doctype html>
<html lang="en">
<head>
<script src="/arcade/save.js" defer data-ap-save></script>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Twist Drop</title>
<meta name="theme-color" content="#ffd1dc">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; font-family: 'Baloo 2', system-ui, sans-serif; color: #fff; }
  body { background: linear-gradient(180deg, var(--bg1, #ffd1dc), var(--bg2, #ffe9b8)); transition: background .6s; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .top { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; z-index: 5; }
  .prog { display: flex; align-items: center; gap: 8px; }
  .lvl { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px;
    background: var(--ui, #ff5d8f); box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  .lvl.next { background: rgba(255,255,255,.55); color: var(--ui, #ff5d8f); }
  .bar { width: min(200px, 48vw); height: 12px; border-radius: 8px; background: rgba(255,255,255,.55); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ui, #ff5d8f); border-radius: 8px; transition: width .2s; }
  .score { position: fixed; top: calc(58px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-weight: 800; font-size: 54px;
    line-height: 1; text-shadow: 0 4px 0 rgba(0,0,0,.12); pointer-events: none; z-index: 5; }
  .best { position: fixed; top: calc(112px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-weight: 600; font-size: 15px; opacity: .85; pointer-events: none; z-index: 5; }
  .pop { position: fixed; left: 50%; font-weight: 800; pointer-events: none; z-index: 6; white-space: nowrap; text-shadow: 0 3px 0 rgba(0,0,0,.15);
    animation: up .9s ease-out forwards; }
  @keyframes up { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1); } }
  .card { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; z-index: 10;
    pointer-events: auto; text-align: center; padding: 20px; }
  .card h1 { margin: 0; font-size: clamp(44px, 14vw, 76px); line-height: .9; font-weight: 800; text-shadow: 0 6px 0 rgba(0,0,0,.14); }
  .card p { margin: 0; font-size: 20px; font-weight: 600; opacity: .95; text-shadow: 0 2px 0 rgba(0,0,0,.1); }
  .card .hint { margin-top: auto; margin-bottom: 14vh; font-size: 22px; animation: pulse 1.2s ease-in-out infinite; }
  .card .hand { font-size: 44px; animation: swipe 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  @keyframes swipe { 0%,100% { transform: translateX(-40px); } 50% { transform: translateX(40px); } }
  .hidden { display: none !important; }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; transition: opacity .35s; }
</style>
</head>
<body>
<div class="top"><div class="prog"><div class="lvl" id="lvA">1</div><div class="bar"><i id="bar"></i></div><div class="lvl next" id="lvB">2</div></div></div>
<div class="score" id="score">0</div>
<div class="best" id="best"></div>
<div class="flash" id="flash"></div>
<div class="card" id="start" style="justify-content:flex-start;padding-top:calc(150px + env(safe-area-inset-top))"><h1>TWIST<br>DROP</h1><div class="hint"><div class="hand">👆</div>Drag to twist</div></div>
<div class="card hidden" id="win" style="justify-content:flex-start;padding-top:calc(150px + env(safe-area-inset-top))"><p>LEVEL <span id="winLv">1</span></p><h1>CLEARED!</h1><p class="hint">Tap to continue</p></div>
<div class="card hidden" id="lose" style="justify-content:flex-start;padding-top:calc(150px + env(safe-area-inset-top))"><h1 id="loseH">OOPS!</h1><p id="losePct"></p><p class="hint">Tap to retry</p></div>
<script type="module" src="game.js"></script>
</body>
</html>
