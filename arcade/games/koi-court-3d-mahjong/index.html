<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="data:,">
<title>Koi Court: 3D Mahjong</title>
<meta name="description" content="A calm 3D mahjong solitaire: match pairs of big, easy-to-read carved tiles in a peaceful zen garden, earn stars and restore the garden one lantern at a time.">
<meta property="og:title" content="Koi Court: 3D Mahjong">
<meta property="og:description" content="Match pairs of carved ivory-and-jade tiles in a zen garden. Every deal is solvable, hints and shuffles are earned by play, and there is a new daily puzzle every day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@600;700&display=swap">
<style>
:root{--ink:#4a2a1a;--ink2:#6b3e26;--jade:#2fa58a;--jade2:#1f7d68;--red:#e8492a;--red2:#c53018;--gold:#f6c445;--cream:#fff8ec;--pink:#ff8fb3}
html,body{background:#f4dcc6!important;font-family:'Baloo 2',system-ui,sans-serif!important;color:#fff}
.hc-canvas{background:#f4dcc6}
button{font-family:inherit}
.st{-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#hud{position:fixed;inset:0;pointer-events:none;z-index:6;transition:opacity .3s}
#hud.off,#boosters.off{opacity:0;pointer-events:none}
#hud.off *{pointer-events:none!important}
#top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:0;right:0;height:46px}
.lvlp{position:absolute;left:60px;top:2px;height:42px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(#fff,#fff0dc);color:var(--ink);border-radius:14px;padding:0 12px;font-weight:800;font-size:19px;line-height:1;box-shadow:0 3px 0 rgba(74,42,26,.28);border:2px solid #fff}
.lvlp small{display:block;font-size:10px;letter-spacing:.08em;opacity:.65;font-weight:700;margin-bottom:2px}
#meter{position:absolute;left:50%;top:4px;transform:translateX(-30%);width:min(150px,34vw);height:38px}
#meter .bar{position:absolute;left:0;right:0;top:11px;height:16px;border-radius:10px;background:rgba(74,42,26,.25);border:2px solid #fff;overflow:hidden;box-shadow:0 3px 0 rgba(74,42,26,.2)}
#meter .bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#ffe48a,#f2a91a);border-radius:8px;transition:width .3s linear}
#meter .s{position:absolute;top:2px;width:30px;height:30px;margin-left:-15px;transition:transform .3s,filter .3s}
#meter .s.off{filter:grayscale(1) brightness(1.3);opacity:.7;transform:scale(.8)}
.rbtn{pointer-events:auto;position:absolute;top:2px;width:42px;height:42px;border-radius:50%;border:2px solid #fff;background:linear-gradient(#fff,#ffeedd);box-shadow:0 3px 0 rgba(74,42,26,.28);display:grid;place-items:center;cursor:pointer;padding:0}
.rbtn svg{width:22px;height:22px}
#mute{right:10px} #home{right:60px}
#chips{position:absolute;top:calc(62px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,250,240,.92);border:2px solid #fff;border-radius:16px;padding:1px 12px 0 6px;color:var(--ink);font-weight:800;font-size:17px;box-shadow:0 3px 0 rgba(74,42,26,.2)}
.chip img{width:26px;height:26px}
.chip.warn{background:linear-gradient(#ffe2d6,#ffc6b0)}
#boosters{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:18px;z-index:7;pointer-events:none;transition:opacity .3s}
.bst{pointer-events:auto;position:relative;width:70px;height:70px;border-radius:24px;border:3px solid #fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;box-shadow:0 5px 0 rgba(74,42,26,.35),0 10px 18px rgba(74,42,26,.2);transition:transform .1s;color:#fff;font-weight:800;font-size:12px;letter-spacing:.03em;-webkit-text-stroke:1px rgba(74,42,26,.6);paint-order:stroke fill}
.bst:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(74,42,26,.35)}
.bst svg{width:32px;height:32px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18));margin-bottom:-2px}
.bst b{position:absolute;right:-9px;top:-9px;min-width:26px;height:26px;border-radius:13px;background:#fff;color:var(--ink);font-weight:800;font-size:16px;line-height:27px;padding:0 6px;box-shadow:0 2px 0 rgba(74,42,26,.3);-webkit-text-stroke:0}
.bst.zero{filter:saturate(.25) brightness(1.05);opacity:.75}
.bst[data-k=hint]{background:linear-gradient(#ffd66b,#f2a01a)} .bst[data-k=shuffle]{background:linear-gradient(#7fdcc0,#2fa58a)} .bst[data-k=undo]{background:linear-gradient(#ff9a7a,#e8492a)}
.bst.shake{animation:bshake .3s}
.bst.glow{animation:bglow 1s ease-in-out infinite}
@keyframes bshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes bglow{50%{box-shadow:0 5px 0 rgba(74,42,26,.35),0 0 0 8px rgba(255,230,140,.6)}}
.toast{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:31;pointer-events:none;font-weight:800;font-size:44px;color:#fff;white-space:nowrap;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);animation:toast 1.1s ease-out forwards}
.toast.small{font-size:25px;-webkit-text-stroke:2px var(--ink);text-shadow:0 3px 0 var(--ink)}
.toast.gold{color:#ffe27a}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.fly{position:fixed;z-index:30;width:40px;height:40px;pointer-events:none;transition:transform .6s cubic-bezier(.5,-0.3,.6,1),opacity .6s;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
/* cards */
.hc-card{background:none;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))!important;gap:6px!important;justify-content:flex-start!important}
.hc-card.dim{background:linear-gradient(180deg,rgba(74,42,26,.35),rgba(74,42,26,.65))!important}
.hc-card h1{font-family:'Baloo 2',sans-serif;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)!important}
.hc-card p{color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)!important;font-weight:800}
.hc-card .hint{font-weight:800;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);margin-bottom:4vh!important}
.hc-btn{background:linear-gradient(#ff9a7a,#e8492a)!important;border:3px solid #fff!important;border-radius:20px!important;box-shadow:0 5px 0 var(--ink)!important;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
/* home */
#homeIn{width:min(460px,100%);height:100%;display:flex;flex-direction:column;align-items:center}
.logo{text-align:center;line-height:.8;margin-top:2px;pointer-events:none}
.logo h1{font-size:clamp(50px,15vw,72px)!important;margin:0;color:#fff}
.logo h1 span{color:#ffb35a}
.logo .sub{display:inline-block;margin-top:4px;background:var(--jade);border:3px solid #fff;border-radius:14px;padding:0 14px;font-weight:800;font-size:18px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;box-shadow:0 4px 0 var(--ink);transform:rotate(-3deg)}
#panel{margin-top:auto;width:100%;background:linear-gradient(#fffaf2,#fff0de);border:3px solid #fff;border-radius:28px;padding:12px 14px 12px;box-shadow:0 8px 0 rgba(74,42,26,.25),0 20px 40px rgba(74,42,26,.25);color:var(--ink);text-align:center}
#panel .k{font-size:13px;letter-spacing:.22em;font-weight:800;opacity:.7}
#panel .L{font-size:40px;line-height:1;font-weight:800;color:var(--red);-webkit-text-stroke:0;margin:0 0 6px}
#path{display:flex;justify-content:center;align-items:center;gap:6px;margin:2px 0 10px}
#path .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;border:3px solid #fff;box-shadow:0 3px 0 rgba(74,42,26,.3);-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;position:relative;flex:none}
#path .n.done{background:linear-gradient(#7fdcc0,#2fa58a)}
#path .n.cur{background:linear-gradient(#ffb08a,#e8492a);width:52px;height:52px;font-size:21px;animation:npulse 1.2s ease-in-out infinite}
#path .n.lock{background:linear-gradient(#efe4d8,#d6c6b6);-webkit-text-stroke:1px #a08a76}
#path .n i{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;letter-spacing:-2px;white-space:nowrap;-webkit-text-stroke:0}
#path .dash{width:10px;height:4px;border-radius:2px;background:#e3cdb6;flex:none}
@keyframes npulse{50%{box-shadow:0 3px 0 rgba(74,42,26,.3),0 0 0 8px rgba(232,73,42,.22)}}
.prog{position:relative;height:22px;border-radius:12px;background:#efe0cc;overflow:hidden;margin:4px 0 8px;box-shadow:inset 0 2px 3px rgba(74,42,26,.15)}
.prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#8fe0a8,#3fb36a);border-radius:12px}
.prog span{position:relative;font-weight:800;font-size:14px;line-height:23px}
#task{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:8px 8px 8px 8px;box-shadow:0 3px 0 rgba(74,42,26,.12);text-align:left;margin-bottom:10px;pointer-events:auto}
#task img{width:52px;height:52px;border-radius:12px;background:#fbf2e6;object-fit:contain;padding:3px}
#task .tx{flex:1;min-width:0} #task .tx b{display:block;font-size:18px;line-height:1.1} #task .tx small{font-size:13px;opacity:.75;font-weight:700}
#taskBtn{pointer-events:auto;border:3px solid #fff;border-radius:16px;min-width:76px;height:52px;font-weight:800;font-size:22px;color:#fff;background:linear-gradient(#ffd66b,#f2a01a);box-shadow:0 4px 0 #b06a10;cursor:pointer;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;display:flex;align-items:center;justify-content:center;gap:4px}
#taskBtn.no{filter:saturate(.3);opacity:.7}
#taskBtn svg{width:24px;height:24px}
#playBtn{pointer-events:auto;width:100%;height:64px;font-size:30px;font-weight:800;color:#fff;border:4px solid #fff;border-radius:22px;background:linear-gradient(#7fe39f,#33bf6e);box-shadow:0 6px 0 #1f7a47,0 12px 24px rgba(31,122,71,.3);-webkit-text-stroke:2px #1f5e3a;paint-order:stroke fill;cursor:pointer;animation:hcpulse 1.4s ease-in-out infinite}
#playBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #1f7a47}
.meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.meta .chip{font-size:15px;box-shadow:0 2px 0 rgba(74,42,26,.15);border-color:#f3e3cf}
.meta a.chip{pointer-events:auto;text-decoration:none;background:linear-gradient(#fff6d6,#ffe08a)}
/* win */
#winCard{background:radial-gradient(circle at 50% 26%,rgba(255,250,235,.8),rgba(255,236,220,.4) 40%,rgba(244,220,198,.6) 78%)!important;padding-top:calc(60px + env(safe-area-inset-top))!important}
#winCard .burst{position:absolute;left:50%;top:calc(200px + env(safe-area-inset-top));width:580px;height:580px;margin:-290px 0 0 -290px;border-radius:50%;background:repeating-conic-gradient(rgba(255,215,120,.38) 0 10deg,rgba(255,255,255,0) 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 14s linear infinite;pointer-events:none;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.stars{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}
.stars i{width:70px;height:70px;display:block;opacity:.3;transform:scale(.7);transition:transform .35s cubic-bezier(.3,1.8,.5,1),opacity .2s}
.stars i:nth-child(2){transform:translateY(-14px) scale(.7);width:86px;height:86px}
.stars i.on{opacity:1;transform:scale(1)} .stars i:nth-child(2).on{transform:translateY(-14px) scale(1)}
.reward{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.reward span{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border:3px solid #fff;border-radius:16px;padding:2px 12px 0 6px;color:var(--ink);font-weight:800;font-size:18px;box-shadow:0 4px 0 rgba(74,42,26,.22);-webkit-text-stroke:0}
.reward svg{width:30px;height:30px} .reward img{width:30px;height:30px}
#loading{position:fixed;left:50%;top:46%;transform:translateX(-50%);z-index:9;color:var(--ink);font-weight:800;font-size:20px;opacity:0;transition:opacity .2s;pointer-events:none;background:rgba(255,250,240,.85);border-radius:16px;padding:4px 16px}
#loading.on{opacity:1}
#bubble{position:fixed;z-index:8;pointer-events:none;background:#fff;color:var(--ink);font-weight:800;font-size:16px;border-radius:16px;padding:6px 12px;box-shadow:0 4px 0 rgba(74,42,26,.2);transform:translate(-50%,-100%);opacity:0;transition:opacity .25s;white-space:nowrap}
#bubble:after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
#bubble.on{opacity:1}
@media (min-aspect-ratio:1/1) and (min-width:700px){ #homeIn{width:100%;align-items:flex-start} .logo{margin-left:64px} #panel{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:420px} }
@media (min-width:700px){ .bst{width:76px;height:76px} #meter{width:200px} #panel{padding:16px 20px} }
@media (max-height:700px){ .logo h1{font-size:44px!important} #panel .L{font-size:32px} #playBtn{height:56px;font-size:26px} #task img{width:44px;height:44px} }
</style>
</head>
<body>
<div id="hud" class="off">
  <div id="top">
    <div class="lvlp"><small>LEVEL</small><span id="lvl">1</span></div>
    <div id="meter"><div class="bar"><i></i></div></div>
    <button class="rbtn" id="home" aria-label="Garden"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="#ff9a7a" stroke="#4a2a1a" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <button class="rbtn" id="mute" aria-label="Sound"></button>
  </div>
  <div id="chips"><span class="chip" id="pairsChip">Pairs <b id="pairs">0</b></span><span class="chip" id="leftChip">Tiles <b id="left">0</b></span></div>
</div>
<div id="boosters" class="off">
  <button class="bst" data-k="hint" aria-label="Hint"><svg viewBox="0 0 32 32"><path d="M16 3a9 9 0 0 0-5 16.5V23h10v-3.5A9 9 0 0 0 16 3z" fill="#fff"/><rect x="11.5" y="24.5" width="9" height="3" rx="1.5" fill="#fff"/><path d="M13 13l3 3 3-3" stroke="#f2a01a" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>HINT<b>0</b></button>
  <button class="bst" data-k="shuffle" aria-label="Shuffle"><svg viewBox="0 0 32 32"><path d="M3 9h5c6 0 9 14 15 14h5M3 23h5c2.5 0 4.3-2.4 6-5m4-5c1.6-2.3 3.3-4 5-4h5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><path d="M24 5l4 4-4 4M24 19l4 4-4 4" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>SHUFFLE<b>0</b></button>
  <button class="bst" data-k="undo" aria-label="Undo"><svg viewBox="0 0 32 32"><path d="M11 7 4 13l7 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 13h13a8 8 0 0 1 0 16h-4" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>UNDO<b>0</b></button>
</div>
<div id="loading">Setting the tiles…</div>
<div id="bubble"></div>
<script type="module" src="game.js"></script>
</body>
</html>
