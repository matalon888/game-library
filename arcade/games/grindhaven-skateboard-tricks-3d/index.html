<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<script src="/arcade/save.js" defer data-ap-save></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Grindhaven: Skateboard Tricks 3D</title>
<meta name="description" content="Flick to kickflip, grind rails and catch air in a sunny 3D skatepark: chain combos in 2-minute sessions in this free skateboarding game in your browser.">
<meta property="og:title" content="Grindhaven: Skateboard Tricks 3D">
<meta property="og:description" content="A free 3D skateboarding game: flick tricks, rail grinds, quarter-pipe airs and combo scoring in 2-minute sessions.">
<meta name="theme-color" content="#7cc8ff">
<link rel="icon" href="data:,">
<style>
.gh-tag{font-size:18px!important;letter-spacing:3px;opacity:.95;margin-top:2px!important}
.hc-card h1{letter-spacing:1px}
#ghPanel{display:grid;gap:8px;width:min(360px,92vw);margin-top:6px;background:rgba(20,22,40,.28);border-radius:20px;padding:12px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#ghPanel .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#ghPanel .stats{font-size:16px;font-weight:600;gap:18px}#ghPanel .stats b{font-weight:800}
#ghPanel button{font:inherit;font-weight:800;font-size:15px;color:#2b2d42;background:rgba(255,255,255,.88);border:0;border-radius:14px;padding:6px 12px;box-shadow:0 3px 0 rgba(0,0,0,.15);cursor:pointer}
#ghPanel button.on{background:var(--ui,#ff5d8f);color:#fff}#ghPanel button.lock{opacity:.6}
#ghPanel button small{opacity:.6;font-weight:600}
#ghPanel .next{font-size:14px;font-weight:600;text-align:left;opacity:.95;display:grid;gap:2px;padding:0 6px}
.hc-card .hint{margin-bottom:9vh!important}
#goals{position:fixed;left:10px;top:calc(122px + env(safe-area-inset-top));z-index:6;display:none;gap:4px;font-weight:700;font-size:12px;pointer-events:none;max-width:56vw}
body.playing #goals{display:grid}
#goals div{background:rgba(20,22,40,.32);border-radius:11px;padding:3px 9px 3px 5px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
#goals i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-style:normal;font-size:11px;flex:none}
#goals small{margin-left:auto;padding-left:8px;opacity:.85}
#goals .ok{background:rgba(58,183,149,.75)}#goals .ok i{background:#fff;color:#2a9d8f}
#mute{position:fixed;right:12px;top:calc(52px + env(safe-area-inset-top));z-index:7;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.18);font-size:18px;cursor:pointer}
.hc-pill{font-size:22px!important;padding:3px 14px!important;background:rgba(20,22,40,.38)!important}
.hc-score{font-size:46px!important}
#combo{position:fixed;left:0;right:0;top:66%;text-align:center;z-index:5;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
#combo.on,#combo.lost{opacity:1;transform:none}
#combo .names{font-weight:800;font-size:19px;text-shadow:0 2px 0 rgba(0,0,0,.25);padding:0 16px}
#combo .names em{font-style:normal;color:#fff3a8}
#combo .pts{font-weight:800;font-size:34px;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.2)}#combo .pts span{color:#ffd23f}
#combo.lost .names{color:#ff9d9d}#combo.lost .pts{display:none}
#combo.banked .pts{animation:ghb .4s ease-out}@keyframes ghb{50%{transform:scale(1.25);color:#ffd23f}}
#bal{position:fixed;left:50%;top:62%;width:min(240px,60vw);height:14px;margin-left:calc(min(240px,60vw)/-2);border-radius:8px;background:linear-gradient(90deg,#ff4d6d,#ffd23f 30%,#3ab795 45%,#3ab795 55%,#ffd23f 70%,#ff4d6d);opacity:0;z-index:5;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:opacity .15s}
#bal.on{opacity:.95}#bal b{position:absolute;top:-6px;width:8px;height:26px;margin-left:-4px;border-radius:4px;background:#fff;box-shadow:0 0 0 2px #2b2d42}
#bal.warn b{background:#ff4d6d}
.pad{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));z-index:4;pointer-events:none;display:none;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:11px;letter-spacing:1px;opacity:.85;text-shadow:0 1px 0 rgba(0,0,0,.3)}
body.touch.playing .pad{display:flex}
#padL{left:16px}#padR{right:14px}
.pad .ring{width:104px;height:104px;border-radius:50%;border:3px solid rgba(255,255,255,.65);background:rgba(20,22,40,.18);display:grid;place-items:center}
.pad .knob{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.2);transition:transform .08s}
#padL.act .ring{border-color:#fff;background:rgba(20,22,40,.3)}
.pad .flk{width:170px;padding:10px 8px;border-radius:22px;border:3px dashed rgba(255,255,255,.6);background:rgba(20,22,40,.18);text-align:center;font-size:12px;line-height:1.45;letter-spacing:0}
#padR.hit .flk{animation:ghf .3s}@keyframes ghf{40%{background:rgba(255,255,255,.45);transform:scale(1.05)}}
#keys{display:none;position:fixed;bottom:14px;left:0;right:0;text-align:center;font-weight:700;font-size:14px;opacity:.9;z-index:4;pointer-events:none;text-shadow:0 1px 0 rgba(0,0,0,.3)}
body.playing:not(.touch) #keys{display:block}
#ghToast{position:fixed;left:50%;top:calc(240px + env(safe-area-inset-top));transform:translate(-50%,20px);opacity:0;z-index:30;background:rgba(20,22,40,.9);color:#fff;font-weight:700;font-size:15px;border-radius:14px;padding:9px 14px;max-width:calc(100% - 32px);text-align:center;transition:.3s;pointer-events:none}
#ghToast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<script type="module" src="game.js"></script>
</body>
</html>
