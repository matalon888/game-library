<!doctype html>
<html lang="en">
<head>
<script src="/arcade/save.js" defer data-ap-save></script>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Noggin Cup: 1v1 Soccer</title>
<meta name="description" content="Drag to run, tap to jump and kick, and outscore a big-noggin rival in a 60 second 1v1 soccer match: a free football game in your browser.">
<meta property="og:title" content="Noggin Cup: 1v1 Soccer">
<meta property="og:description" content="Quick 1v1 soccer duels with big-noggin players and a charged power shot. Free in your browser.">
<meta name="theme-color" content="#8fd3ff">
<link rel="icon" href="data:,">
<style>
  .board{position:fixed;top:calc(10px + env(safe-area-inset-top));background:rgba(0,0,0,.2);border-radius:20px;padding:2px 14px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:10px;font-weight:800;pointer-events:none}.board .t{font-size:34px;min-width:34px;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.18)}.board .clk{background:rgba(0,0,0,.25);border-radius:12px;padding:0 12px;font-size:22px}.board .n{font-size:13px;opacity:.9;letter-spacing:1px}.power{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(240px,62vw);height:22px;border-radius:12px;background:rgba(0,0,0,.22);overflow:hidden;z-index:6;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.12)}.power i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff7b2e);border-radius:12px;transition:width .15s}.power b{position:absolute;inset:0;text-align:center;font-size:14px;line-height:22px;letter-spacing:2px}.power.full i{background:linear-gradient(90deg,#ff3d6e,#ffd23f);animation:pw .4s ease-in-out infinite alternate}@keyframes pw{to{filter:brightness(1.3)}}
</style>
</head>
<body>
<div class="board" id="board"></div><div class="power" id="power"><i></i><b>POWER</b></div>
<script type="module" src="game.js"></script>
</body>
</html>
