<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Boplicity theory tests</title>
  <style>
    body{margin:0;padding:36px;background:#141414;color:#f1ede4;font:16px/1.5 system-ui}h1{color:#b98b4b}#summary{font-size:22px}li{margin:7px 0}.pass{color:#83b86c}.fail{color:#e56b6b}pre{white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>Boplicity theory tests</h1>
  <p id="summary">Running…</p>
  <ol id="results"></ol>
  <script src="theory.js?v=20260720a"></script>
  <script>
    (()=>{
      const results=[];
      const test=(name,fn)=>{try{fn();results.push({name,pass:true});}catch(error){results.push({name,pass:false,error:error.message});}};
      const equal=(actual,expected,message='')=>{if(actual!==expected)throw new Error(`${message} expected ${expected}, got ${actual}`);};
      const ok=(value,message)=>{if(!value)throw new Error(message||'expected truthy value');};
      const has=(events,type,points)=>{const event=events.find(item=>item.type===type);ok(event,`missing ${type} event`);if(points!==undefined)equal(event.points,points,type);return event;};
      const n=(midi,time,bar=0,beat=0,beatDuration=.6)=>({midi,time,bar,beat,beatDuration,offsetMs:0});
      const ctx=(symbol)=>BopTheory.createChordContext(symbol);
      const run=(notes,chord='C7',options={})=>{let state=BopTheory.createState();let events=[];for(const item of notes){const result=BopTheory.processNote(state,item,ctx(chord),options);state=result.state;events.push(...result.events);}return{state,events};};

      test('all point values live in WEIGHTS',()=>equal(Object.keys(BopTheory.WEIGHTS).sort().join(','),'ARPEGGIO,CHORD_TONE,CHORD_WEAK,COLOR_TONE,ENCLOSURE,GUIDE_TONE,GUIDE_WEAK,PASSING_TONE,SUS_RESOLUTION,TRIPLET,UNRESOLVED_HARD,UPBEAT_ENTRY'));
      test('engine config exposes ghost threshold and corpus Bird par',()=>{equal(BopTheory.CONFIG.VELOCITY_GHOST,20);equal(BopTheory.CONFIG.BIRD_PAR.harmony,165);equal(BopTheory.CONFIG.BIRD_PAR.melody,95);equal(BopTheory.CONFIG.BIRD_PAR.rhythm,50);equal(BopTheory.CONFIG.BIRD_PAR.total,310);});
      test('chord context identifies Gm7 tones and guide tones',()=>{const chord=ctx('Gm7');equal(chord.tones.join(','),'7,10,2,5');equal(chord.guides.join(','),'10,5');});
      test('generated F chords remain byte-identical to the original definitions',()=>{
        const expected={Gm7:{root:7,quality:'minor7',tones:[7,10,2,5],guides:[10,5],degrees:{10:'3rd',5:'7th'}},C7:{root:0,quality:'dominant7',tones:[0,4,7,10],guides:[4,10],degrees:{4:'3rd',10:'7th'}},Fmaj7:{root:5,quality:'major7',tones:[5,9,0,4],guides:[9,4],degrees:{9:'3rd',4:'7th'}}};
        for(const symbol of Object.keys(expected))equal(JSON.stringify(BopTheory.chordFromSymbol(symbol)),JSON.stringify(expected[symbol]),symbol);
      });
      test('makeChord transposes formulas and absolute guide degrees',()=>{const chord=BopTheory.makeChord(10,'major7');equal(chord.tones.join(','),'10,2,5,9');equal(chord.guides.join(','),'2,9');equal(chord.degrees[2],'3rd');equal(chord.degrees[9],'7th');});
      test('createChordContext accepts generated flat and sharp chord symbols',()=>{equal(ctx('Bbmaj7').tones.join(','),'10,2,5,9');equal(ctx('F#m7').tones.join(','),'6,9,1,4');equal(ctx('B7').guides.join(','),'3,9');});
      test('progressionForKey matches all twelve reference progressions',()=>{const expected={C:'Dm7 G7 Cmaj7',F:'Gm7 C7 Fmaj7',Bb:'Cm7 F7 Bbmaj7',Eb:'Fm7 Bb7 Ebmaj7',Ab:'Bbm7 Eb7 Abmaj7',Db:'Ebm7 Ab7 Dbmaj7',Gb:'Abm7 Db7 Gbmaj7',B:'C#m7 F#7 Bmaj7',E:'F#m7 B7 Emaj7',A:'Bm7 E7 Amaj7',D:'Em7 A7 Dmaj7',G:'Am7 D7 Gmaj7'};for(const [key,symbols] of Object.entries(expected)){const progression=BopTheory.progressionForKey(key),actual=progression.bars.slice(0,3).map(bar=>bar.symbol).join(' ');equal(actual,symbols,key);equal(progression.bars[3].symbol,progression.bars[2].symbol,key);equal(progression.name,`ii–V–I in ${key}`,key);}});
      test('F progression preserves the original JSON structure and bass notes',()=>{const progression=BopTheory.progressionForKey('F');equal(JSON.stringify(progression),JSON.stringify({id:'ii-v-i-f',name:'ii–V–I in F',timeSignature:[4,4],bars:[{symbol:'Gm7',root:'G2',fifth:'D3'},{symbol:'C7',root:'C2',fifth:'G2'},{symbol:'Fmaj7',root:'F2',fifth:'C3'},{symbol:'Fmaj7',root:'F2',fifth:'C3'}]}));});
      test('generated bass notes stay in the requested compact register',()=>{const pc={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11},midi=name=>{const match=name.match(/^([A-G](?:#|b)?)(-?\d+)$/);return(Number(match[2])+1)*12+pc[match[1]];};for(const key of ['C','F','Bb','Eb','Ab','Db','Gb','B','E','A','D','G'])for(const bar of BopTheory.progressionForKey(key).bars)for(const field of ['root','fifth']){const value=midi(bar[field]);ok(value>=33&&value<=52,`${key} ${bar.symbol} ${field} ${bar[field]} = ${value}`);}});
      test('two-bar count-off maps transport 2:0 exactly to session bar 1 beat 1',()=>{const start=BopTheory.sessionPositionFromTicks(8*192);equal(start.bar,0);equal(start.beat,0);const beat3=BopTheory.sessionPositionFromTicks(10*192);equal(beat3.bar,0);equal(beat3.beat,2);});
      test('spellNote uses Db rather than C# over C7',()=>equal(BopTheory.spellNote(61,ctx('C7')),'db/4'));
      test('spellNote uses Eb rather than D# over C7',()=>equal(BopTheory.spellNote(63,ctx('C7')),'eb/4'));
      test('spellNote preserves F# for the #11 over C7',()=>equal(BopTheory.spellNote(66,ctx('C7')),'f#/4'));
      test('spellNote follows selected-key accidental preference',()=>{equal(BopTheory.spellNote(70,BopTheory.createChordContext('Bbmaj7','flat')),'bb/4');equal(BopTheory.spellNote(68,BopTheory.createChordContext('Emaj7','sharp')),'g#/4');equal(BopTheory.spellNote(63,BopTheory.createChordContext('B7','sharp')),'d#/4');});
      test('guide tone on beat 1 scores +150',()=>has(run([n(64,0)],'C7').events,'guide-tone',150));
      test('Bbmaj7 guide tone on a downbeat scores identically',()=>{const event=has(run([n(62,0)],'Bbmaj7').events,'guide-tone',150);equal(event.degree,'3rd');});
      test('guide tone on beat 3 scores +150',()=>has(run([n(70,1.2,0,2)],'C7').events,'guide-tone',150));
      test('root or fifth on a strong beat scores +50',()=>has(run([n(60,0)],'C7').events,'chord-tone',50));
      test('root on beat 3 scores +50',()=>has(run([n(60,1.2,0,2)],'C7').events,'chord-tone',50));
      test('guide tone on beat 1 scores +150 in bars 2, 3, and 4',()=>{for(const bar of [1,2,3])has(run([n(64,bar*2.4,bar,0)],'C7').events,'guide-tone',150);});
      test('3rd on beat 2 scores weak guide-tone +50',()=>{const event=has(run([n(64,.6,0,1)],'C7').events,'guide-tone',50);equal(event.label,'Guide tone +50');});
      test('5th on beat 4 scores weak chord-tone +25',()=>{const event=has(run([n(67,1.8,0,3)],'C7').events,'chord-tone',25);equal(event.label,'Chord tone +25');});
      test('beat-4 chromatic approach resolves on next beat 1 with passing +25 and strong +150',()=>{let state=BopTheory.createState();let first=BopTheory.processNote(state,n(62,1.8,0,3),ctx('C7'));equal(first.events.filter(e=>e.points<0).length,0);let second=BopTheory.processNote(first.state,n(64,2.1,1,0),ctx('C7'));has(second.events,'passing-tone',25);has(second.events,'guide-tone',150);equal(second.events.filter(e=>e.type==='unresolved').length,0);});
      test('next-chord guide on and-of-4 is a +150 anticipation, not weak-beat scoring',()=>{const result=BopTheory.processNote(BopTheory.createState(),n(69,2.1,0,3.5),ctx('C7'),{nextChord:ctx('Fmaj7')});const event=has(result.events,'guide-tone',150);equal(event.anticipation,true);equal(result.events.filter(e=>e.points===50||e.type==='color-tone').length,0);});
      test('enclosure around a chord tone scores +250',()=>has(run([n(63,.1),n(65,.25),n(64,.4,0,.67)],'C7').events,'enclosure',250));
      test('enclosure stacks with guide-tone landing points',()=>{const events=run([n(63,.7,0,1.2),n(65,1.0,0,1.7),n(64,1.2,0,2)],'C7').events;has(events,'enclosure',250);has(events,'guide-tone',150);});
      test('enclosure ignores an approach more than two beats before the target',()=>{const events=run([n(63,0,0,0),n(65,3,1,1),n(64,3.6,1,2)],'C7').events;equal(events.filter(event=>event.type==='enclosure').length,0);});
      test('stepwise non-chord resolution is a +25 passing tone',()=>{const out=run([n(62,.1),n(64,.45,0,.75)],'C7');has(out.events,'passing-tone',25);equal(out.state.pending.length,0);});
      test('passing tone is never penalized in Hard mode',()=>{const out=run([n(62,.1),n(64,.45,0,.75)],'C7',{hardMode:true});has(out.events,'passing-tone',25);equal(out.events.filter(e=>e.points<0).length,0);});
      test('C7 beat-4 departure D stepped from E is never unresolved after a leap',()=>{for(const hardMode of [false,true]){let state=BopTheory.createState();for(const note of [n(64,1.5,0,2.5),n(62,1.8,0,3),n(69,2.1,0,3.5)])state=BopTheory.processNote(state,note,ctx('C7'),{hardMode}).state;const expired=BopTheory.advanceTime(state,2.5,{hardMode});equal(expired.events.filter(event=>event.type==='unresolved').length,0,`hardMode=${hardMode}`);}});
      test('Gm7 offbeat departure C stepped from Bb is protected through a phrase-ending rest',()=>{let state=BopTheory.createState();state=BopTheory.processNote(state,n(70,0,0,0),ctx('Gm7'),{hardMode:true}).state;state=BopTheory.processNote(state,n(72,.3,0,.5),ctx('Gm7'),{hardMode:true}).state;const expired=BopTheory.advanceTime(state,1,{hardMode:true});equal(expired.events.filter(event=>event.type==='unresolved').length,0);});
      test('expired departure emits a zero-point hint event',()=>{let state=BopTheory.createState();state=BopTheory.processNote(state,n(70,0,0,0),ctx('Gm7')).state;state=BopTheory.processNote(state,n(72,.3,0,.5),ctx('Gm7')).state;const expired=BopTheory.advanceTime(state,1);const event=has(expired.events,'departure-tone',0);equal(event.hint,true);equal(event.label,'Try a chromatic approach');equal(expired.state.baseScore,state.baseScore);equal(expired.state.arcadeScore,state.arcadeScore);});
      test('half-step resolution increments chromatic approaches',()=>{const out=run([n(63,.1),n(64,.4,0,.67)],'Fmaj7');has(out.events,'passing-tone',25);equal(out.state.stats.chromaticApproaches,1);});
      test('Fmaj7 beat-2 G approached and left by leap remains unresolved',()=>{for(const hardMode of [false,true]){let state=BopTheory.createState();for(const note of [n(60,0,0,0),n(67,.6,0,1),n(60,.9,0,1.5)])state=BopTheory.processNote(state,note,ctx('Fmaj7'),{hardMode}).state;const expired=BopTheory.advanceTime(state,1.3,{hardMode});has(expired.events,'unresolved',hardMode?-100:0);}});
      test('C7 D stepped from C and resolving to E earns passing +25',()=>{const out=run([n(60,0,0,0),n(62,.3,0,.5),n(64,.55,0,.92)],'C7');has(out.events,'passing-tone',25);equal(out.events.filter(event=>event.type==='unresolved').length,0);});
      test('C7 fourth approached by leap and left hanging remains unresolved in Hard mode',()=>{let state=BopTheory.createState();state=BopTheory.processNote(state,n(60,0,0,0),ctx('C7'),{hardMode:true}).state;state=BopTheory.processNote(state,n(65,.3,0,.5),ctx('C7'),{hardMode:true}).state;const expired=BopTheory.advanceTime(state,1,{hardMode:true});has(expired.events,'unresolved',-100);});
      test('C7 natural 4 resolves down to the 3rd for Sus resolution +50',()=>{const out=run([n(65,.1),n(64,.45,0,.75)],'C7');has(out.events,'sus-resolution',50);equal(out.events.filter(e=>e.type==='passing-tone').length,0);});
      test('C7 natural 4 resolving into next-chord tone at barline is +25 passing tone',()=>{let state=BopTheory.createState();state=BopTheory.processNote(state,n(65,2.9,0,3.87),ctx('C7')).state;const result=BopTheory.processNote(state,n(65,3.01,1,.01),ctx('Fmaj7'));has(result.events,'passing-tone',25);});
      test('C7 natural 4 left unresolved gets 0 Normal and -100 Hard',()=>{let normal=run([n(65,0)],'C7');normal=BopTheory.advanceTime(normal.state,.61,{hardMode:false});has(normal.events,'unresolved',0);let hard=run([n(65,0)],'C7');hard=BopTheory.advanceTime(hard.state,.61,{hardMode:true});has(hard.events,'unresolved',-100);});
      test('only altered dominant colors are protected from unresolved penalties',()=>{for(const midi of [61,63,66,68,69]){const out=run([n(midi,0)],'C7');equal(BopTheory.advanceTime(out.state,.61,{hardMode:true}).events.length,0,`MIDI ${midi}`);}const fourth=run([n(65,0)],'C7');has(BopTheory.advanceTime(fourth.state,.61,{hardMode:true}).events,'unresolved',-100);});
      test('Fmaj7 sixth is a protected color tone in both modes',()=>{for(const hardMode of [false,true]){const out=run([{...n(62,0),id:`major-six-${hardMode}`}],'Fmaj7',{hardMode});const event=has(out.events,'color-tone',25);equal(event.label,'Color tone +25');equal(out.state.pending.length,0);equal(out.state.stats.colorTones,1);equal(BopTheory.advanceTime(out.state,.61,{hardMode}).events.filter(item=>item.type==='unresolved').length,0);}});
      test('Fmaj7 sixth remains outside the chord-tone set',()=>{const chord=ctx('Fmaj7');equal(chord.tones.join(','),'5,9,0,4');equal(BopTheory.isChordTone(62,chord),false);const out=run([n(57,.1),n(60,.25),n(62,.4,0,.67)],'Fmaj7');equal(out.events.filter(event=>event.type==='arpeggio').length,0);});
      test('minor7 sixth remains unprotected',()=>{const out=run([n(64,0)],'Gm7',{hardMode:true});equal(out.events.filter(event=>event.type==='color-tone').length,0);has(BopTheory.advanceTime(out.state,.61,{hardMode:true}).events,'unresolved',-100);});
      test('leap-away becomes unresolved after one beat in Normal mode',()=>{let out=run([n(59,0)],'C7');const result=BopTheory.advanceTime(out.state,.61,{hardMode:false});has(result.events,'unresolved',0);equal(result.state.combo,0);});
      test('unresolved note is -100 in Hard mode',()=>{let out=run([n(59,0)],'C7');const result=BopTheory.advanceTime(out.state,.61,{hardMode:true});has(result.events,'unresolved',-100);});
      test('ascending three-note chord-tone arpeggio scores +200',()=>has(run([n(60,.1),n(64,.25),n(67,.4,0,.67)],'C7').events,'arpeggio',200));
      test('descending three-note chord-tone arpeggio scores +200',()=>has(run([n(70,.1),n(67,.25),n(64,.4,0,.67)],'C7').events,'arpeggio',200));
      test('even three-note beat subdivision scores triplet +100',()=>{const event=has(run([n(60,.05),n(64,.25),n(67,.45,0,.75)],'C7').events,'triplet',100);equal(event.tripletKind,'eighth');});
      test('quarter-note triplet over beats 1-2 scores triplet +100',()=>{const event=has(run([{...n(60,0,0,0),id:'quarter-triplet-1'},{...n(64,.4,0,2/3),id:'quarter-triplet-2'},{...n(67,.8,0,4/3),id:'quarter-triplet-3'}],'C7').events,'triplet',100);equal(event.tripletKind,'quarter');equal(event.noteIds.join(','),'quarter-triplet-1,quarter-triplet-2,quarter-triplet-3');});
      test('quarter-note triplet starting on beat 3 stays in its bar and scores',()=>{const event=has(run([{...n(60,1.2,0,2),id:'late-quarter-1'},{...n(64,1.6,0,2+2/3),id:'late-quarter-2'},{...n(67,2,0,3+1/3),id:'late-quarter-3'}],'C7').events,'triplet',100);equal(event.tripletKind,'quarter');});
      test('triplet bonus is capped once per bar',()=>{const out=run([n(60,.05),n(64,.25),n(67,.45,0,.75),n(60,.65,0,1.08),n(64,.85,0,1.42),n(67,1.05,0,1.75)],'C7');equal(out.events.filter(e=>e.type==='triplet').length,1);});
      test('quarter triplet shares the per-bar cap and over-cap notes are never penalized',()=>{let state=BopTheory.createState(),events=[];const notes=[{...n(60,0,0,0),id:'cap-eighth-1'},{...n(64,.2,0,1/3),id:'cap-eighth-2'},{...n(67,.4,0,2/3),id:'cap-eighth-3'},{...n(62,1,0,5/3),id:'cap-quarter-1'},{...n(66,1.4,0,7/3),id:'cap-quarter-2'},{...n(68,1.8,0,3),id:'cap-quarter-3'}];for(const note of notes){const result=BopTheory.processNote(state,note,ctx('C7'),{hardMode:true});state=result.state;events.push(...result.events);}const expired=BopTheory.advanceTime(state,3,{hardMode:true});events.push(...expired.events);equal(events.filter(event=>event.type==='triplet').length,1);equal(events.filter(event=>event.type==='unresolved').length,0);equal(expired.state.stats.triplets,1);});
      test('sixteenth-triplet ornament is unscored and resolves without an unresolved penalty',()=>{let state=BopTheory.createState(),events=[];for(const note of [{...n(62,0,0,0),id:'sixteenth-triplet-1'},{...n(63,.1,0,1/6),id:'sixteenth-triplet-2'},{...n(64,.2,0,1/3),id:'sixteenth-triplet-3'}]){const result=BopTheory.processNote(state,note,ctx('C7'),{hardMode:true});state=result.state;events.push(...result.events);}const expired=BopTheory.advanceTime(state,1,{hardMode:true});events.push(...expired.events);equal(events.filter(event=>event.type==='triplet').length,0);equal(events.filter(event=>event.type==='unresolved').length,0);});
      test('repeated one-note offbeat fragments earn no upbeat-entry bonuses',()=>{let state=BopTheory.processNote(BopTheory.createState(),{...n(60,0),id:'anchor'},ctx('C7')).state;let bonuses=[];for(let i=0;i<4;i++){const result=BopTheory.processNote(state,{...n(64,.9+i*.9,i,1.5),id:`fragment-${i}`},ctx('C7'));state=result.state;bonuses.push(...result.events.filter(event=>event.type==='upbeat-entry'));}equal(bonuses.length,0);equal(state.stats.upbeatEntries,0);});
      test('two-note offbeat fragment followed by rest earns no entry bonus',()=>{let state=BopTheory.processNote(BopTheory.createState(),{...n(60,0),id:'anchor-two'},ctx('C7')).state,events=[];for(const note of [{...n(64,.9,0,1.5),id:'two-entry'},{...n(67,1.08,0,1.8),id:'two-second'},{...n(64,2.0,1,1.5),id:'next-fragment'}]){const result=BopTheory.processNote(state,note,ctx('C7'));state=result.state;events.push(...result.events);}equal(events.filter(event=>event.type==='upbeat-entry').length,0);equal(state.stats.upbeatEntries,0);});
      test('offbeat entry banks +75 when note three confirms the phrase',()=>{let state=BopTheory.processNote(BopTheory.createState(),{...n(60,0),id:'anchor'},ctx('C7')).state;const phrase=[{...n(64,.9,0,1.5),id:'entry'},{...n(65,1.05,0,1.75),id:'phrase-2'},{...n(67,1.2,0,2),id:'phrase-3'},{...n(70,1.35,0,2.25),id:'phrase-4'},{...n(72,1.5,0,2.5),id:'phrase-5'}];let events=[];phrase.forEach(note=>{const result=BopTheory.processNote(state,note,ctx('C7'));state=result.state;events.push(...result.events);});const bonuses=events.filter(event=>event.type==='upbeat-entry');equal(bonuses.length,1);equal(bonuses[0].points,75);equal(bonuses[0].firedOn,'phrase-3');equal(bonuses[0].noteIds.join(','),'entry');});
      test('phrase entry at 68% swing position banks its bonus on note three',()=>{let state=BopTheory.processNote(BopTheory.createState(),{...n(60,0),id:'anchor'},ctx('C7')).state;let events=[];for(const note of [{...n(64,1.2,0,2.68),id:'entry-68'},{...n(65,1.35,0,2.9),id:'next-68'},{...n(67,1.5,0,3.1),id:'confirm-68'}]){const result=BopTheory.processNote(state,note,ctx('C7'),{feel:'swing'});state=result.state;events.push(...result.events);}const bonus=has(events,'upbeat-entry',75);equal(bonus.firedOn,'confirm-68');});
      test('six consecutive sixteenth-pace notes fire Double time once per line',()=>{let state=BopTheory.createState(),events=[];for(let i=0;i<8;i++){const result=BopTheory.processNote(state,{...n(60+i%4,i*.2,0,i/3),id:`fast-${i}`},ctx('C7'));state=result.state;events.push(...result.events);}const recognition=has(events,'double-time',0);equal(recognition.label,'Double time!');equal(events.filter(event=>event.type==='double-time').length,1);equal(state.stats.doubleTimeLines,1);});
      test('time-feel report reads signed grid deviation without scoring',()=>{const note={...n(64,0,0,2.68),id:'late'},deviation=BopTheory.timingDeviationMs(note,'swing');equal(Math.round(deviation),36);let state=BopTheory.processNote(BopTheory.createState(),note,ctx('C7'),{feel:'swing'}).state;equal(state.baseScore,0);ok(BopTheory.timeFeelReport(state.stats).text.includes('Nice laid-back placement'));});
      test('consistency report finds four-bar windows and a weak finish',()=>{const state={...BopTheory.createState(),barBasePoints:[100,100,100,100,80,80,80,80,60,60,60,60,10,10,10,10]};const report=BopTheory.consistencyReport(state,16);equal(report.strongest,'1-4');equal(report.weakest,'13-16');equal(report.lastIsWeakest,true);});
      test('ghost-velocity note stays neutral in Hard mode',()=>{const ghost={...n(59,0),velocity:19,id:'ghost'};const played=BopTheory.processNote(BopTheory.createState(),ghost,ctx('C7'),{hardMode:true});const event=has(played.events,'ghost-note',0);equal(event.ghost,true);equal(played.state.baseScore,0);equal(played.state.arcadeScore,0);equal(played.state.recent.length,0);const expired=BopTheory.advanceTime(played.state,99,{hardMode:true});equal(expired.events.length,0);equal(expired.state.combo,0);});
      test('three-note phrases and eighth-range gaps are tracked silently',()=>{let state=BopTheory.createState(),events=[];for(const note of [{...n(60,0,0,0),id:'profile-1'},{...n(62,.3,0,.5),id:'profile-2'},{...n(64,.6,0,1),id:'profile-3'}]){const result=BopTheory.processNote(state,note,ctx('C7'));state=result.state;events.push(...result.events);}equal(state.stats.phrases3,1);equal(state.stats.rhythmicGaps,2);equal(state.stats.eighthGaps,2);equal(events.filter(event=>event.type==='rhythmic-profile'||event.type==='phrase-3').length,0);});
      test('flow pool includes quarters and excludes phrase-final gaps at 1.6 beats',()=>{let state=BopTheory.createState();for(const note of [{...n(60,0,0,0),id:'pool-1'},{...n(62,.6,0,1),id:'pool-quarter'},{...n(64,1.56,0,2.6),id:'pool-after-rest'}])state=BopTheory.processNote(state,note,ctx('C7')).state;equal(state.stats.rhythmicGaps,1);equal(state.stats.eighthGaps,0);});
      test('exactly one bar of category par earns Legend 100',()=>{const blank=BopTheory.createState(),state={...blank,baseScore:310,stats:{...blank.stats,harmonyBasePoints:165,melodyBasePoints:95,rhythmBasePoints:50}};const grade=BopTheory.calculateGrades(state,1);equal(grade.overall,100);equal(grade.band,'Legend');});
      test('overall is the par-weighted average of capped category grades',()=>{const blank=BopTheory.createState(),state={...blank,baseScore:9999,stats:{...blank.stats,harmonyBasePoints:165,melodyBasePoints:47.5,rhythmBasePoints:0}};const grade=BopTheory.calculateGrades(state,1);equal(grade.harmony,100);equal(grade.melody,50);equal(grade.rhythm,0);equal(grade.overall,69);});
      test('one overflowing category cannot carry two weaker categories to 100',()=>{const blank=BopTheory.createState(),state={...blank,baseScore:9999,stats:{...blank.stats,harmonyBasePoints:165*.7,melodyBasePoints:950,rhythmBasePoints:50*.7}};const grade=BopTheory.calculateGrades(state,1);equal(grade.harmony,70);equal(grade.melody,100);equal(grade.rhythm,70);equal(grade.overall,79);});
      test('Hard grading curve matches its four reference ratios',()=>{for(const [ratio,expected] of [[.5,26],[.8,56],[1,80],[1.15,100]]){const blank=BopTheory.createState(),state={...blank,baseScore:310*ratio,stats:{...blank.stats,harmonyBasePoints:165*ratio,melodyBasePoints:95*ratio,rhythmBasePoints:50*ratio}};const grade=BopTheory.calculateGrades(state,1,{hardMode:true});equal(grade.overall,expected,`overall ratio ${ratio}`);equal(grade.harmony,expected,`harmony ratio ${ratio}`);equal(grade.melody,expected,`melody ratio ${ratio}`);equal(grade.rhythm,expected,`rhythm ratio ${ratio}`);}});
      test('Hard grading caps only the overall grade at 95 when any note is unresolved',()=>{const blank=BopTheory.createState(),state={...blank,baseScore:620,stats:{...blank.stats,unresolved:1,harmonyBasePoints:330,melodyBasePoints:190,rhythmBasePoints:100}};const hard=BopTheory.calculateGrades(state,1,{hardMode:true});equal(hard.overall,95);equal(hard.harmony,100);equal(hard.melody,100);equal(hard.rhythm,100);equal(BopTheory.calculateGrades(state,1).overall,100);});
      test('combo-inflated arcade score does not change musicianship grade',()=>{let state=BopTheory.createState();for(let i=0;i<5;i++)state=BopTheory.applyScoringEvents(state,[{type:'guide-tone',points:50}]).state;ok(state.arcadeScore>state.baseScore);const before=BopTheory.calculateGrades(state,10),inflated={...state,arcadeScore:999999},after=BopTheory.calculateGrades(inflated,10);equal(after.overall,before.overall);equal(after.harmony,before.harmony);equal(after.melody,before.melody);equal(after.rhythm,before.rhythm);});
      test('empty categories grade zero without division errors',()=>{const state={...BopTheory.createState(),baseScore:50,stats:{...BopTheory.createState().stats,harmonyBasePoints:50}};const grade=BopTheory.calculateGrades(state,1);equal(grade.melody,0);equal(grade.rhythm,0);equal(BopTheory.gradeFor(0,0,0),0);});
      test('quarter-note profile lowers Rhythm through weak eighth flow',()=>{const blank=BopTheory.createState(),state={...blank,stats:{...blank.stats,rhythmBasePoints:800,phrases3:4,rhythmicGaps:12,eighthGaps:0,triplets:4,upbeatEntries:4}};const grade=BopTheory.calculateGrades(state,16);equal(grade.rhythmPoints,100);equal(grade.rhythmProfile.applied,true);equal(grade.rhythmProfile.eighthFlow,0);equal(grade.rhythmProfile.profile,67);equal(grade.rhythm,87);});
      test('eighth flow gives full credit to 70-percent and half-eighth pools',()=>{const blank=BopTheory.createState();for(const eighthGaps of [7,5,4]){const state={...blank,stats:{...blank.stats,rhythmBasePoints:800,phrases3:4,rhythmicGaps:10,eighthGaps,triplets:4,upbeatEntries:4}},grade=BopTheory.calculateGrades(state,16);equal(grade.rhythmProfile.eighthFlow,100,`${eighthGaps}/10 eighth gaps`);}});
      test('eighth flow uses the revised two-segment curve below 40 percent',()=>{const blank=BopTheory.createState();for(const [eighthGaps,expected] of [[2,52],[1,27],[0,0]]){const state={...blank,stats:{...blank.stats,rhythmBasePoints:800,phrases3:4,rhythmicGaps:10,eighthGaps,triplets:4,upbeatEntries:4}},grade=BopTheory.calculateGrades(state,16);equal(grade.rhythmProfile.eighthFlow,expected,`${eighthGaps}/10 eighth gaps`);}});
      test('varied eighth-line profile with triplets and upbeat phrases scores 90+',()=>{const blank=BopTheory.createState(),state={...blank,stats:{...blank.stats,rhythmBasePoints:800,phrases3:4,rhythmicGaps:12,eighthGaps:8,triplets:4,upbeatEntries:3}};const grade=BopTheory.calculateGrades(state,16);equal(grade.rhythmProfile.eighthFlow,100);equal(grade.rhythmProfile.tripletSprinkle,100);equal(grade.rhythmProfile.upbeatRate,100);equal(grade.rhythmProfile.profile,100);ok(grade.rhythm>=90);});
      test('two triplets in sixteen bars score 50 on sprinkle and trim a perfect points grade',()=>{const blank=BopTheory.createState(),state={...blank,stats:{...blank.stats,harmonyBasePoints:2640,melodyBasePoints:1520,rhythmBasePoints:800,phrases3:4,rhythmicGaps:12,eighthGaps:8,triplets:2,upbeatEntries:3}};const grade=BopTheory.calculateGrades(state,16);equal(grade.harmony,100);equal(grade.melody,100);equal(grade.rhythmProfile.tripletSprinkle,50);equal(grade.rhythmProfile.profile,83);equal(grade.rhythm,93);});
      test('rhythmic profile skips sessions below either sample threshold',()=>{const blank=BopTheory.createState();for(const stats of [{...blank.stats,rhythmBasePoints:800,phrases3:3,rhythmicGaps:12,eighthGaps:8},{...blank.stats,rhythmBasePoints:800,phrases3:4,rhythmicGaps:9,eighthGaps:6}]){const grade=BopTheory.calculateGrades({...blank,stats},16);equal(grade.rhythmProfile.applied,false);equal(grade.rhythm,100);}});
      test('Hard mode curves the blended Rhythm grade after profiling',()=>{const blank=BopTheory.createState(),state={...blank,stats:{...blank.stats,rhythmBasePoints:800,phrases3:4,rhythmicGaps:12,eighthGaps:8,triplets:2,upbeatEntries:3}},grade=BopTheory.calculateGrades(state,16,{hardMode:true}),expected=Math.round(100*Math.pow((93/100)/1.15,1.6));equal(grade.rhythmProfile.profile,83);equal(grade.rhythm,expected);});
      test('each positive device maps once to its Bird-par category',()=>{const events=[{type:'guide-tone',points:150,anticipation:true},{type:'passing-tone',points:25},{type:'triplet',points:100}];const state=BopTheory.applyScoringEvents(BopTheory.createState(),events).state;equal(state.baseScore,275);equal(state.stats.harmonyBasePoints,150);equal(state.stats.melodyBasePoints,25);equal(state.stats.rhythmBasePoints,100);});
      test('grade bands map all eight tiers and requested spot checks',()=>{for(const [grade,band] of [[100,'Legend'],[95,'Legend'],[94,'Headliner'],[90,'Headliner'],[85,'Headliner'],[84,'Bandleader'],[78,'Bandleader'],[75,'Bandleader'],[74,'Gigging'],[68,'Gigging'],[65,'Gigging'],[64,'Sideman'],[55,'Sideman'],[50,'Sideman'],[49,'Comping'],[40,'Comping'],[35,'Comping'],[34,'Jam Session'],[25,'Jam Session'],[20,'Jam Session'],[19,'Woodshedding'],[10,'Woodshedding'],[0,'Woodshedding']])equal(BopTheory.gradeBand(grade),band,`grade ${grade}`);});
      test('combo reaches x2 at five positives and unresolved breaks it',()=>{let state=BopTheory.createState();const positive={type:'test',points:1,label:'test'};for(let i=0;i<5;i++)state=BopTheory.applyScoringEvents(state,[positive]).state;equal(state.combo,5);equal(state.multiplier,2);state=BopTheory.applyScoringEvents(state,[{type:'unresolved',points:0,label:'Unresolved'}]).state;equal(state.combo,0);equal(state.multiplier,1);});
      test('rests are free: advancing empty state creates no events',()=>equal(BopTheory.advanceTime(BopTheory.createState(),99).events.length,0));

      const list=document.querySelector('#results');
      for(const result of results){const li=document.createElement('li');li.className=result.pass?'pass':'fail';li.textContent=result.pass?`PASS — ${result.name}`:`FAIL — ${result.name}: ${result.error}`;list.appendChild(li);}
      const passed=results.filter(r=>r.pass).length;const failed=results.length-passed;
      document.querySelector('#summary').textContent=`${passed}/${results.length} passed${failed?` — ${failed} failed`:''}`;
      document.querySelector('#summary').className=failed?'fail':'pass';
      window.__theoryTestResults={passed,failed,total:results.length,results};
    })();
  </script>
