<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<script src="/arcade/save.js" defer data-ap-save></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deskfolk: Idle Office for Your AI Agents</title>
<meta name="description" content="Connect Claude Code or Codex and watch your AI agents work in a pixel office. Every tool call earns coins to grow the office. Runs in your browser, nothing uploaded.">
<meta property="og:title" content="Deskfolk: Idle Office for Your AI Agents">
<meta property="og:description" content="Your Claude Code and Codex agents, live, as tiny office workers. Earn coins from their tool calls and build the office.">
<meta name="theme-color" content="#1d1a2b">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c" aria-label="Your agents' pixel office"></canvas>
<header id="bar">
  <div class="brand">DESKFOLK <span id="lvl">Lv 1</span></div>
  <div class="stats">
    <span title="Coins">🪙 <b id="coins">0</b></span>
    <span title="Tool calls today">⚡ <b id="tools">0</b></span>
    <span title="Tokens today">◆ <b id="tokens">0</b></span>
    <span title="Agents at work">👥 <b id="agents">0</b></span>
  </div>
  <nav>
    <button id="bShop">Shop</button>
    <button id="bToday">Today</button>
    <button id="bBoard">🏆</button>
    <button id="bConnect">Connect</button>
  </nav>
</header>
<div id="toasts"></div>

<section id="shop" class="card panel" hidden>
  <header><h2>Shop</h2><button class="x" data-close>✕</button></header>
  <div id="shopList"></div>
</section>

<section id="today" class="card panel" hidden>
  <header><h2>Today</h2><button class="x" data-close>✕</button></header>
  <div id="todayBody"></div>
  <button class="big" id="bShare">Share my agents' day</button>
</section>

<script type="module" src="game.js"></script>
</body>
</html>
