<!doctype html>
<html lang="en">
<head>
<script src="/arcade/save.js" defer data-ap-save></script>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Daubdeck Bingo: Free Bingo Travel Rooms</title>
<meta name="description" content="Free bingo for fun: play 1 to 4 cards, daub the called balls, charge power-ups and travel from a Paris café to an alpine lodge collecting stamps.">
<meta property="og:title" content="Daubdeck Bingo: Free Bingo Travel Rooms">
<meta property="og:description" content="Classic 75-ball bingo with a charming caller, power-ups, 8 travel rooms and a stamp album. Free coins only, fair draws, just for fun.">
<meta name="theme-color" content="#ffd3df">
<link rel="icon" href="data:,">
<style>
:root{--plum:#4b2160;--plum2:#7a3a8f;--gold:#ffc93c;--gold2:#f39a1c;--cream:#fffaf2;--rose:#ff5d8f;--c1:#e8457c;--c2:#ff8fb1;--dab:#ff3d7f;--glow:#ffb3c9}
body{background:linear-gradient(180deg,#ffd3df,#fff1df)}
.hc-score,.hc-top,.hc-sub{display:none!important}
.dd,.dd *{font-family:'Baloo 2',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.dd-hidden{display:none!important}
.dd-btn{pointer-events:auto;font:inherit;font-weight:800;border:0;cursor:pointer;color:#fff;border-radius:22px;touch-action:manipulation;transition:transform .08s,filter .2s;padding:0}
.dd-btn:active{transform:translateY(3px) scale(.98)}
.dd-green{background:linear-gradient(180deg,#86e860,#3dae3a);box-shadow:0 6px 0 #2a7d2a,0 10px 24px rgba(40,90,30,.3),inset 0 2px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(20,80,20,.45)}
.dd-goldb{background:linear-gradient(180deg,#ffe066,#ffb21f);box-shadow:0 6px 0 #c77a0a,0 10px 22px rgba(170,90,0,.3),inset 0 2px 0 rgba(255,255,255,.7);color:#6b3500;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.dd-pinkb{background:linear-gradient(180deg,#ff8fb1,#ff4f86);box-shadow:0 5px 0 #c2305f,0 8px 18px rgba(160,30,80,.3),inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 rgba(140,20,60,.4)}
.dd-white{background:linear-gradient(180deg,#fff,#f6ecf4);color:var(--plum);box-shadow:0 4px 0 rgba(120,60,120,.22),0 6px 14px rgba(90,40,80,.12)}
.dd-plumb{background:linear-gradient(180deg,#9b4fb8,#5b2a78);box-shadow:0 5px 0 #3a1650,0 8px 18px rgba(60,20,80,.3),inset 0 2px 0 rgba(255,255,255,.35)}
/* top bar */
#dd-top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:60px;right:10px;display:flex;align-items:center;gap:7px;z-index:20;pointer-events:none}
.dd-pill{display:flex;align-items:center;gap:6px;height:42px;padding:0 12px 0 5px;border-radius:999px;background:linear-gradient(180deg,#8a43a6,#5b2a78);border:3px solid #ffe7a6;box-shadow:0 4px 0 rgba(60,20,80,.35);color:#fff;font-weight:800;font-size:21px;pointer-events:auto;white-space:nowrap}
.dd-pill .plus{width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#86e860,#3dae3a);display:grid;place-items:center;font-size:20px;line-height:1;box-shadow:0 2px 0 #2a7d2a;margin-left:2px}
.dd-coin{width:30px;height:30px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff6b8 0 12%,#ffd23f 30%,#f0a019 70%,#b8660a);box-shadow:inset 0 -2px 0 rgba(120,60,0,.35),0 1px 2px rgba(0,0,0,.2);position:relative}
.dd-coin:after{content:'';position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(160,90,0,.35)}
.dd-starI{font-size:26px;filter:drop-shadow(0 2px 0 rgba(120,60,0,.4));line-height:1}
.dd-pill.bump{animation:ddbump .35s ease-out}@keyframes ddbump{40%{transform:scale(1.18)}}
#dd-roomchip{flex:1 1 auto;min-width:0;max-width:200px;height:42px;border-radius:16px;background:rgba(255,255,255,.9);color:var(--plum);display:flex;flex-direction:column;justify-content:center;padding:0 10px;box-shadow:0 4px 0 rgba(120,60,120,.18);line-height:1.05}
#dd-roomchip b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#dd-roomchip small{font-size:12px;font-weight:700;opacity:.65;white-space:nowrap}
.dd-ic{width:42px;height:42px;border-radius:50%;flex:none;font-size:19px;display:grid;place-items:center}
.dd-spacer{flex:1}#dd-roomchip:not(.dd-hidden)~.dd-spacer{flex:0}
/* play HUD */
#dd-strip{position:fixed;left:8px;right:8px;z-index:15;display:flex;align-items:center;gap:8px;pointer-events:none}
.dd-balls{flex:none;width:66px;height:62px;border-radius:18px;background:linear-gradient(180deg,#fff,#fbeff5);box-shadow:0 4px 0 rgba(120,60,120,.22);color:var(--plum);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dd-balls small{font-size:11px;font-weight:800;letter-spacing:.6px;opacity:.6}.dd-balls b{font-size:30px}
.dd-balls.low b{color:#e2304f;animation:ddpulse 1s infinite}
@keyframes ddpulse{50%{transform:scale(1.12)}}
.dd-rail{flex:1;min-width:0;height:62px;border-radius:31px;background:linear-gradient(180deg,rgba(75,33,96,.86),rgba(55,20,72,.92));box-shadow:inset 0 3px 8px rgba(0,0,0,.35),0 3px 0 rgba(255,231,166,.9);display:flex;align-items:center;gap:5px;padding:0 6px;overflow:hidden}
.dd-ball{--bc:#2f7bff;flex:none;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.85) 0 7%,transparent 22%),radial-gradient(circle at 50% 55%,var(--bc) 55%,color-mix(in srgb,var(--bc) 60%,#000) 100%);display:grid;place-items:center;box-shadow:0 3px 5px rgba(0,0,0,.35);animation:ddballin .45s cubic-bezier(.3,1.6,.5,1)}
.dd-ball i{width:66%;height:66%;border-radius:50%;background:#fff;color:#2a1d3a;font-style:normal;font-weight:800;font-size:15px;display:grid;place-items:center;line-height:1;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.dd-ball i small{display:block;font-size:8px;margin-bottom:-3px;opacity:.7}
.dd-ball.big{width:54px;height:54px}.dd-ball.big i{font-size:18px}
.dd-ball.N{--bc:#e9e6f0}.dd-ball.N i{box-shadow:0 0 0 2px #ffd34d}
.dd-ball:nth-child(n+6){opacity:.55;transform:scale(.85)}
@keyframes ddballin{from{transform:translateX(-30px) scale(.3);opacity:0}}
.dd-pat{flex:none;width:66px;height:62px;border-radius:18px;background:linear-gradient(180deg,#fff,#fbeff5);box-shadow:0 4px 0 rgba(120,60,120,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:auto;cursor:pointer}
.dd-pat small{font-size:9.5px;font-weight:800;color:var(--plum);opacity:.75;line-height:1;white-space:nowrap;max-width:62px;overflow:hidden;text-overflow:ellipsis}
.dd-mini{display:grid;grid-template-columns:repeat(5,7px);gap:1.5px}
.dd-mini i{width:7px;height:7px;border-radius:2px;background:#ecdff0}.dd-mini i.on{background:var(--c1)}
/* cards */
#dd-cards{position:fixed;z-index:12;display:grid;gap:8px;justify-content:center;align-content:center;pointer-events:none}
.dd-card{--cs:40px;position:relative;pointer-events:auto;padding:5px 5px 6px;border-radius:calc(var(--cs) * .38);background:linear-gradient(180deg,var(--c2),var(--c1));box-shadow:0 6px 0 color-mix(in srgb,var(--c1) 65%,#000),0 12px 26px rgba(70,20,60,.28),inset 0 2px 0 rgba(255,255,255,.45);transition:transform .25s,box-shadow .25s}
.dd-card.ready{animation:ddready 1s ease-in-out infinite}
@keyframes ddready{50%{box-shadow:0 6px 0 color-mix(in srgb,var(--c1) 65%,#000),0 0 0 4px #ffe066,0 0 34px 8px rgba(255,210,60,.75)}}
.dd-head{display:grid;grid-template-columns:repeat(5,var(--cs));gap:3px;margin-bottom:4px;position:relative}
.dd-head span{height:calc(var(--cs) * .62);display:grid;place-items:center;font-weight:800;font-size:calc(var(--cs) * .48);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);line-height:1}
.dd-grid{display:grid;grid-template-columns:repeat(5,var(--cs));gap:3px;padding:3px;border-radius:calc(var(--cs) * .26);background:rgba(255,255,255,.25)}
.dd-cell{position:relative;width:var(--cs);height:var(--cs);border-radius:calc(var(--cs) * .22);background:linear-gradient(180deg,#fffdf8,#fff2e2);box-shadow:inset 0 -3px 0 rgba(180,120,90,.18),0 1px 0 rgba(0,0,0,.08);display:grid;place-items:center;font-weight:800;font-size:calc(var(--cs) * .44);color:var(--plum);cursor:pointer;touch-action:manipulation;line-height:1;overflow:visible}
.dd-cell b{position:relative;z-index:2;transition:color .2s}
.dd-cell .dab{position:absolute;inset:7%;border-radius:50%;z-index:1;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.9) 0 8%,transparent 26%),radial-gradient(circle at 50% 60%,var(--dab) 60%,color-mix(in srgb,var(--dab) 60%,#000));box-shadow:0 2px 4px rgba(0,0,0,.25);transform:scale(0) rotate(-30deg);transition:transform .32s cubic-bezier(.3,1.8,.5,1)}
.dd-cell.on .dab{transform:scale(1) rotate(0)}
.dd-cell.on b{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.dd-cell.magic .dab{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0 8%,transparent 26%),conic-gradient(from 0deg,#ff7eb6,#ffd23f,#7cf0c0,#7fb6ff,#c58bff,#ff7eb6)}
.dd-cell.free{background:radial-gradient(circle at 50% 45%,#fff7d6,#ffe08a);cursor:default}
.dd-cell.free b{font-size:calc(var(--cs) * .56);color:#e29a12;text-shadow:0 1px 0 #fff}
.dd-cell.free.on b{color:#fff}
.dd-cell.miss{animation:ddmiss 1.1s ease-in-out infinite}
@keyframes ddmiss{50%{box-shadow:inset 0 0 0 3px #ffc93c,0 0 12px 3px rgba(255,200,60,.8)}}
.dd-cell.won:after{content:'';position:absolute;inset:-2px;border-radius:calc(var(--cs) * .24);border:3px solid #ffd23f;box-shadow:0 0 10px rgba(255,210,60,.9);z-index:3;animation:ddwon .6s ease-out}
@keyframes ddwon{from{transform:scale(1.4);opacity:0}}
.dd-cell.nope{animation:ddnope .3s}
@keyframes ddnope{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.dd-cell .pz{position:absolute;right:-3px;top:-3px;width:calc(var(--cs) * .5);height:calc(var(--cs) * .5);z-index:4;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));animation:ddbob 1.6s ease-in-out infinite}
.dd-cell .pz.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b8 0 12%,#ffd23f 30%,#f0a019 70%,#b8660a)}
.dd-cell .pz.stamp{width:calc(var(--cs) * .62);height:calc(var(--cs) * .62);right:-5px;top:-6px;border-radius:3px;background:#fff center/82% no-repeat;box-shadow:0 0 0 2px #fff,0 0 0 3px #e7a9c2;transform:rotate(8deg)}
@keyframes ddbob{50%{transform:translateY(-2px) rotate(6deg)}}
.dd-card.pick .dd-cell:not(.on){animation:ddpick 1s ease-in-out infinite;cursor:crosshair}
@keyframes ddpick{50%{box-shadow:inset 0 0 0 3px #7fb6ff,0 0 10px 2px rgba(120,180,255,.8)}}
.dd-badges{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:flex;gap:2px}
.dd-badge{position:absolute;left:50%;top:-11px;transform:translateX(-50%);z-index:6;background:linear-gradient(180deg,#ffe066,#ffb21f);color:#6b3500;font-weight:800;font-size:12px;padding:1px 9px;border-radius:999px;box-shadow:0 2px 0 #c77a0a;white-space:nowrap;line-height:1.5}
.dd-full{position:absolute;inset:0;border-radius:inherit;background:rgba(255,248,230,.55);display:grid;place-items:center;z-index:8;pointer-events:none}
.dd-full b{font-size:calc(var(--cs) * .7);color:#fff;background:linear-gradient(180deg,#ffe066,#ff9f1c);padding:2px 16px;border-radius:999px;box-shadow:0 4px 0 #c77a0a;transform:rotate(-8deg);text-shadow:0 2px 0 rgba(150,70,0,.4)}
/* bottom bar */
#dd-bot{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));z-index:16;display:flex;align-items:center;justify-content:center;gap:14px;pointer-events:none;padding:0 12px}
#dd-power{position:relative;width:70px;height:70px;border-radius:50%;background:conic-gradient(#ffd23f calc(var(--p,0) * 1%),rgba(255,255,255,.35) 0);padding:6px;box-shadow:0 5px 0 rgba(60,20,80,.3);pointer-events:auto}
#dd-power i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b46ad2,#5b2a78);font-style:normal;font-size:28px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
#dd-power small{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;background:#fff;color:var(--plum);border-radius:999px;padding:0 7px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.15)}
#dd-power.full{animation:ddpow 0.9s ease-in-out infinite}#dd-power.full i{background:radial-gradient(circle at 35% 30%,#ffe9a0,#ff9f1c)}
@keyframes ddpow{50%{transform:scale(1.1);box-shadow:0 0 0 5px rgba(255,220,90,.55),0 0 26px 6px rgba(255,190,40,.8)}}
#dd-bingo{width:min(190px,46vw);height:70px;border-radius:26px;font-size:34px;letter-spacing:1px;position:relative}
#dd-bingo.off{background:linear-gradient(180deg,#e7dcec,#c8b6d2);box-shadow:0 5px 0 #9a86a8;color:#fff;text-shadow:0 2px 0 rgba(80,60,100,.3)}
#dd-bingo.on{animation:ddbingo .7s ease-in-out infinite}
@keyframes ddbingo{50%{transform:scale(1.07)}}
#dd-bingo .x2{position:absolute;right:-8px;top:-10px;font-size:15px;background:#ff4f86;color:#fff;border-radius:999px;padding:0 7px;box-shadow:0 2px 0 #b02d63;text-shadow:none}
#dd-fast{width:58px;height:58px;border-radius:50%;font-size:22px}
#dd-fast.on{background:linear-gradient(180deg,#ffe066,#ffb21f);box-shadow:0 5px 0 #c77a0a;color:#6b3500}
/* host bubble + big toasts */
.dd-bubble{position:fixed;z-index:14;transform:translate(-50%,-100%);background:#fff;color:var(--plum);font-weight:800;font-size:17px;padding:5px 14px 6px;border-radius:18px;box-shadow:0 5px 0 rgba(120,60,120,.2),0 8px 20px rgba(80,30,80,.2);white-space:nowrap;pointer-events:none;animation:ddin .3s cubic-bezier(.3,1.6,.5,1)}
.dd-bubble:after{content:'';position:absolute;left:24px;bottom:-9px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.dd-bubble small{display:block;font-size:12px;opacity:.6;font-weight:700;margin-top:-3px}
@keyframes ddin{from{transform:translate(-50%,-80%) scale(.6);opacity:0}}
#dd-big{position:fixed;left:50%;top:42%;z-index:40;pointer-events:none;transform:translate(-50%,-50%);font-weight:800;font-size:clamp(64px,22vw,130px);color:#fff;letter-spacing:2px;white-space:nowrap;
  background:linear-gradient(180deg,#fff7c2 10%,#ffd23f 45%,#ff9f1c 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 6px 0 #c2305f) drop-shadow(0 12px 22px rgba(120,20,60,.45));opacity:0}
#dd-big.go{animation:ddbig 1.5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes ddbig{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-12deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(-4deg)}30%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1.04) rotate(-4deg)}}
.dd-toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);z-index:45;background:rgba(255,250,244,.97);color:var(--plum);border-radius:20px;padding:8px 16px 8px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(80,30,80,.3),0 3px 0 rgba(160,110,140,.3);font-weight:800;font-size:16px;line-height:1.15;pointer-events:none;animation:ddtoast 2.6s ease forwards;white-space:nowrap}
.dd-toast img,.dd-toast .ico{width:48px;height:48px;border-radius:10px;object-fit:contain;background:#fff;font-size:34px;display:grid;place-items:center}
.dd-toast small{display:block;font-weight:700;font-size:12px;opacity:.6}
@keyframes ddtoast{0%{opacity:0;transform:translate(-50%,-20px) scale(.8)}10%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.dd-fly{position:fixed;z-index:46;pointer-events:none;width:26px;height:26px;margin:-13px 0 0 -13px}
.dd-spark{position:fixed;z-index:30;pointer-events:none;width:8px;height:8px;margin:-4px;border-radius:50%}
/* power reveal */
#dd-reveal{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:42;background:linear-gradient(180deg,#fffaf3,#ffeede);border-radius:26px;padding:14px 26px 16px;text-align:center;color:var(--plum);box-shadow:0 18px 50px rgba(60,20,70,.4),0 5px 0 #e6b9c9;pointer-events:none;animation:ddrev 1.4s ease forwards;min-width:200px}
#dd-reveal .i{font-size:54px;line-height:1.1}#dd-reveal b{display:block;font-size:24px}#dd-reveal small{font-size:14px;opacity:.7;font-weight:700}
@keyframes ddrev{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-8deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
#dd-banner{position:fixed;left:50%;z-index:30;transform:translateX(-50%);background:linear-gradient(180deg,#7fb6ff,#3f7fe0);color:#fff;font-weight:800;font-size:17px;padding:4px 16px;border-radius:999px;box-shadow:0 3px 0 #2a5aa8;pointer-events:none;white-space:nowrap}
/* lobby */
#dd-lobby{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 20px));z-index:20;pointer-events:none;display:flex;flex-direction:column;gap:9px}
.dd-panel{pointer-events:auto;background:linear-gradient(180deg,rgba(255,252,247,.97),rgba(255,243,236,.97));border-radius:26px;padding:10px 12px 12px;color:var(--plum);box-shadow:0 10px 30px rgba(90,40,80,.25),0 4px 0 rgba(200,150,170,.4)}
.dd-roomnav{display:flex;align-items:center;gap:8px}
.dd-roomnav .dd-btn{width:44px;height:44px;border-radius:50%;font-size:22px}
.dd-roomnav .dd-btn[disabled]{opacity:.35;pointer-events:none}
.dd-rt{flex:1;text-align:center;line-height:1.05}
.dd-rt small{display:block;font-size:12px;font-weight:800;letter-spacing:1.4px;opacity:.55;text-transform:uppercase}
.dd-rt b{display:block;font-size:27px;color:var(--c1);text-shadow:0 2px 0 rgba(0,0,0,.06);white-space:nowrap}
.dd-rounds{display:flex;justify-content:center;gap:7px;margin:8px 0 4px}
.dd-round{width:52px;height:46px;border-radius:14px;background:#f3e6ee;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px;line-height:1;color:#a48aa8;box-shadow:inset 0 -3px 0 rgba(150,100,140,.15)}
.dd-round.done{background:linear-gradient(180deg,var(--c2),var(--c1));color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c1) 60%,#000)}
.dd-round.cur{background:#fff;color:var(--c1);box-shadow:0 0 0 3px var(--c1),0 3px 0 rgba(0,0,0,.1);animation:ddpulse 1.4s ease-in-out infinite}
.dd-round.hard.cur,.dd-round.hard{outline:2px dashed #e2304f;outline-offset:-4px}
.dd-round small{font-size:11px;letter-spacing:-1px;margin-top:2px;color:#ffd23f;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.dd-cardsel{display:flex;align-items:center;gap:6px;margin:8px 0 2px}
.dd-cardsel>span{font-weight:800;font-size:14px;opacity:.7;margin-right:2px;line-height:1}
.dd-cardsel button{flex:1;height:52px;border-radius:16px;background:#fff;color:var(--plum);box-shadow:inset 0 -3px 0 rgba(150,100,140,.18),0 0 0 2px #f0dfe9;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:1px}
.dd-cardsel button b{font-size:20px;display:flex;gap:2px;align-items:center}
.dd-cardsel button b i{display:inline-block;width:9px;height:12px;border-radius:2px;background:var(--c1);opacity:.85}
.dd-cardsel button small{font-size:11px;font-weight:800;opacity:.65;display:flex;align-items:center;gap:2px}
.dd-cardsel button small .dd-coin{width:12px;height:12px}.dd-cardsel button small .dd-coin:after{display:none}
.dd-cardsel button.sel{background:linear-gradient(180deg,var(--c2),var(--c1));color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c1) 60%,#000)}
.dd-cardsel button.poor{opacity:.45}
.dd-play{width:100%;height:68px;font-size:30px;border-radius:24px;margin-top:8px;line-height:1}
.dd-play small{display:block;font-size:14px;opacity:.9;margin-top:1px}
.dd-play.hard{background:linear-gradient(180deg,#ff7d7d,#e0384f);box-shadow:0 6px 0 #a5203a,0 10px 24px rgba(160,30,50,.35),inset 0 2px 0 rgba(255,255,255,.5)}
.dd-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;pointer-events:auto}
.dd-tile{height:62px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:2px;position:relative;font-size:13px}
.dd-tile .e{font-size:26px}
.dd-tile .n{position:absolute;right:-4px;top:-6px;background:#ff4f86;color:#fff;font-size:12px;border-radius:999px;padding:1px 6px;box-shadow:0 2px 0 #b02d63}
.dd-forfun{text-align:center;font-size:12px;font-weight:700;color:var(--plum);opacity:.6;pointer-events:auto;cursor:pointer;margin-top:-2px}
/* travel map */
.dd-map{position:relative;display:flex;justify-content:space-between;align-items:center;margin:0 0 6px;padding:2px 4px}
.dd-map:before{content:'';position:absolute;left:22px;right:22px;top:50%;border-top:3px dashed rgba(75,33,96,.18)}
.dd-map:after{content:'';position:absolute;left:22px;top:50%;width:var(--mp,0%);border-top:3px solid var(--c1);margin-top:-0px;transition:width .6s}
.dd-stop{position:relative;z-index:1;width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 0 0 2.5px #eadbe6,0 3px 0 rgba(120,60,120,.15);display:grid;place-items:center;padding:0;cursor:pointer}
.dd-stop img{width:34px;height:34px;object-fit:contain;border-radius:50%}
.dd-stop.lock img{filter:grayscale(1) brightness(1.15);opacity:.45}
.dd-stop.lock:after{content:'🔒';position:absolute;font-size:13px;right:-4px;bottom:-4px}
.dd-stop.done{box-shadow:0 0 0 2.5px var(--rc),0 3px 0 rgba(120,60,120,.15)}
.dd-stop.sel{transform:scale(1.22);box-shadow:0 0 0 3px var(--rc),0 0 0 6px rgba(255,255,255,.9),0 4px 10px rgba(120,60,120,.3)}
.dd-stop .pin{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:15px;animation:ddbob 1.4s ease-in-out infinite}
/* sheets */
.dd-sheetwrap{position:fixed;inset:0;z-index:60;background:rgba(60,25,70,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.dd-sheet{width:min(440px,100%);max-height:calc(100% - 20px);overflow:auto;background:linear-gradient(180deg,#fffaf3,#ffeede);border-radius:28px;padding:16px 16px 18px;color:var(--plum);box-shadow:0 18px 50px rgba(60,20,70,.4),0 5px 0 #e6b9c9;position:relative;animation:ddsheet .32s cubic-bezier(.3,1.5,.5,1)}
@keyframes ddsheet{from{transform:scale(.8);opacity:0}}
.dd-sheet h2{margin:0 0 4px;font-size:27px;text-align:center;line-height:1.1}
.dd-sheet .sub{text-align:center;font-weight:700;font-size:14px;opacity:.65;margin:0 0 10px}
.dd-sheet .x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;background:#f3dce6;color:var(--plum);font-size:20px}
.dd-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.dd-tabs button{flex:none;width:58px;height:66px;border-radius:16px;background:#fff;box-shadow:inset 0 -3px 0 rgba(150,100,140,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--plum);font-size:11px;line-height:1}
.dd-tabs button img{width:44px;height:44px;object-fit:contain}
.dd-tabs button.sel{box-shadow:0 0 0 3px var(--c1)}
.dd-tabs button.lock img{filter:grayscale(1) brightness(1.2);opacity:.5}
.dd-album{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px 4px}
.dd-stamp{position:relative;aspect-ratio:1/1.12;padding:7px;background:#fff;
  -webkit-mask:linear-gradient(#000 0 0) content-box,radial-gradient(circle 4.5px at 6px 6px,#0000 96%,#000) -6px -6px/12px 12px round;mask:linear-gradient(#000 0 0) content-box,radial-gradient(circle 4.5px at 6px 6px,#0000 96%,#000) -6px -6px/12px 12px round;filter:drop-shadow(0 3px 4px rgba(80,30,60,.25))}
.dd-stamp .in{width:100%;height:100%;border-radius:3px;background:linear-gradient(180deg,color-mix(in srgb,var(--c2) 30%,#fff),color-mix(in srgb,var(--c1) 22%,#fff));display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.dd-stamp img{width:78%;height:66%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
.dd-stamp .nm{font-size:12px;font-weight:800;line-height:1;margin-top:2px;white-space:nowrap}
.dd-stamp .ct{position:absolute;right:4px;top:3px;font-size:11px;font-weight:800;background:var(--c1);color:#fff;border-radius:999px;padding:0 5px}
.dd-stamp.miss img{filter:brightness(0) opacity(.13)}.dd-stamp.miss .nm{opacity:.35}
.dd-stamp.new{animation:ddstampin .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes ddstampin{from{transform:scale(1.6) rotate(-14deg);opacity:0}}
.dd-aprog{height:14px;border-radius:8px;background:#f1e2f3;overflow:hidden;margin:6px 4px}.dd-aprog i{display:block;height:100%;background:linear-gradient(90deg,var(--c2),var(--c1));border-radius:8px}
.dd-sheet p{font-size:15px;line-height:1.38;margin:6px 2px}
.dd-sheet table{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0}.dd-sheet td{padding:5px 6px;border-top:1px dashed rgba(75,33,96,.15)}.dd-sheet td:last-child{text-align:right;font-weight:800}
.dd-sheet .fine{font-size:12.5px;opacity:.7}
.dd-sheet .act{display:flex;gap:10px;margin-top:12px}.dd-sheet .act .dd-btn{flex:1;height:54px;font-size:20px;border-radius:18px}
/* title + result cards (kit cards, restyled) */
.dd-title{background:radial-gradient(ellipse at 50% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%)}
.dd-title h1{font-size:clamp(58px,17vw,96px)!important;color:#fff;text-shadow:0 5px 0 #c2305f,0 10px 22px rgba(140,30,80,.35)!important;letter-spacing:-1px;margin-top:-30px!important}
.dd-title h1 small{display:block;width:max-content;margin:6px auto 0;font-size:.42em;letter-spacing:5px;background:linear-gradient(180deg,#ffe066,#ff9f1c);color:#6b3500;padding:4px 20px 2px;border-radius:999px;text-shadow:0 1px 0 rgba(255,255,255,.6);box-shadow:0 5px 0 #c77a0a,0 8px 18px rgba(170,90,0,.3);transform:rotate(-3deg)}
.dd-title p{color:var(--plum);text-shadow:none!important}
.dd-title .hint{margin-bottom:9vh!important;color:#fff;font-size:26px!important;font-weight:800;background:linear-gradient(180deg,#86e860,#3dae3a);padding:8px 44px 10px;border-radius:26px;box-shadow:0 6px 0 #2a7d2a,0 10px 24px rgba(40,90,30,.3),inset 0 2px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(20,80,20,.45)!important}
.dd-title .forfun{margin-top:10px;font-size:14px;font-weight:800;color:var(--plum);background:rgba(255,255,255,.75);padding:2px 12px;border-radius:999px}
.dd-rescard{z-index:50!important;background:rgba(60,25,70,.5)!important;padding-top:calc(90px + env(safe-area-inset-top))!important}
.dd-rescard h1{margin-bottom:34px!important;font-size:clamp(52px,16vw,84px)!important;color:#fff;text-shadow:0 5px 0 #c2305f,0 10px 22px rgba(80,20,60,.4)!important}
.dd-rescard>p:first-child{font-size:16px!important;letter-spacing:2px;opacity:.9}
.dd-res{width:min(360px,92vw);background:linear-gradient(180deg,#fffaf3,#ffeede);border-radius:26px;padding:12px 14px 14px;color:var(--plum);box-shadow:0 14px 40px rgba(60,20,70,.4),0 5px 0 #e6b9c9;display:flex;flex-direction:column;align-items:center;gap:8px;animation:ddsheet .4s cubic-bezier(.3,1.5,.5,1)}
.dd-res .stars{display:flex;gap:6px;font-size:46px;line-height:1;margin-top:-34px}
.dd-res .stars i{font-style:normal;filter:grayscale(1) opacity(.35);transform:scale(.6);transition:all .4s cubic-bezier(.3,1.8,.5,1)}
.dd-res .stars i.on{filter:drop-shadow(0 3px 0 rgba(150,80,0,.4));transform:scale(1)}
.dd-res .stars i:nth-child(2){font-size:58px;margin-top:-10px}
.dd-stats{display:flex;gap:8px;width:100%}
.dd-stats div{flex:1;background:#fff;border-radius:16px;padding:5px 4px;text-align:center;line-height:1.05;box-shadow:inset 0 -3px 0 rgba(200,140,170,.25)}
.dd-stats b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:24px}.dd-stats small{font-size:11px;font-weight:800;opacity:.6;letter-spacing:.5px}
.dd-stats .dd-coin{width:22px;height:22px}.dd-stats .dd-coin:after{inset:4px}
.dd-got{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dd-got img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;padding:2px;box-shadow:0 2px 0 rgba(150,100,140,.25)}
.dd-res .dd-btn{height:52px;font-size:19px;border-radius:18px;padding:0 18px;width:100%}
.dd-res .line{font-size:15px;font-weight:700;text-align:center;opacity:.8}
.dd-rescard .hint{color:#fff}
.dd-rescard .hc-btn{display:none}
/* loading */
#dd-load{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(180deg,#ffd3df,#fff1df);transition:opacity .5s;font-family:'Baloo 2',system-ui,sans-serif;color:#c2305f}
#dd-load h2{margin:0;font-size:42px;font-weight:800;color:#fff;text-shadow:0 4px 0 #c2305f}
#dd-load .bar{width:200px;height:14px;border-radius:8px;background:rgba(255,255,255,.7);overflow:hidden}#dd-load .bar b{display:block;height:100%;width:4%;background:linear-gradient(90deg,#ff8fb1,#ffc93c);transition:width .3s}
#dd-load .balls{display:flex;gap:8px}#dd-load .balls i{width:22px;height:22px;border-radius:50%;animation:ddhop .9s ease-in-out infinite}
@keyframes ddhop{50%{transform:translateY(-14px)}}
/* desktop */
@media (min-aspect-ratio: 1/1){
  #dd-lobby{left:auto;right:4vw;transform:none;bottom:auto;top:50%;transform:translateY(-46%);width:400px}
  #dd-bot{left:42%;right:0}
  #dd-strip{left:calc(42% + 10px);right:14px}
}
</style>
</head>
<body>
<div id="dd-load"><h2>Daubdeck</h2><div class="balls"><i style="background:#2f7bff"></i><i style="background:#ff3d5a;animation-delay:.1s"></i><i style="background:#e9e6f0;animation-delay:.2s"></i><i style="background:#2fbf5b;animation-delay:.3s"></i><i style="background:#ffb21f;animation-delay:.4s"></i></div><div class="bar"><b></b></div></div>
<script type="module" src="./game.js"></script>
</body>
</html>
