<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<script src="/arcade/save.js" defer data-ap-save></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="data:,">
<title>Pocket Pom: Cozy Pet Café</title>
<meta name="description" content="Run a tiny kawaii pet café: adopt cute pets, feed, play and groom them, serve boba and treats to chibi customers and decorate your café. Free, cozy, no stress.">
<meta property="og:title" content="Pocket Pom: Cozy Pet Café">
<meta property="og:description" content="Adopt kawaii pets, care for them, serve boba to chibi customers and decorate your dreamy pet café. Pets never get sick, nothing is ever lost.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
:root{--pink:#ff5fa2;--pink2:#ff8cc6;--lilac:#a77cff;--lilac2:#c9adff;--mint:#5fdcb6;--butter:#ffd54f;--ink:#6b3fa0;--glass:rgba(255,255,255,.62)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:#e9c3f2}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.ol{color:#fff;text-shadow:0 2px 0 #b8457f,1px 0 0 #b8457f,-1px 0 0 #b8457f,0 -1px 0 #b8457f,0 3px 6px rgba(120,40,110,.35)}
.olp{color:#fff;text-shadow:0 2px 0 #6a3fb8,1px 0 0 #6a3fb8,-1px 0 0 #6a3fb8,0 -1px 0 #6a3fb8,0 3px 6px rgba(70,30,120,.35)}
/* jelly button */
.jb{position:relative;border:3px solid #fff;border-radius:999px;padding:10px 26px;font-weight:800;font-size:22px;color:#fff;background:linear-gradient(180deg,#ff9ad0 0%,#ff5fa2 55%,#f2448f 100%);box-shadow:0 5px 0 #c93680,0 10px 22px rgba(201,54,128,.35),inset 0 -4px 8px rgba(180,30,110,.25);text-shadow:0 2px 0 #c2397a;overflow:hidden;transition:transform .08s}
.jb::before{content:'';position:absolute;left:12%;right:12%;top:4px;height:38%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.1));pointer-events:none}
.jb:active{transform:translateY(3px) scale(.98);box-shadow:0 2px 0 #c93680,0 6px 14px rgba(201,54,128,.3)}
.jb.mint{background:linear-gradient(180deg,#8ff5d6,#3fd1a6 60%,#2fbf95);box-shadow:0 5px 0 #23977a,0 10px 22px rgba(35,151,122,.35);text-shadow:0 2px 0 #23977a}
.jb.lilac{background:linear-gradient(180deg,#d6bfff,#a77cff 60%,#9466f2);box-shadow:0 5px 0 #7a4fd6,0 10px 22px rgba(122,79,214,.35);text-shadow:0 2px 0 #6a3fb8}
.jb.butter{background:linear-gradient(180deg,#fff0a6,#ffd54f 60%,#ffc22e);box-shadow:0 5px 0 #e09a10,0 10px 22px rgba(224,154,16,.35);color:#8a4b00;text-shadow:0 1px 0 #fff3c4}
.jb:disabled{filter:grayscale(.6) brightness(1.05);opacity:.8}
.jb small{display:block;font-size:13px;font-weight:700;line-height:1;opacity:.95;margin-top:-2px}
/* HUD */
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:62px;right:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;z-index:20;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:4px;height:42px;padding:0 6px 0 4px;border-radius:999px;background:linear-gradient(180deg,rgba(130,80,210,.82),rgba(160,100,230,.78));border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(106,63,184,.45),0 8px 16px rgba(80,40,140,.25);font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(70,30,120,.5)}
.pill img{width:40px;height:40px;margin:-6px -2px -6px -8px;filter:drop-shadow(0 2px 2px rgba(80,30,100,.35))}
.pill b{min-width:34px;text-align:center}
.pill .plus{width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:linear-gradient(#7ff0c8,#2fc596);color:#fff;font-weight:800;font-size:20px;line-height:22px;padding:0;box-shadow:0 2px 0 #1f8f6c}
#badge{pointer-events:auto;position:relative;min-width:96px;height:62px;margin-top:-4px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:30px;background:radial-gradient(circle at 50% 30%,#ffd6ec,#ff8cc6 55%,#ff5fa2);border:3px solid #fff;box-shadow:0 5px 0 #c93680,0 10px 22px rgba(201,54,128,.35);padding:0 14px}
#badge::before{content:'';position:absolute;left:14%;right:14%;top:4px;height:30%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.8),rgba(255,255,255,0))}
#badge small{font-size:13px;font-weight:800;letter-spacing:1px;line-height:1;margin-top:2px}
#badge b{font-size:30px;line-height:.9;font-weight:800}
#badge .spark{position:absolute;right:-10px;top:-8px;font-size:20px;animation:tw 1.6s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.3) rotate(20deg);opacity:.7}}
#shiftbar{position:fixed;top:calc(74px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:19;pointer-events:none}
#shiftbar .pill{height:38px;font-size:19px;padding:0 12px 0 8px}
#shiftbar .pill span{font-size:20px}
#clockP.low{background:linear-gradient(180deg,rgba(255,110,170,.9),rgba(255,80,150,.85));animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#goalbar{width:70px;height:10px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden;border:1px solid rgba(255,255,255,.6)}
#goalbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd54f,#ff8cc6);border-radius:6px;transition:width .3s}
/* side buttons */
#side{position:fixed;right:10px;top:calc(124px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px;z-index:18}
.sb{position:relative;width:58px;height:58px;border-radius:20px;border:3px solid #fff;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(240,220,255,.85));box-shadow:0 4px 0 rgba(150,100,220,.55),0 8px 16px rgba(100,50,160,.22);padding:0;display:grid;place-items:center}
.sb img{width:50px;height:50px;filter:drop-shadow(0 2px 2px rgba(80,30,100,.3))}
.sb span{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:#fff;background:var(--lilac);border:2px solid #fff;border-radius:999px;padding:0 6px;line-height:15px;white-space:nowrap}
.sb .dot{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ff4f9e;border:2px solid #fff;font-size:11px;color:#fff;font-weight:800;line-height:16px}
.sb.emo{font-size:28px}
/* bottom: tray, free bar, care panel */
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;z-index:18;pointer-events:none}
.panel{pointer-events:auto;width:min(100%,520px);border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(245,228,255,.7));border:3px solid rgba(255,255,255,.95);box-shadow:0 8px 0 rgba(167,124,255,.45),0 16px 34px rgba(110,60,170,.28),inset 0 2px 12px rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#tray{display:flex;gap:7px;justify-content:center;padding:10px 10px 12px}
.ti{position:relative;flex:1 1 0;max-width:76px;aspect-ratio:1/1.08;border-radius:20px;border:3px solid #fff;background:linear-gradient(180deg,#fff,#ffe6f4);box-shadow:0 4px 0 #f0a8cf,0 6px 12px rgba(200,90,160,.2);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ti img{width:92%;height:auto;margin-top:-6px;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(150,60,130,.25))}
.ti i{position:absolute;bottom:2px;font-style:normal;font-size:11px;font-weight:800;color:#c2397a;line-height:1}
.ti.want{background:linear-gradient(180deg,#fff,#fff2b3);box-shadow:0 4px 0 #f2c94c,0 0 0 3px #ffe07a,0 6px 16px rgba(255,190,40,.45);animation:want 1s ease-in-out infinite}
@keyframes want{50%{transform:translateY(-3px)}}
.ti.locked{opacity:.45;filter:grayscale(.7)}
.ti:active{transform:scale(.92)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
#free{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 14px 14px}
#free .line{font-weight:700;font-size:15px;color:#7a4fb8;text-align:center;line-height:1.15}
#openB{width:100%;font-size:26px;padding:10px 20px 12px}
#care{padding:10px 12px 12px}
.care-h{display:flex;align-items:center;gap:10px}
.care-h img{width:54px;height:54px;border-radius:16px;background:#fff;border:3px solid #fff;box-shadow:0 3px 0 #e2c6ff}
.care-h .nm{flex:1;min-width:0}
.care-h .nm b{display:block;font-size:22px;line-height:1;color:#ff4f9e}
.care-h .nm small{font-weight:700;color:#8a63c9;font-size:13px}
.fr{display:flex;align-items:center;gap:6px;margin-top:2px}
.fr .bar{flex:1;height:12px;border-radius:8px;background:#f1e4ff;overflow:hidden;border:2px solid #fff}
.fr .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9ad0,#ff5fa2);border-radius:8px;transition:width .3s}
.fr em{font-style:normal;font-weight:800;font-size:13px;color:#ff4f9e;white-space:nowrap}
.xbtn{width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:linear-gradient(#d6bfff,#a77cff);color:#fff;font-weight:800;font-size:20px;padding:0;box-shadow:0 3px 0 #7a4fd6;flex:none}
.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.need{border-radius:20px;border:3px solid #fff;background:#fff;box-shadow:0 4px 0 #e7cdfb;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:16px;color:#7a4fb8;position:relative}
.need .ic{font-size:30px;line-height:1.1}
.need .nb{width:100%;height:10px;border-radius:6px;background:#f1e4ff;overflow:hidden}
.need .nb i{display:block;height:100%;border-radius:6px;transition:width .25s}
.need.on{background:linear-gradient(180deg,#fff,#ffe6f4);box-shadow:0 4px 0 #ff9ad0,0 0 0 3px #ff9ad0}
.need.low::after{content:'!';position:absolute;top:-8px;right:-4px;width:22px;height:22px;border-radius:50%;background:#ff4f9e;color:#fff;font-size:14px;line-height:19px;text-align:center;border:2px solid #fff}
#careTool{display:flex;gap:8px;margin-top:10px;justify-content:center;min-height:66px;align-items:center}
.treat{width:68px;height:68px;border-radius:20px;border:3px solid #fff;background:linear-gradient(#fff,#fff0f8);box-shadow:0 4px 0 #f0a8cf;padding:0;position:relative}
.treat img{width:92%;margin-top:-4px;pointer-events:none}
.treat i{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-style:normal;font-size:12px;font-weight:800;color:#fff;background:#ff7fb6;border:2px solid #fff;border-radius:999px;padding:0 6px;line-height:15px;white-space:nowrap}
.ci,.treat i img.ci,.cardi img.ci{width:16px;height:16px;vertical-align:-3px;margin:0 2px 0 0}
.cardi .jb img.ci{width:20px;height:20px;vertical-align:-4px}
.jb .ci{width:20px;height:20px;vertical-align:-4px}
.careHint{font-weight:800;color:#a77cff;font-size:17px;text-align:center}
/* world-anchored bubbles */
#bub{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.ob{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform}
.ob .in{position:relative;display:flex;gap:2px;padding:5px 7px 4px;border-radius:22px;background:#fff;border:3px solid #fff;box-shadow:0 4px 0 rgba(200,120,190,.45),0 6px 14px rgba(120,60,140,.25);transform:translate(-50%,-100%)}
.ob .in::after{content:'';position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top:10px solid #fff;border-bottom:0}
.ob img{width:46px;height:46px}
.ob img.ok{filter:grayscale(1) opacity(.35)}
.ob .pat{position:absolute;left:8px;right:8px;bottom:-4px;height:7px;border-radius:5px;background:#f1e4ff;overflow:hidden;border:1.5px solid #fff}
.ob .pat i{display:block;height:100%;border-radius:5px;background:#5fdcb6}
.ob .vip{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;color:#8a4b00;background:linear-gradient(#fff0a6,#ffd54f);border:2px solid #fff;border-radius:999px;padding:0 7px;white-space:nowrap;box-shadow:0 2px 0 #e09a10}
.th{position:absolute;left:0;top:0;font-size:22px}
.th .in{transform:translate(-50%,-100%);background:rgba(255,255,255,.92);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(200,120,190,.4);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{margin-top:-5px}}
.say{position:absolute;left:0;top:0}
.say .in{transform:translate(-50%,-100%) rotate(-6deg);font-weight:800;font-size:26px;color:#ff4f9e;background:#fff;border:3px solid #ffd1e6;border-radius:24px;padding:0 14px;white-space:nowrap;box-shadow:0 4px 0 rgba(255,150,200,.5);animation:sayin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes sayin{from{transform:translate(-50%,-100%) scale(.2) rotate(-20deg)}}
.flt{position:fixed;z-index:30;pointer-events:none;font-weight:800;font-size:24px;white-space:nowrap;transform:translate(-50%,-50%);animation:flt 1s ease-out forwards}
@keyframes flt{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.fcoin{position:fixed;z-index:31;width:34px;height:34px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.6,1),opacity .7s}
/* sheets */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(90,40,140,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#sheet .sh{width:min(100%,560px);max-height:86vh;display:flex;flex-direction:column;border-radius:34px 34px 0 0;background:linear-gradient(180deg,#fff7fc,#f3e6ff);border:3px solid #fff;border-bottom:0;box-shadow:0 -10px 40px rgba(90,40,140,.3);animation:up .35s cubic-bezier(.2,1.3,.4,1);padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(60%)}}
.sh h2{margin:0;font-size:30px;line-height:1.1;text-align:center}
.sh .sub{text-align:center;font-weight:700;color:#8a63c9;font-size:15px;margin:2px 0 8px}
.sh .top{display:flex;align-items:center;justify-content:space-between}
.grid{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:6px 2px 8px}
.cardi{position:relative;border-radius:22px;background:#fff;border:3px solid #fff;box-shadow:0 4px 0 #e7cdfb,0 6px 14px rgba(150,90,200,.15);padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cardi img{width:84px;height:84px}
.cardi b{font-size:16px;line-height:1.05;color:#6b3fa0}
.cardi small{font-size:12px;font-weight:700;color:#9a7cc9;line-height:1.1}
.cardi .jb{font-size:15px;padding:3px 12px;margin-top:5px;border-width:2px}
.cardi.lock img{filter:grayscale(1) brightness(1.25) opacity(.5)}
.cardi.own{background:linear-gradient(#fff,#e9fff7)}
.st{position:relative;border-radius:18px;background:#fff;border:3px dashed #e2c6ff;aspect-ratio:1/1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.st img{width:78%;filter:drop-shadow(0 0 0 #fff) drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 3px 4px rgba(120,60,160,.35))}
.st.got{border:3px solid #fff;background:linear-gradient(160deg,#fff,#ffeaf6);box-shadow:0 4px 0 #ffc2e0}
.st:not(.got) img{filter:brightness(0) opacity(.12)}
.st small{font-size:11px;font-weight:800;color:#a07cd0;line-height:1.05;text-align:center}
.st .bd{position:absolute;top:-6px;right:-6px;font-size:18px}
.st.new::after{content:'NEW';position:absolute;top:-8px;left:-6px;font-size:10px;font-weight:800;color:#fff;background:#ff4f9e;border-radius:999px;padding:0 5px;border:2px solid #fff}
.album-h{font-weight:800;font-size:18px;color:#ff4f9e;margin:8px 4px 0}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:6px 2px}
.prog{height:14px;border-radius:8px;background:#f1e4ff;overflow:hidden;border:2px solid #fff;margin:0 10px 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffd54f,#ff8cc6,#a77cff)}
/* cards */
#card{position:fixed;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(110px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 40%,rgba(255,220,240,.55),rgba(150,90,210,.45));text-align:center}
#card .cbox{width:min(100%,380px);border-radius:36px;background:linear-gradient(180deg,#fff,#fdeefa);border:4px solid #fff;box-shadow:0 8px 0 #e6a6d8,0 20px 50px rgba(110,50,160,.35);padding:22px 18px 18px;position:relative;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
#card h1{margin:0;font-size:44px;line-height:1;font-weight:800}
#card .stars{font-size:46px;letter-spacing:2px;margin:6px 0 2px}
#card .stars span{display:inline-block;animation:starIn .5s cubic-bezier(.2,1.8,.4,1) both;filter:drop-shadow(0 3px 0 #e0a010)}
#card .stars span.off{filter:grayscale(1) opacity(.3)}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
#card p{margin:4px 0;font-size:18px;font-weight:700;color:#8a63c9}
#card .rw{display:flex;justify-content:center;gap:12px;font-size:24px;font-weight:800;color:#ff4f9e;margin:4px 0}
#card .rw img{width:34px;vertical-align:middle;margin-top:-4px}
#card .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:auto;width:min(100%,360px)}
#card .btns .jb{width:100%}
#card .hint{font-weight:800;color:#fff;font-size:18px;text-shadow:0 2px 0 rgba(120,50,150,.5);animation:pulse 1.2s ease-in-out infinite}
#card .hero{width:150px;height:150px;margin:-90px auto -6px;display:block;filter:drop-shadow(0 6px 6px rgba(120,60,140,.3))}
#card .logo{font-size:64px;line-height:.85;font-weight:800;margin:0}
#card .logo span{display:block;font-size:24px;letter-spacing:2px;color:#a77cff;text-shadow:none;margin-top:4px}
.grid2{display:flex;justify-content:center;gap:4px;font-size:22px;flex-wrap:wrap;margin:4px 0}
/* toast */
#toast{position:fixed;left:50%;top:calc(126px + env(safe-area-inset-top));transform:translateX(-50%);z-index:45;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.tst{background:linear-gradient(180deg,#fff,#ffeaf6);border:3px solid #fff;border-radius:999px;padding:3px 14px;font-weight:800;font-size:15px;color:#ff4f9e;box-shadow:0 4px 0 #ffb3d6,0 8px 18px rgba(150,60,140,.25);animation:tst 2.4s ease forwards;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tst img{width:30px;height:30px;margin:-6px 0}
@keyframes tst{0%{opacity:0;transform:translateY(-12px) scale(.8)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#hand{position:fixed;z-index:25;font-size:46px;pointer-events:none;transform:translate(-30%,0);animation:tap 1s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
@keyframes tap{50%{margin-top:12px;transform:translate(-30%,0) scale(.9)}}
#load{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(180deg,#c3a2f4,#f6bde3 55%,#ffd3e6);transition:opacity .5s}
#load.gone{opacity:0;pointer-events:none}
#load h1{margin:0;font-size:58px;line-height:.9;font-weight:800}
#load .lb{width:200px;height:16px;border-radius:10px;background:rgba(255,255,255,.55);border:3px solid #fff;overflow:hidden}
#load .lb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8cc6,#ff5fa2);transition:width .2s}
#load .paw{font-size:40px;animation:bob 1s ease-in-out infinite}
@media (min-width:700px) and (min-aspect-ratio:1/1){
  #side{top:auto;bottom:24px;right:20px}
  #bottom{padding-bottom:18px}
}
