<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<script src="/arcade/save.js" defer data-ap-save></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Slip Links</title>
<meta name="theme-color" content="#9ee8f5">
<link rel="icon" href="data:,">
<style>
  .finger{position:fixed;font-size:46px;z-index:7;pointer-events:none;transform:translate(-30%,-10%);transition:left .18s ease-out,top .18s ease-out,opacity .2s;opacity:0;filter:drop-shadow(0 4px 2px rgba(0,0,0,.2))}
  .finger.tap{animation:ftap .22s ease-in-out}
  @keyframes ftap{50%{transform:translate(-30%,-10%) scale(.82)}}
  .strikes{position:fixed;top:calc(56px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5;pointer-events:none}
  .strikes i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 3px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:15px;color:#fff;transition:transform .25s cubic-bezier(.3,1.8,.5,1),background .2s}
  .strikes i.x{background:#ff4d5e;transform:scale(1.25)}
  .hc-card p{white-space:pre-line}
  #tags{position:fixed;inset:0;pointer-events:none;z-index:4}
  .tag{position:absolute;left:0;top:0;font:800 15px/1 'Baloo 2',system-ui,sans-serif;background:rgba(255,255,255,.92);border-radius:12px;padding:3px 7px;box-shadow:0 3px 0 rgba(0,0,0,.15);color:#333;white-space:nowrap}
  .tag.lock{background:#2b2f45;color:#fff}.tag.gold{background:#ffc61a;color:#7a4b00}.tag.spark{background:#fff0e0;color:#d94a00}
  .tag.spark.lit{background:#ff5a1a;color:#fff;animation:tp .5s infinite alternate}
  @keyframes tp{to{transform:scale(1.15)}}
  #hud2{position:fixed;top:calc(64px + env(safe-area-inset-top));left:8px;z-index:25;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  #hud2 button{width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.9);font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  #chip{position:relative;height:30px;min-width:96px;border-radius:15px;background:rgba(255,255,255,.88);overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.12);font:800 13px/30px 'Baloo 2',sans-serif;text-align:center;color:#333}
  #chip i{position:absolute;left:0;top:0;bottom:0;background:#ffd35a;width:0;transition:width .5s}
  #chip span{position:relative;padding:0 10px}
  #map{position:fixed;inset:0;z-index:30;background:linear-gradient(#bfeaff,#fff);overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 14px 24px;font-family:'Baloo 2',system-ui,sans-serif}
  #map.hidden{display:none}
  #map button{font-family:inherit;border:0;cursor:pointer}
  .mp-top{padding-left:52px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:#333}
  .mp-bar{flex:1;height:16px;border-radius:8px;background:#fff;box-shadow:inset 0 2px 0 rgba(0,0,0,.1);overflow:hidden}
  .mp-bar i{display:block;height:100%;background:#ffc61a}
  .mp-top button{width:36px;height:36px;border-radius:50%;background:#fff;font-size:18px}
  .mp-tabs{display:flex;gap:8px;margin:14px 0}
  .mp-tabs button{flex:1;padding:10px 4px;border-radius:14px;background:#fff;font-weight:800;font-size:15px;color:#555}
  .mp-tabs button.on{background:#ff8c5a;color:#fff}
  .mp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .nd{aspect-ratio:1;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.14);color:#333}
  .nd b{font-size:22px;line-height:1}.nd u{text-decoration:none;font-size:11px;color:#f2a900;letter-spacing:-1px;margin-top:2px}
  .nd.lk{opacity:.45}.nd.boss{outline:3px solid #ff4d5e}
  .nd.cur{background:#ffe9a8;animation:cur 1s infinite alternate}
  @keyframes cur{to{transform:scale(1.1)}}
  .mp-paints{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px;justify-content:center}
  .pt{width:52px;height:34px;border-radius:12px;background:#fff;display:flex;gap:2px;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .pt s{width:11px;height:20px;border-radius:6px;display:block}.pt.on{outline:3px solid #ff8c5a}.pt.lk{opacity:.5}
  .mp-daily{width:100%;padding:14px;border-radius:16px;background:#7b6fe0;color:#fff;font-weight:800;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .mp-daily.lk{background:#c5c5d6}
</style>
</head>
<body>
<div class="strikes" id="strikes"><i></i><i></i><i></i></div>
<div class="finger" id="finger">👆</div>
<script type="module" src="game.js"></script>
</body>
</html>
