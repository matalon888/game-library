<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="data:,">
<title>Rosewick Garden: Grow &amp; Bloom</title>
<meta name="description" content="A gentle flower-growing garden game: plant seeds, water them, watch them bloom in minutes, and tie bouquets for the villagers of Rosewick.">
<meta property="og:title" content="Rosewick Garden: Grow &amp; Bloom">
<meta property="og:description" content="Plant, water and bloom twelve painted flowers, fill bouquet orders for storybook villagers, and design a walled garden of your own. Calm, untimed, free.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{--navy:#1F2D54;--navy2:#2c3d6b;--rose:#B04A5C;--rose2:#c9677a;--sage:#567854;--gold:#B08834;--gold2:#d9b45a;--ivory:#FAF6EC;--cream:#F4EEE0;--ink:#2a2a3a;--fs:1}
html.big{--fs:1.2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#e9e3cf;color:var(--navy);font-family:'Libre Baskerville',Baskerville,Georgia,serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.off{display:none!important}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud > *{pointer-events:auto}
#ribbon{position:absolute;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(250px,46vw);height:84px;background:url(assets/kit/ribbon-rose.webp) center/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:12px;color:var(--ivory);text-shadow:0 1px 2px rgba(80,20,30,.5);cursor:pointer;border:0;background-color:transparent}
#ribbon small{font-size:calc(12px*var(--fs));letter-spacing:.14em;text-transform:uppercase;opacity:.95}
#ribbon b{font-size:calc(19px*var(--fs));line-height:1.15;font-weight:700}
#xpbar{position:absolute;top:calc(84px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(170px,42vw);height:9px;border-radius:6px;background:rgba(250,246,236,.85);border:1px solid var(--gold);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15)}
#xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fb07c,var(--sage));transition:width .6s cubic-bezier(.3,1.3,.5,1)}
#coins{z-index:2;position:absolute;top:calc(14px + env(safe-area-inset-top));right:10px;height:46px;min-width:96px;display:flex;align-items:center;gap:6px;padding:0 8px 0 4px;border-radius:24px;background:var(--ivory);border:2px solid var(--gold2);box-shadow:0 3px 8px rgba(31,45,84,.22);cursor:pointer;font-size:calc(19px*var(--fs));font-weight:700;color:var(--navy)}
#coins img{width:36px;height:36px}
#coins .plus{width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--ivory);display:grid;place-items:center;font-size:18px;line-height:1;margin-left:auto}
#gear{position:absolute;top:calc(10px + env(safe-area-inset-top));left:58px;width:46px;height:46px;border:0;padding:0;background:url(assets/icons/settings.webp) center/contain no-repeat;cursor:pointer;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
#plantchip{position:absolute;left:50%;transform:translateX(-50%);top:calc(104px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;background:var(--navy);color:var(--ivory);border:2px solid var(--gold2);border-radius:28px;padding:4px 6px 4px 6px;font-size:calc(17px*var(--fs));box-shadow:0 4px 10px rgba(0,0,0,.25);white-space:nowrap}
#plantchip img{width:34px;height:34px;object-fit:contain}
#plantchip button{border:0;background:var(--ivory);color:var(--navy);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
/* ---------- order board ---------- */
#board{position:absolute;display:flex;gap:8px}
.ord{position:relative;flex:1;min-width:0;border-radius:14px;background:url(assets/kit/paper.webp) center/220px;border:2px solid var(--gold2);box-shadow:0 4px 10px rgba(31,45,84,.22),inset 0 0 0 3px rgba(255,255,255,.55);padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.ord:active{transform:scale(.96)}
.ord .who{width:62px;height:50px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));margin-top:-2px}
.ord .needs{display:flex;flex-direction:column;gap:1px;width:100%;align-items:center}
.ord .nd{display:flex;align-items:center;gap:2px;font-size:calc(19px*var(--fs));font-weight:700;color:var(--navy);line-height:1}
.ord .nd img{width:34px;height:36px;object-fit:contain}
.ord .nd.ok{color:var(--sage)}
.ord .nd.ok::after{content:'✓';font-size:16px;margin-left:2px}
.ord .rw{display:flex;align-items:center;gap:3px;font-size:calc(17px*var(--fs));font-weight:700;color:#7a5a1c;margin-top:auto}
.ord .rw img{width:22px;height:22px}
.ord .tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ivory);background:var(--rose);border:1px solid var(--gold2);border-radius:10px;padding:2px 8px}
.ord .tag.gold{background:linear-gradient(#d9b45a,#a87d2c)}
.ord.ready{border-color:var(--sage);box-shadow:0 0 0 3px rgba(143,176,124,.85),0 6px 16px rgba(31,45,84,.28);animation:rdy 1.6s ease-in-out infinite}
.ord.ready .rw{display:none}
.ord .go{display:none;margin-top:auto;background:var(--sage);color:var(--ivory);border-radius:18px;padding:5px 10px;font-size:calc(16px*var(--fs));font-weight:700;border:1px solid #3e5a3c}
.ord.ready .go{display:block}
.ord.enter{animation:ent .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes rdy{50%{transform:translateY(-3px)}}
@keyframes ent{from{transform:translateY(40px) scale(.7);opacity:0}}
#basket{position:absolute;width:64px;height:58px;cursor:pointer;border:0;padding:0;background:url(assets/items/trug.webp) center/contain no-repeat;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
#basket b{position:absolute;right:-4px;top:-6px;min-width:28px;height:28px;border-radius:14px;background:var(--rose);color:var(--ivory);font-size:15px;display:grid;place-items:center;border:2px solid var(--ivory);padding:0 5px}
/* ---------- toolbar ---------- */
#tools{position:absolute;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px}
.tb{position:relative;width:66px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.tb img{width:56px;height:56px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28));transition:transform .2s}
.tb:active img{transform:scale(.9)}
.tb span{font-size:calc(14px*var(--fs));font-weight:700;color:var(--navy);background:rgba(250,246,236,.92);border-radius:8px;padding:1px 6px;white-space:nowrap;border:1px solid rgba(176,136,52,.5)}
.tb .badge{position:absolute;top:-4px;right:2px;min-width:22px;height:22px;border-radius:11px;background:var(--rose);color:var(--ivory);font-size:13px;display:grid;place-items:center;border:2px solid var(--ivory);padding:0 4px}
.tb.wait img{filter:grayscale(.8) brightness(1.1) drop-shadow(0 3px 4px rgba(0,0,0,.2));opacity:.75}
/* ---------- sheets ---------- */
#veil{position:fixed;inset:0;background:rgba(31,45,84,.35);z-index:20;opacity:0;transition:opacity .25s;pointer-events:none}
#veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);max-height:86%;z-index:21;background:url(assets/kit/paper.webp) center/300px,var(--cream);border:3px solid var(--gold2);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:0 -10px 30px rgba(31,45,84,.3);padding:18px 16px calc(18px + env(safe-area-inset-bottom));transition:transform .35s cubic-bezier(.25,1.2,.4,1);display:flex;flex-direction:column;touch-action:pan-y}
.sheet.on{transform:translate(-50%,0)}
.sheet h2{margin:0 0 4px;text-align:center;font-size:calc(26px*var(--fs));color:var(--navy)}
.sheet .sub{text-align:center;font-size:calc(17px*var(--fs));color:#4a4f66;margin:0 0 10px;line-height:1.35}
.sheet .x{position:absolute;top:8px;right:10px;width:52px;height:52px;border:0;background:url(assets/icons/close.webp) center/44px no-repeat;cursor:pointer}
.sheet .body{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 2px 8px}
.sheet hr{border:0;height:22px;background:url(assets/kit/divider.webp) center/auto 100% no-repeat;margin:2px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pk{position:relative;border-radius:14px;background:var(--ivory);border:2px solid #d9c38f;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:56px;box-shadow:0 2px 6px rgba(31,45,84,.12)}
.pk img{width:92px;height:92px;object-fit:contain}
.pk b{font-size:calc(19px*var(--fs))}
.pk .meta{font-size:calc(16px*var(--fs));color:#4a4f66;display:flex;gap:10px;align-items:center}
.pk .meta img,.coin-i{width:20px;height:20px;vertical-align:-4px}
.pk .need{position:absolute;top:6px;left:6px;background:var(--sage);color:var(--ivory);font-size:13px;border-radius:9px;padding:2px 7px}
.pk.locked img{filter:grayscale(1) opacity(.45)}
.pk.locked{background:#efe8d6}
.pk .cta{margin-top:4px;background:var(--navy);color:var(--ivory);border-radius:16px;padding:6px 12px;font-size:calc(16px*var(--fs));border:1px solid var(--gold2)}
.pk .cta.dim{background:#9c9fae}
.pk.sel{border-color:var(--sage);box-shadow:0 0 0 3px rgba(143,176,124,.7)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:30px;border:2px solid var(--gold2);background:var(--navy);color:var(--ivory);font-size:calc(19px*var(--fs));font-weight:700;padding:8px 22px;cursor:pointer;box-shadow:0 4px 0 #0f1838,0 6px 14px rgba(0,0,0,.2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0f1838}
.btn.rose{background:var(--rose);box-shadow:0 4px 0 #7c2e3c,0 6px 14px rgba(0,0,0,.2)}
.btn.sage{background:var(--sage);box-shadow:0 4px 0 #34502f,0 6px 14px rgba(0,0,0,.2)}
.btn.light{background:var(--ivory);color:var(--navy);box-shadow:0 4px 0 #c9b98f,0 6px 14px rgba(0,0,0,.12)}
.btn img{width:34px;height:34px}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:6px 4px;border-bottom:1px solid rgba(176,136,52,.3);font-size:calc(19px*var(--fs))}
.tog button{width:76px;height:42px;border-radius:21px;border:2px solid var(--gold2);background:#d8d2c0;position:relative;cursor:pointer}
.tog button::after{content:'';position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:50%;background:var(--ivory);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.tog button[aria-pressed=true]{background:var(--sage)}
.tog button[aria-pressed=true]::after{left:37px}
/* album */
.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.alb .pg{background:var(--ivory);border:2px solid #d9c38f;border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;text-align:center;font-size:calc(15px*var(--fs));line-height:1.2;min-height:150px}
.alb .pg img{width:84px;height:96px;object-fit:contain}
.alb .pg.no img{filter:brightness(0) opacity(.18)}
.alb .pg.no{color:#9a9587}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.stamps img{width:100%;aspect-ratio:1.2;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
.stamps .no{filter:grayscale(1) opacity(.22)}
.tabs{display:flex;gap:6px;justify-content:center;margin:0 0 10px}
.tabs button{min-height:48px;border-radius:24px;border:2px solid var(--gold2);background:var(--ivory);padding:4px 16px;font-size:calc(17px*var(--fs));cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--navy);color:var(--ivory)}
/* ---------- cards (start, delivery, level up, visit) ---------- */
.card{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));text-align:center;background:radial-gradient(ellipse at center,rgba(250,246,236,.86) 0%,rgba(244,238,224,.78) 55%,rgba(31,45,84,.42) 100%);animation:fade .35s ease-out}
.card .frame{position:relative;max-height:calc(100% - 30px);overflow-y:auto;width:min(380px,100%);background:url(assets/kit/paper.webp) center/300px,var(--ivory);border:3px solid var(--gold2);border-radius:24px;padding:24px 18px 20px;box-shadow:0 18px 40px rgba(31,45,84,.35);display:flex;flex-direction:column;align-items:center;gap:8px}
.card .frame::before,.card .frame::after{content:'';position:absolute;width:84px;height:84px;background:url(assets/kit/corner-roses.webp) center/contain no-repeat;pointer-events:none}
.card .frame::before{top:-30px;left:-30px;transform:scaleX(-1)}
.card .frame::after{bottom:-26px;right:-24px;transform:rotate(180deg) scaleX(-1)}
.card h1{margin:0;font-size:calc(34px*var(--fs));line-height:1.1;color:var(--navy)}
.card p{margin:0;font-size:calc(19px*var(--fs));line-height:1.4;color:#3d4258}
.card .q{font-style:italic;color:var(--rose)}
.card .big{width:150px;height:min(160px,17vh);object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.card .gain{display:flex;gap:18px;font-size:calc(24px*var(--fs));font-weight:700;align-items:center;justify-content:center}
.card .gain img{width:34px;height:34px;vertical-align:-8px}
.card .tapon{font-size:calc(17px*var(--fs));color:#6b6f82;margin-top:4px}
#start{background:url(assets/bg/hub-s.webp) center/cover;}
#start .logo{position:relative;width:min(360px,92vw);padding:30px 10px 26px;background:url(assets/kit/cartouche.webp) center/100% 100% no-repeat}
#start .logo small{display:block;font-size:calc(14px*var(--fs));letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
#start .logo b{display:block;font-size:calc(46px*var(--fs));line-height:1;color:var(--navy);font-weight:700}
#start .logo i{display:block;font-size:calc(18px*var(--fs));color:var(--rose);margin-top:6px}
#start .streak{margin-top:10px;background:rgba(250,246,236,.92);border:2px solid var(--gold2);border-radius:20px;padding:6px 16px;font-size:calc(18px*var(--fs))}
#start .tapgo{margin-top:22px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes fade{from{opacity:0}}
#visit{position:fixed;inset:0;z-index:15;background:#dfe6cc}
#visit canvas{position:absolute;inset:0;width:100%;height:100%}
#visit .vbar{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;padding:0 12px}
#visit .vhead{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(250,246,236,.94);border:2px solid var(--gold2);border-radius:20px;padding:6px 16px 6px 8px;font-size:calc(19px*var(--fs));white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#visit .vhead img{width:56px;height:46px;object-fit:contain}
.toast{position:fixed;left:50%;top:calc(160px + env(safe-area-inset-top));transform:translateX(-50%);z-index:40;background:var(--navy);color:var(--ivory);border:2px solid var(--gold2);border-radius:20px;padding:10px 18px;font-size:calc(18px*var(--fs));box-shadow:0 6px 16px rgba(0,0,0,.25);animation:tst 2.6s ease-out forwards;pointer-events:none;max-width:90vw;text-align:center}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.fly{position:fixed;z-index:35;pointer-events:none;width:40px;height:40px;object-fit:contain;transition:transform .75s cubic-bezier(.5,-0.3,.6,1),opacity .2s .65s}
.float{position:fixed;z-index:34;pointer-events:none;font-weight:700;font-size:22px;color:var(--navy);text-shadow:0 0 4px #fff,0 0 8px #fff;animation:flt 1.1s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes flt{to{transform:translate(-50%,-160%);opacity:0}}
html.wide #board{flex-direction:column;gap:12px}
html.wide .ord{flex-direction:row;align-items:center;gap:10px;padding:10px 12px 10px 8px;flex:0 0 auto;min-height:130px}
html.wide .ord .who{width:76px;height:64px;margin:0}
html.wide .ord .needs{flex-direction:row;flex-wrap:wrap;flex:1;gap:4px 10px;justify-content:flex-start}
html.wide .ord .rw,html.wide .ord .go{margin:0}
html.wide .ord .tag{left:90px;transform:none}
html.wide #tools{flex-direction:column;left:12px;right:auto;bottom:auto;top:50%;transform:translateY(-50%);gap:8px}
html.calm *{animation-duration:.001s!important;transition-duration:.001s!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <button id="ribbon" aria-label="Garden level"><small>Rosewick</small><b>Level 1</b></button>
  <div id="xpbar"><i></i></div>
  <button id="gear" aria-label="Settings"></button>
  <button id="coins" aria-label="Coins and shop"><img src="assets/icons/coins.webp" alt=""><span>100</span><i class="plus">+</i></button>
  <div id="plantchip" class="off"><img alt=""><span></span><button aria-label="Stop planting">✕</button></div>
  <button id="basket" aria-label="Basket of flowers"><b>0</b></button>
  <div id="board"></div>
  <div id="tools">
    <button class="tb" data-t="album"><img src="assets/icons/album.webp" alt=""><span>Album</span></button>
    <button class="tb" data-t="decor"><img src="assets/icons/pencil.webp" alt=""><span>Decorate</span></button>
    <button class="tb" data-t="shower"><img src="assets/icons/video.webp" alt=""><span>Shower</span></button>
    <button class="tb" data-t="visit"><img src="assets/icons/home.webp" alt=""><span>Visit</span></button>
    <button class="tb" data-t="shop"><img src="assets/icons/shop.webp" alt=""><span>Shop</span></button>
  </div>
</div>
<div id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><button class="x" aria-label="Close"></button><h2></h2><p class="sub"></p><div class="body"></div></div>
<script type="module" src="game.js"></script>
</body>
</html>
