<!doctype html>
<html lang="en">
<head>
<script src="/arcade/save.js" defer data-ap-save></script>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Wobblewar: Battle Simulator</title>
<meta name="description" content="Place wobbly jelly knights, catapult frogs and snowball giants on your half of the field, press fight and watch the physics battle unfold. 30 puzzle battles plus a sandbox, free in your browser.">
<meta property="og:title" content="Wobblewar: Battle Simulator">
<meta property="og:description" content="Place your wobbly army within the budget, press fight, watch the cartoon physics battle. 30 puzzle battles and a sandbox.">
<meta name="theme-color" content="#bfe3ff">
<link rel="icon" href="data:,">
<style>
  :root{--blue:#3f86ff;--red:#ff4f68;--ink:#2c2f4a}
  .ww{font-family:'Baloo 2',system-ui,sans-serif}
  .ww-top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:60px;right:60px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:6;pointer-events:none}
  .ww-lvl{font-weight:800;font-size:13px;letter-spacing:.08em;background:rgba(44,47,74,.55);border-radius:12px;padding:1px 10px;color:#fff}
  .ww-name{font-weight:800;font-size:23px;line-height:1;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .ww-gold{display:flex;align-items:center;gap:6px;background:#fff;color:var(--ink);font-weight:800;font-size:19px;border-radius:20px;padding:2px 14px 2px 10px;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .15s}
  .ww-gold small{font-size:13px;opacity:.55;font-weight:700}
  .ww-gold.bad{animation:wwshake .35s}
  @keyframes wwshake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .ww-vs{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  .ww-vs i{display:block;width:92px;height:12px;border-radius:8px;background:rgba(255,255,255,.55);overflow:hidden;border:2px solid #fff}
  .ww-vs i b{display:block;height:100%;transition:width .2s}
  .ww-menu{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(18,16,30,.6);color:#fff;font-size:20px;z-index:7;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .ww-bot{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 0 calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .ww-row{display:flex;align-items:flex-end;justify-content:space-between;padding:0 10px;gap:8px}
  .ww-info{flex:1;min-width:0;background:rgba(255,255,255,.92);color:var(--ink);border-radius:14px;padding:4px 10px;font-size:13px;line-height:1.2;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .ww-info b{font-size:15px;font-weight:800}
  .ww-info span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ww-btn{pointer-events:auto;border:0;font:inherit;font-weight:800;color:#fff;cursor:pointer;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.2);white-space:nowrap}
  .ww-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .ww-fight{font-size:24px;padding:8px 20px;background:linear-gradient(#5fdc6e,#22b04a)}
  .ww-fight.off{filter:grayscale(.8);opacity:.7}
  .ww-sm{font-size:17px;padding:7px 12px;background:rgba(44,47,74,.75)}
  .ww-team{background:var(--blue)}.ww-team.red{background:var(--red)}
  .ww-bar{display:flex;gap:7px;overflow-x:auto;padding:4px 10px 6px;pointer-events:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .ww-bar::-webkit-scrollbar{display:none}
  .ww-card{flex:none;width:70px;height:88px;border-radius:16px;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;box-shadow:0 5px 0 rgba(0,0,0,.16);cursor:pointer;position:relative;border:3px solid transparent;transition:transform .12s}
  .ww-card .e{font-size:30px;line-height:1.15}
  .ww-card .n{font-size:11px;font-weight:800;line-height:1;text-align:center;padding:0 3px;height:22px;display:flex;align-items:center}
  .ww-card .c{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#ffd23f;color:#5a3d00;font-weight:800;font-size:13px;border-radius:10px;padding:0 7px;box-shadow:0 2px 0 rgba(0,0,0,.15);line-height:18px;white-space:nowrap}
  .ww-card.sel{border-color:var(--blue);transform:translateY(-6px)}
  .ww-card.redsel{border-color:var(--red)}
  .ww-card.poor{opacity:.55}
  .ww-card.lock{background:#dfe3ee;color:#8a8fa8;cursor:default}
  .ww-card.lock .e{filter:grayscale(1) opacity(.35)}
  .ww-card.lock .c{background:#b9bfd1;color:#fff}
  .ww-hide{display:none!important}
  .ww-ov{position:fixed;inset:0;z-index:30;background:rgba(24,26,48,.72);display:flex;flex-direction:column;align-items:center;padding:calc(20px + env(safe-area-inset-top)) 16px 20px;overflow-y:auto;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .ww-ov h2{margin:4px 0 10px;font-size:34px;font-weight:800;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.2)}
  .ww-modes{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
  .ww-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:100%;max-width:380px}
  .ww-tile{aspect-ratio:1;border-radius:16px;background:#fff;color:var(--ink);border:0;font:inherit;font-weight:800;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;line-height:1}
  .ww-tile small{font-size:11px;color:#ffb703;letter-spacing:-1px;margin-top:2px}
  .ww-tile.cur{background:#ffd23f}
  .ww-tile.lock{background:rgba(255,255,255,.25);color:rgba(255,255,255,.6);cursor:default}
  .ww-close{margin-top:16px}
  .ww-cardbtns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .ww-cardbtns .ww-btn{font-size:18px;padding:8px 16px;background:rgba(44,47,74,.7)}
  .ww-stars{font-size:34px;letter-spacing:4px;color:#ffd23f;text-shadow:0 3px 0 rgba(0,0,0,.2)}
  .ww-stars i{font-style:normal;color:rgba(255,255,255,.4)}
  body .hc-card h1{color:#fff}
  .ww-tip{position:fixed;left:50%;transform:translateX(-50%);top:calc(118px + env(safe-area-inset-top));z-index:6;background:rgba(44,47,74,.7);color:#fff;font-weight:700;font-size:15px;border-radius:14px;padding:4px 12px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
  @media (min-width:700px){ .ww-bar{justify-content:center} .ww-row{max-width:720px;margin:0 auto;width:100%} }
</style>
</head>
<body>
<script type="module" src="game.js"></script>
</body>
</html>
