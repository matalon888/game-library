<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<script src="/arcade/save.js" defer data-ap-save></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sticky Nook</title>
<meta name="theme-color" content="#fff4e4">
<link rel="icon" href="data:,">
<style>
  body{background:#fff4e4!important}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hc-score,.hc-sub{display:none}
  body .hc-lvl{background:#f0a35e;color:#fff}
  body .hc-lvl.next{background:#fff;color:#f0a35e}
  body .hc-bar{background:#f7e3cc}
  body .hc-bar i{background:#f0a35e}
  body .hc-card h1{color:#fff;text-shadow:0 5px 0 #e08a4a,0 9px 20px rgba(160,90,40,.25)}
  body .hc-card p,body .hc-card .hint{color:#9a5b2c;text-shadow:0 2px 0 #fff}
  body .hc-card.dim{background:rgba(120,70,30,.25)}
  body .hc-card.dim p,body .hc-card.dim .hint{color:#fff;text-shadow:0 2px 0 rgba(120,60,20,.5)}
  body .hc-pop{color:#fff;-webkit-text-stroke:2px #d9783a;paint-order:stroke fill}
  .sn-hearts{position:fixed;right:12px;top:calc(56px + env(safe-area-inset-top));font-size:20px;z-index:5;pointer-events:none;letter-spacing:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="game.js"></script>
</body>
</html>
