<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<script src="/arcade/save.js" defer data-ap-save></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bloomhaus: Match &amp; Decorate</title>
<meta name="description" content="Match glossy gems to earn stars, then spend them to restore a dusty old house room by room into a cozy dream home.">
<meta property="og:title" content="Bloomhaus: Match & Decorate">
<meta property="og:description" content="A free match-3 puzzle with a home makeover: clear levels, earn stars, and decorate the living room, bedroom, garden and kitchen.">
<meta name="theme-color" content="#f7c8d8">
<link rel="icon" href="data:,">
<style>
:root{--pink:#ff5d8f;--plum:#5b2f7a;--gold:#ffc93c;--green1:#7be05a;--green2:#3fae3a;--cream:#fff8ee}
body{background:linear-gradient(180deg,#f9d3e2,#ffe9cf)}
.hc-score,.hc-top{display:none!important}
.bh{font-family:'Baloo 2',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.bh-hidden{display:none!important}
.bh-btn{pointer-events:auto;font:inherit;font-weight:800;border:0;cursor:pointer;color:#fff;border-radius:22px;touch-action:manipulation;transition:transform .08s}
.bh-btn:active{transform:translateY(3px) scale(.98)}
.bh-green{background:linear-gradient(180deg,var(--green1),var(--green2));box-shadow:0 6px 0 #2a7d2a,0 10px 24px rgba(40,90,30,.35),inset 0 2px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 rgba(20,80,20,.45)}
.bh-pink{background:linear-gradient(180deg,#ff8fb1,#ff4f86);box-shadow:0 5px 0 #c2305f,0 8px 18px rgba(160,30,80,.3),inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 rgba(140,20,60,.4)}
.bh-grey{background:linear-gradient(180deg,#d9d2e3,#b6abc6);box-shadow:0 5px 0 #8c7fa0,inset 0 2px 0 rgba(255,255,255,.5);color:#fff;text-shadow:0 2px 0 rgba(80,60,100,.35)}
/* room HUD */
#bh-room-top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:62px;display:flex;align-items:center;gap:8px;z-index:20;pointer-events:none}
.bh-stars{display:flex;align-items:center;gap:4px;background:linear-gradient(180deg,#7b4bb0,#5b2f7a);border:3px solid #fff3c4;border-radius:999px;padding:0 14px 0 4px;height:44px;font-size:26px;font-weight:800;box-shadow:0 4px 0 rgba(60,20,80,.35);pointer-events:auto}
.bh-stars i{font-style:normal;font-size:28px;filter:drop-shadow(0 2px 0 rgba(120,60,0,.4));display:inline-block}
.bh-stars.bump{animation:bhbump .35s ease-out}
@keyframes bhbump{40%{transform:scale(1.22)}}
.bh-roomname{flex:1;min-width:0;background:rgba(255,255,255,.88);border-radius:16px;padding:3px 12px 6px;color:var(--plum);box-shadow:0 4px 0 rgba(120,60,120,.18)}
.bh-roomname b{display:block;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh-prog{height:10px;border-radius:6px;background:#f1e2f3;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.bh-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8fb1,#ffc93c);border-radius:6px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
#bh-mute{position:fixed;left:10px;top:calc(62px + env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);color:var(--plum);font-size:19px;z-index:20;box-shadow:0 3px 0 rgba(120,60,120,.2);display:grid;place-items:center;padding:0}
#bh-room-bot{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;z-index:20;pointer-events:none;padding:0 12px}
.bh-tasks{width:min(420px,100%);background:rgba(255,250,244,.94);border-radius:22px;padding:8px 10px;box-shadow:0 8px 26px rgba(90,40,80,.22),0 3px 0 rgba(160,110,140,.25);pointer-events:auto;color:var(--plum)}
.bh-tasks h3{margin:0 4px 4px;font-size:14px;letter-spacing:.5px;text-transform:uppercase;opacity:.75;display:flex;justify-content:space-between}
.bh-task{display:flex;align-items:center;gap:10px;padding:5px 4px;border-top:1px dashed rgba(91,47,122,.15)}
.bh-task:first-of-type{border-top:0}
.bh-task .ic{width:46px;height:46px;border-radius:14px;background:radial-gradient(circle at 40% 35%,#fff,#ffe6ef);display:grid;place-items:center;font-size:26px;flex:none;box-shadow:inset 0 -3px 0 rgba(200,120,160,.18)}
.bh-task .ic img{width:44px;height:44px;object-fit:contain}
.bh-task .nm{flex:1;font-weight:800;font-size:17px;line-height:1.1}
.bh-task .nm small{display:block;font-weight:600;font-size:12px;opacity:.6}
.bh-task button{font-size:19px;padding:5px 14px;min-width:74px}
.bh-play{font-size:30px;padding:10px 0 12px;width:min(300px,82%);border-radius:28px}
.bh-play small{display:block;font-size:14px;line-height:1;opacity:.9;margin-top:-2px}
.bh-play.hard{background:linear-gradient(180deg,#ff7d7d,#e0384f);box-shadow:0 6px 0 #a5203a,0 10px 24px rgba(160,30,50,.35),inset 0 2px 0 rgba(255,255,255,.5)}
/* level popup */
#bh-pop{position:fixed;inset:0;z-index:30;background:rgba(60,25,70,.45);display:flex;justify-content:center;align-items:flex-start;padding-top:calc(20vh + env(safe-area-inset-top))}
.bh-card{width:min(340px,90vw);background:linear-gradient(180deg,#fffaf3,#ffeede);border-radius:28px;padding:14px 18px 22px;color:var(--plum);text-align:center;box-shadow:0 18px 50px rgba(60,20,70,.4),0 5px 0 #e6b9c9;position:relative;animation:bhin .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes bhin{from{transform:scale(.7);opacity:0}}
.bh-card h2{margin:-36px auto 6px;width:max-content;font-size:28px;color:#fff;background:linear-gradient(180deg,#ff8fb1,#e84a83);border-radius:18px;padding:2px 22px 4px;box-shadow:0 5px 0 #b02d63;text-shadow:0 2px 0 rgba(120,20,60,.4)}
.bh-card h2.hard{background:linear-gradient(180deg,#ff7d7d,#d8304a);box-shadow:0 5px 0 #96202f}
.bh-card .x{position:absolute;right:10px;top:8px;width:36px;height:36px;border-radius:50%;background:#f3dce6;color:var(--plum);font-size:20px;padding:0}
.bh-card .lbl{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.6;margin:6px 0 4px}
.bh-goalrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.bh-goalrow div{background:#fff;border-radius:16px;padding:4px 10px 2px;box-shadow:inset 0 -3px 0 rgba(200,140,170,.25);font-weight:800;font-size:20px;display:flex;align-items:center;gap:4px}
.bh-goalrow img{width:40px;height:40px;object-fit:contain}
.bh-boost{display:flex;justify-content:center;gap:10px;margin:2px 0 14px}
.bh-boost button{position:relative;width:64px;height:64px;border-radius:18px;background:#fff;box-shadow:inset 0 -4px 0 rgba(200,140,170,.25);padding:0;display:grid;place-items:center}
.bh-boost button img{width:50px;height:50px;object-fit:contain}
.bh-boost button.on{background:linear-gradient(180deg,#fff6c9,#ffd96a);box-shadow:0 0 0 3px #ffb627,inset 0 -4px 0 rgba(200,140,40,.3)}
.bh-boost button b{position:absolute;right:-6px;bottom:-6px;background:var(--plum);color:#fff;border-radius:999px;font-size:13px;min-width:24px;padding:1px 6px;border:2px solid #fff}
.bh-boost button:disabled{opacity:.45}
.bh-card .bh-green{font-size:28px;width:100%;padding:8px 0 10px}
/* match HUD */
#bh-mhud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:60px;display:flex;gap:8px;z-index:20;pointer-events:none}
.bh-moves{width:92px;flex:none;background:linear-gradient(180deg,#8a58c4,#5b2f7a);border:3px solid #fff3c4;border-radius:20px;text-align:center;padding:2px 0 4px;box-shadow:0 4px 0 rgba(60,20,80,.35)}
.bh-moves small{display:block;font-size:12px;font-weight:800;letter-spacing:.6px;opacity:.85;line-height:1.3}
.bh-moves b{display:block;font-size:40px;line-height:.95;text-shadow:0 3px 0 rgba(40,10,60,.4)}
.bh-moves.low b{color:#ffd0d0;animation:bhbump .6s infinite}
.bh-goals{flex:1;background:rgba(255,250,244,.95);border-radius:20px;display:flex;align-items:center;justify-content:space-around;padding:4px 6px;box-shadow:0 4px 0 rgba(160,110,140,.3);color:var(--plum);position:relative}
.bh-goals .lv{position:absolute;top:-2px;left:50%;transform:translate(-50%,-50%);background:var(--pink);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:0 10px;white-space:nowrap}
.bh-goals .g{display:flex;flex-direction:column;align-items:center;position:relative}
.bh-goals .g img{width:42px;height:42px;object-fit:contain}
.bh-goals .g b{font-size:20px;line-height:1;margin-top:-4px}
.bh-goals .g.done b{color:#2fae4a}
.bh-goals .g.bump{animation:bhbump .25s}
#bh-quit{position:fixed;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.8);color:var(--plum);font-size:18px;z-index:20;padding:0}
.bh-fly{position:fixed;width:40px;height:40px;margin:-20px 0 0 -20px;z-index:25;pointer-events:none;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(80,30,80,.35))}
.bh-combo{position:fixed;left:50%;top:44%;z-index:26;pointer-events:none;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:54px;color:#fff;white-space:nowrap;-webkit-text-stroke:3px #c2306a;paint-order:stroke fill;text-shadow:0 6px 0 #8f1f4c,0 12px 24px rgba(120,20,60,.35);animation:bhcombo 1s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes bhcombo{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1) rotate(-3deg);opacity:1}75%{transform:translate(-50%,-60%) scale(1) rotate(-3deg);opacity:1}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}
.bh-bubble{position:fixed;z-index:19;pointer-events:none;background:#fff;color:var(--plum);font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:16px;line-height:1.15;padding:7px 12px 8px;border-radius:16px;max-width:210px;width:max-content;box-shadow:0 6px 18px rgba(90,40,80,.25);transform:translate(-50%,-100%);animation:bhin .3s cubic-bezier(.3,1.5,.5,1)}
.bh-bubble:after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
/* Granny Gloss speaks with her portrait (art wave 1); in a painted room her bubble docks on the painting's bottom-left corner */
.bh-bubble{display:flex;align-items:center;gap:8px;padding-left:6px}
.bh-granny{width:38px;height:38px;border-radius:50%;flex:none;object-fit:cover;border:2px solid #ffd3e2;background:#ffe9f1}
.bh-bubble.dock{transform:translate(0,-100%);max-width:min(300px,78vw);font-size:17px;padding:8px 14px 9px 8px;border-radius:20px}
.bh-bubble.dock .bh-granny{width:58px;height:58px;margin:-18px 0 -4px -16px;border:3px solid #fff;box-shadow:0 4px 10px rgba(90,40,80,.3)}
.bh-bubble.dock:after{display:none}
/* the painted room: a framed painting between the top bar and the task panel (paint.js) */
.bh-paint{position:fixed;z-index:6;border-radius:22px;overflow:hidden;border:5px solid #fff8ee;box-shadow:0 14px 36px rgba(90,40,80,.32),0 0 0 2px rgba(255,201,60,.55);background:#f3e3ea;pointer-events:none}
.bh-paint canvas{display:block;width:100%;height:100%}
.bh-spot{display:block;width:44px;height:44px;border-radius:12px;background-repeat:no-repeat}
.bh-spark{position:fixed;z-index:24;pointer-events:none;font-style:normal;font-size:22px;margin:-11px 0 0 -11px;animation:bhspark .85s ease-out forwards}
@keyframes bhspark{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
#bh-load{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:linear-gradient(180deg,#f9d3e2,#ffe9cf);color:var(--plum);font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:22px;transition:opacity .5s}
#bh-load div{text-align:center} #bh-load i{display:block;width:180px;height:12px;border-radius:8px;background:#fff;margin:10px auto 0;overflow:hidden} #bh-load i b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8fb1,#ffc93c);transition:width .2s}
/* kit cards restyled */
body .hc-card{justify-content:center;padding-top:0;background:radial-gradient(circle at 50% 45%,rgba(90,40,110,.25),rgba(60,20,80,.55))}
body .hc-card h1{font-size:clamp(44px,13vw,72px);color:#fff;-webkit-text-stroke:3px #c2306a;paint-order:stroke fill;text-shadow:0 7px 0 #8f1f4c,0 14px 30px rgba(120,20,60,.35)}
body .hc-card p{text-shadow:0 2px 0 rgba(90,20,60,.5)}
body .hc-card .hint{margin-top:30px;margin-bottom:0}
body .hc-card.bh-title{background:linear-gradient(180deg,rgba(255,220,235,.0),rgba(80,30,90,.35));justify-content:flex-start;padding-top:calc(16vh + env(safe-area-inset-top))}
body .hc-card.bh-title h1{font-size:clamp(52px,16vw,96px);letter-spacing:1px;transform:rotate(-3deg)}
body .hc-card.bh-title h1 small{display:block;font-size:.36em;-webkit-text-stroke:2px #7a3fa8;text-shadow:0 4px 0 #5b2f7a;letter-spacing:2px;margin-top:6px;transform:rotate(1deg)}
body .hc-card.bh-title .hint{margin-top:auto;margin-bottom:14vh}
.bh-winstars{display:flex;gap:6px;justify-content:center;margin:6px 0 2px}
.bh-winstars i{font-style:normal;font-size:64px;filter:grayscale(1) brightness(1.6) opacity(.45);transform:scale(.4);transition:transform .4s cubic-bezier(.3,1.8,.5,1),filter .3s}
.bh-winstars i:nth-child(2){transform:scale(.4) translateY(-14px)}
.bh-winstars i.on{filter:drop-shadow(0 5px 0 #c27a00);transform:scale(1)}
.bh-winstars i.on:nth-child(2){transform:scale(1.18) translateY(-14px)}
@media (min-width:700px){ #bh-room-top{right:70px;max-width:560px} .bh-tasks{width:420px} #bh-mhud{left:50%;right:auto;transform:translateX(-50%);width:560px} }
</style>
</head>
<body>
<div id="bh-load" class="bh"><div>Bloomhaus<i><b></b></i></div></div>
<script type="module" src="game.js"></script>
</body>
</html>
