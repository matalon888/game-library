<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Fletch: Arrow Dungeon Roguelite</title>
<meta name="description" content="Move to dodge, stand still to fire: clear dungeon rooms with a sprout archer and stack one-of-three skills between rooms. Free in your browser.">
<meta property="og:title" content="Fletch: Arrow Dungeon Roguelite">
<meta property="og:description" content="Move to dodge, stand still to fire: clear dungeon rooms and stack one-of-three skills between rooms.">
<meta name="theme-color" content="#a8e6cf">
<link rel="icon" href="data:,">
<style>
  .fl-hp{position:fixed;left:0;top:0;width:64px;height:10px;margin-left:-32px;border-radius:6px;background:rgba(40,20,40,.55);border:2px solid #fff;overflow:hidden;z-index:3;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .fl-hp i{display:block;height:100%;width:100%;background:linear-gradient(#7dff8a,#2fcf5b);transition:width .15s}
  .fl-hpn{position:fixed;left:0;top:0;width:64px;margin-left:-32px;text-align:center;font-weight:800;font-size:13px;z-index:3;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.3)}
  .fl-dmg{position:fixed;font-weight:800;font-size:20px;-webkit-text-stroke:5px #3a2e4a;paint-order:stroke fill;pointer-events:none;z-index:4;transform:translate(-50%,-50%);text-shadow:0 2px 0 rgba(0,0,0,.35);animation:fldmg .7s ease-out forwards}
  @keyframes fldmg{0%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-160%) scale(.9)}}
  .fl-joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);pointer-events:none;z-index:3}
  .fl-joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .fl-pick{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(30,20,50,.55);padding:20px}
  .fl-pick h2{margin:0 0 6px;font-size:34px;font-weight:800;text-shadow:0 4px 0 rgba(0,0,0,.2)}
  .fl-cards{display:flex;gap:10px;width:100%;max-width:420px;justify-content:center}
  .fl-card{flex:1;max-width:128px;background:#fff;color:#3a2e4a;border-radius:18px;padding:14px 8px 12px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.2);cursor:pointer;animation:flin .35s cubic-bezier(.2,1.6,.4,1) both}
  .fl-card:nth-child(2){animation-delay:.07s}.fl-card:nth-child(3){animation-delay:.14s}
  .fl-card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .fl-card b{display:block;font-size:40px;line-height:1.1;margin-bottom:4px}
  .fl-card u{display:block;text-decoration:none;font-weight:800;font-size:17px;line-height:1.05;color:var(--ui)}
  .fl-card small{display:block;font-weight:600;font-size:13px;line-height:1.15;margin-top:6px;opacity:.75}
  @keyframes flin{0%{opacity:0;transform:translateY(40px) scale(.7)}100%{opacity:1;transform:none}}
  .fl-room{position:fixed;left:0;right:0;top:calc(108px + env(safe-area-inset-top));text-align:center;font-weight:800;font-size:16px;pointer-events:none;z-index:5;text-shadow:0 2px 0 rgba(0,0,0,.18)}
  .fl-skills{position:fixed;left:10px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:4px;flex-wrap:wrap;max-width:70vw;z-index:5;pointer-events:none}
  .fl-skills span{background:rgba(255,255,255,.75);border-radius:10px;padding:1px 5px;font-size:18px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
</style>
</head>
<body>
<script type="module" src="game.js"></script>
</body>
</html>
