<!doctype html>
<html lang="en">
<head>
<script src="/arcade/save.js" defer data-ap-save></script>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pilepick: Triple Sort 3D</title>
<meta name="description" content="Free 3D triple sorting game: tap toys in a messy pile to move them to your 7-slot shelf, clear three alike, and empty the pile before the timer ends.">
<meta property="og:title" content="Pilepick: Triple Sort 3D">
<meta property="og:description" content="Free 3D triple sorting game: tap toys in a messy pile to move them to your 7-slot shelf, clear three alike, and empty the pile before the timer ends.">
<meta name="theme-color" content="#bfe6ff">
<link rel="icon" href="data:,">
<style>.hc-canvas{z-index:1}.hc-pop,.hc-sub,.hc-card p,.hc-card .hint{text-shadow:0 2px 0 rgba(0,0,0,.22),0 0 10px rgba(0,0,0,.16)!important}.hc-card h1,.hc-score{text-shadow:0 5px 0 rgba(0,0,0,.18),0 0 18px rgba(0,0,0,.12)!important}
.hc-score{font-size:40px;top:calc(54px + env(safe-area-inset-top))}.hc-score.low{color:#ff4d6d;animation:pp .5s ease-in-out infinite}@keyframes pp{50%{transform:scale(1.12)}}
.hc-sub{top:calc(96px + env(safe-area-inset-top))}.hc-card{z-index:20}
#shelf{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom));width:min(94vw,560px);height:var(--sh,84px);z-index:0;border-radius:22px;
background:linear-gradient(180deg,#5b6aa8,#3d4880);box-shadow:0 8px 0 #2b3463,0 14px 28px rgba(30,30,80,.3);display:flex;gap:5px;padding:9px;box-sizing:border-box}
#shelf i{flex:1;border-radius:14px;background:linear-gradient(180deg,#2f3870,#3a4583);box-shadow:inset 0 4px 8px rgba(0,0,0,.35)}
#shelf.warn{animation:pw .35s ease-in-out 2}@keyframes pw{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}</style>
</head>
<body>
<div id="shelf"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<script type="module" src="game.js"></script>
</body>
</html>
