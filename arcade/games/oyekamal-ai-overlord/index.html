<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline LLM Chat</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
  header { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1; }
  #status { font-size: .8rem; opacity: .7; width: 100%; }
  #chat { flex: 1; overflow-y: auto; margin: 1rem 0; display: flex; flex-direction: column; gap: .5rem; }
  .msg { padding: .5rem .8rem; border-radius: 10px; max-width: 85%; white-space: pre-wrap; }
  .user { background: #2563eb; color: #fff; align-self: flex-end; }
  .bot { background: color-mix(in srgb, currentColor 10%, transparent); align-self: flex-start; }
  form { display: flex; gap: .5rem; }
  input[type=text] { flex: 1; padding: .6rem; border-radius: 8px; border: 1px solid #8884; font-size: 1rem; }
  button, select { padding: .5rem .8rem; border-radius: 8px; border: 1px solid #8884; cursor: pointer; font-size: .9rem; }
  button:disabled { opacity: .5; cursor: default; }
  progress { width: 100%; height: 6px; }
</style>
</head>
<body>
<header>
  <h1>Offline LLM Chat</h1>
  <a href="game.html" style="font-size:.85rem">🎮 Play Guess Quest</a>
  <select id="model">
    <option value="smol">SmolLM2 360M — fast (~250–380MB)</option>
    <option value="qwen">Qwen2.5 1.5B — better (~1GB+)</option>
  </select>
  <button id="load">Load model</button>
  <div id="status">Pick a model and click Load. First load downloads it; after that it works fully offline.</div>
  <progress id="prog" value="0" max="1" hidden></progress>
</header>
<div id="chat"></div>
<form id="form">
  <input type="text" id="input" placeholder="Ask something…" autocomplete="off" disabled>
  <button type="submit" id="send" disabled>Send</button>
</form>

<script type="module">
import { createEngine, probeGPU } from "./engine.js";

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

const $ = id => document.getElementById(id);
let chat = null; // async (messages, onToken) => full reply
const history = [{ role: "system", content: "You are a helpful, concise assistant running offline in the user's browser." }];

$("status").textContent = (await probeGPU())
  ? "WebGPU detected — will use GPU engine. Pick a model and click Load."
  : "No WebGPU — will use CPU engine (slower, but works). Pick a model and click Load.";

$("load").onclick = async () => {
  $("load").disabled = $("model").disabled = true;
  $("prog").hidden = false;
  try {
    const eng = await createEngine($("model").value, (p, text) => { $("prog").value = p; $("status").textContent = text; });
    chat = eng.chat;
    $("status").textContent = `Model ready (${eng.backend}) — fully offline from now on.`;
    $("prog").hidden = true;
    $("input").disabled = $("send").disabled = false;
    $("input").focus();
  } catch (e) {
    $("status").textContent = "Failed to load: " + (e.message || e);
    $("load").disabled = $("model").disabled = false;
  }
};

function addMsg(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
  return div;
}

$("form").onsubmit = async e => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || !chat) return;
  $("input").value = "";
  $("send").disabled = true;
  addMsg("user", text);
  history.push({ role: "user", content: text });
  const botDiv = addMsg("bot", "…");
  let reply = "";
  try {
    reply = await chat(history, partial => {
      botDiv.textContent = partial;
      $("chat").scrollTop = $("chat").scrollHeight;
    });
  } catch (e) {
    botDiv.textContent = "Error: " + (e.message || e);
  }
  history.push({ role: "assistant", content: reply });
  $("send").disabled = false;
  $("input").focus();
};
</script>
</body>
</html>
