<!doctype html>
<html lang="en">
<head>
<script src="/arcade/save.js" defer data-ap-save></script>
<script src="/arcade/guard.js" data-ap-guard></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gullhop: Island Flight Sim</title>
<meta name="description" content="Fly a cartoon plane over a sunny island chain: race through rings, land on tiny runways, drop supply crates and pop paint-blaster drones in a free 3D flight game in your browser.">
<meta property="og:title" content="Gullhop: Island Flight Sim">
<meta property="og:description" content="A free 3D arcade flight game: rings, landings, crate drops and drone dogfights over a cartoon archipelago.">
<meta name="theme-color" content="#7cc8ff">
<link rel="icon" href="data:,">
<style>
#hud{position:fixed;inset:0;pointer-events:none;z-index:7;font-family:'Baloo 2',system-ui,sans-serif;color:#fff}
body:not(.playing) #hud .ctl{display:none!important}
#thr{position:fixed;right:14px;bottom:calc(150px + env(safe-area-inset-bottom));width:58px;height:min(230px,30vh);border-radius:29px;background:rgba(20,50,90,.26);border:2px solid rgba(255,255,255,.6);pointer-events:auto;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.12)}
#thr i{position:absolute;left:5px;right:5px;bottom:5px;border-radius:24px;background:linear-gradient(0deg,#ffb02e,#ffe066);height:50%;transition:height .06s}
#thr b{position:absolute;left:0;right:0;top:-24px;text-align:center;font-size:13px;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.2)}
#thr span{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-weight:800;font-size:14px;color:#5a3a00}
.gbtn{position:fixed;pointer-events:auto;touch-action:none;border:0;font:inherit;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.gbtn:active,.gbtn.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
#act{right:14px;bottom:calc(36px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8fb3,#ff3d7f);font-size:20px;line-height:1}
#act small{display:block;font-size:12px;opacity:.9}
#gear,#flaps{bottom:calc(46px + env(safe-area-inset-bottom));height:44px;padding:0 14px;border-radius:22px;background:rgba(20,50,90,.45);font-size:15px;border:2px solid rgba(255,255,255,.5)}
#gear{right:124px} #flaps{right:212px}
#gear.dn,#flaps.dn{background:#3ab795}
#inst{position:fixed;left:14px;bottom:calc(108px + env(safe-area-inset-bottom));display:grid;gap:6px;pointer-events:none}
#inst div{background:rgba(20,50,90,.4);border-radius:14px;padding:3px 12px;font-weight:800;font-size:20px;line-height:1.2;min-width:96px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
#inst small{font-size:11px;letter-spacing:1px;opacity:.85;margin-left:4px}
#warn{position:fixed;left:50%;top:31%;transform:translateX(-50%);background:#ff3d5a;border-radius:16px;padding:4px 16px;font-weight:800;font-size:20px;letter-spacing:1px;box-shadow:0 4px 0 rgba(0,0,0,.18);animation:gw .5s ease-in-out infinite alternate}
#warn[hidden]{display:none}
@keyframes gw{to{opacity:.55}}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.65);background:rgba(20,50,90,.18);pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.15)}
#stick[hidden]{display:none}
#mark{position:fixed;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid #ffe066;pointer-events:none;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
#mark b{position:absolute;top:40px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.3)}
#mark[hidden]{display:none}
.hangar{display:grid;gap:10px;margin-top:14px;width:min(360px,100%);pointer-events:auto}
.hangar .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.hangar .pl{font:inherit;font-weight:800;font-size:14px;line-height:1.1;border:0;border-radius:14px;padding:7px 10px;background:rgba(255,255,255,.82);color:#24486e;cursor:pointer;min-width:76px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.hangar .pl small{display:block;font-weight:600;font-size:11px;opacity:.75}
.hangar .pl.sel{background:#ffd23f;color:#3a2a00}
.hangar .pl.lock{opacity:.55}
.hangar .dot{width:32px;height:32px;border-radius:50%;border:3px solid #fff;cursor:pointer;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.hangar .dot.sel{outline:3px solid #ffd23f;outline-offset:2px}
.hangar .dot.lock{opacity:.35}
.hangar .ms{font-size:17px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.hangar .tg{font:inherit;font-size:13px;font-weight:700;background:rgba(20,50,90,.35);color:#fff;border:0;border-radius:12px;padding:4px 12px;cursor:pointer}
</style>
</head>
<body>
<div id="hud">
  <div id="thr" class="ctl"><b>THROTTLE</b><i></i><span>50</span></div>
  <button id="act" class="gbtn ctl">FIRE<small>space</small></button>
  <button id="gear" class="gbtn ctl">GEAR</button>
  <button id="flaps" class="gbtn ctl">FLAPS</button>
  <div id="inst" class="ctl"><div><span id="spd">0</span><small>KTS</small></div><div><span id="alt">0</span><small>FT</small></div></div>
  <div id="warn" hidden>STALL</div>
  <div id="stick" hidden><i></i></div>
  <div id="mark" hidden><b></b></div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
