<!doctype html>
<html lang="en">
<head>
<script src="/arcade/guard.js" data-ap-guard></script>
<script src="/arcade/save.js" defer data-ap-save></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Chain Net Crew: Basketball Shootout for Your AI Agents</title>
<meta name="description" content="A 3D night street-basketball shootout where your Claude Code or Codex agents are the ballers. Every finished tool call is a shot: edits drain threes, commits dunk, passing tests throw alley-oops. You shoot too, coach the court and chase a daily high score.">
<meta property="og:title" content="Chain Net Crew: Basketball Shootout for Your AI Agents">
<meta property="og:description" content="Your AI coding agents, live, as street ballers. Swishes for good tool calls, bricks for failures, dunks for commits. Shoot between their shots and beat today's high score.">
<meta name="theme-color" content="#0b0d1e">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap">
<style>
:root{--acc:#ff7a2f;--ink:#f7f1e6;--panel:rgba(14,14,30,.86);--line:rgba(255,255,255,.13);--good:#4ade80}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d1e;color:var(--ink);font-family:Rubik,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hc-canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;cursor:pointer}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:flex-start;gap:10px;z-index:20;pointer-events:none}
.brand{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:7px 12px;pointer-events:auto;backdrop-filter:blur(6px)}
.brand b{font-family:Bungee,Rubik,sans-serif;font-weight:400;font-size:17px;letter-spacing:.5px;color:var(--acc);display:block;line-height:1.1}
.brand span{font-size:13px;font-weight:700;color:#ffe27a}
#score{margin:0 auto;display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 10px;align-items:center}
#score div{text-align:center;min-width:54px}
#score small{display:block;font-size:10px;letter-spacing:1.5px;color:#b8b3cc;font-weight:700}
#score b{font-family:Bungee,Rubik,sans-serif;font-weight:400;font-size:22px;line-height:1.05}
#score .clock b{color:#ffb020}
nav{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
nav button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;backdrop-filter:blur(6px)}
nav button:hover{border-color:var(--acc)}
nav #bShoot{background:var(--acc);color:#1a0d02;border-color:transparent}
#roster{position:fixed;left:12px;top:calc(76px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px;z-index:15;pointer-events:none;max-height:calc(100% - 200px);overflow:hidden}
.chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:4px 9px;font-size:13px;font-weight:700;min-width:150px}
.chip.rk{margin-left:16px;min-width:134px;font-size:12px;opacity:.9}
.chip b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.chip span{color:#c9c3dc;font-variant-numeric:tabular-nums}
.chip.wait{border-color:#ffe27a;animation:pulse 1s infinite}
.chip.fire{background:linear-gradient(90deg,rgba(255,90,20,.45),var(--panel))}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,226,122,.35)}}
#meterWrap{position:fixed;left:50%;bottom:calc(58px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:15;text-align:center;pointer-events:none}
#meter{position:relative;width:min(320px,74vw);height:22px;border-radius:12px;background:rgba(10,10,22,.85);border:2px solid rgba(255,255,255,.25);overflow:hidden;transition:opacity .2s}
#meter.off{opacity:.45}
#green{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#6dffa0,#21c26b)}
#perfect{position:absolute;top:0;bottom:0;width:4px;background:#fff;box-shadow:0 0 8px #fff}
#needle{position:absolute;top:-3px;bottom:-3px;width:6px;margin-left:-3px;border-radius:3px;background:#ffcf3a;box-shadow:0 0 10px #ffb020;left:0}
#hint{margin-top:6px;font-weight:800;font-size:14px;letter-spacing:1px;text-shadow:0 2px 6px #000}
#hint.go{color:#ffe27a}
#round{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:16;background:linear-gradient(180deg,#ff7a2f,#e2481b);color:#fff;border-radius:14px;padding:4px 16px;font-family:Bungee,Rubik,sans-serif;font-size:20px;box-shadow:0 6px 20px rgba(255,90,20,.4);display:flex;gap:14px;pointer-events:none}
#round[hidden]{display:none}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;z-index:18;pointer-events:none;font-family:Bungee,Rubik,sans-serif;font-size:clamp(40px,9vw,92px);line-height:1;opacity:0;-webkit-text-stroke:2px rgba(0,0,0,.35);text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px currentColor}
#banner.on{animation:ban 1.3s ease-out forwards}
#banner small{display:block;font-size:.3em;-webkit-text-stroke:0;color:#fff;margin-top:6px}
@keyframes ban{0%{opacity:0;transform:scale(.4) rotate(-6deg)}15%{opacity:1;transform:scale(1.12) rotate(2deg)}25%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05) translateY(-20px)}}
.pop{position:fixed;z-index:17;pointer-events:none;font-weight:800;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 12px rgba(0,0,0,.5);animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#idle{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:14;background:var(--panel);border:1px dashed rgba(255,226,122,.5);border-radius:16px;padding:14px 20px;text-align:center;max-width:min(420px,86vw);pointer-events:none}
#idle b{font-family:Bungee,Rubik,sans-serif;font-weight:400;color:#ffe27a;font-size:18px;display:block}
#idle[hidden]{display:none}
.bd-wrap[hidden]{display:none!important}
#rivBox[hidden]{display:none}
#score #rivName{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.5px}
.rhd{font-family:Bungee,Rubik,sans-serif;font-size:11px;letter-spacing:.5px;color:var(--c);margin-top:4px;text-shadow:0 1px 3px #000}
.chip.rv{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 30%,transparent),var(--panel))}
.chip.rv small{font-size:10px;opacity:.75;margin-left:6px;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:0 4px}
.chip.off{opacity:.6}
#call{position:fixed;left:50%;bottom:calc(132px + env(safe-area-inset-bottom));transform:translate(-50%,10px);z-index:16;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c,#fff);border-radius:12px;padding:6px 14px;font-weight:800;font-size:15px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .25s,transform .25s}
#call.on{opacity:1;transform:translate(-50%,0)}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;background:rgba(16,15,32,.97);border:1px solid var(--line);border-radius:18px;padding:18px;z-index:45;box-shadow:0 20px 60px rgba(0,0,0,.6);touch-action:pan-y}
.panel[hidden]{display:none}
.panel h2{margin:0 0 4px;font-family:Bungee,Rubik,sans-serif;font-weight:400;color:var(--acc);font-size:24px}
.panel .x{position:absolute;right:12px;top:10px;background:none;border:0;color:#b8b3cc;font-size:22px}
.panel .sub{color:#b8b3cc;font-size:13px;margin:0 0 10px}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.up b{font-size:16px} .up p{margin:0;color:#c9c3dc;font-size:13px}
.pips{display:flex;gap:4px;margin-top:4px} .pips i{width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)} .pips i.on{background:var(--acc)}
.up button{grid-row:span 2;background:var(--acc);color:#1a0d02;border:0;border-radius:12px;padding:9px 12px;font-weight:800;min-width:110px}
.up button:disabled{opacity:.4;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px} th{color:#b8b3cc;font-weight:700;text-align:right;padding:4px} th:first-child,td:first-child{text-align:left} td{padding:5px 4px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
td i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.kpis div{background:rgba(255,255,255,.05);border-radius:12px;padding:8px;text-align:center} .kpis b{display:block;font-family:Bungee,Rubik,sans-serif;font-weight:400;font-size:22px;color:#ffe27a} .kpis small{color:#b8b3cc;font-size:11px;letter-spacing:1px}
.big{display:block;width:100%;margin-top:12px;background:var(--acc);color:#1a0d02;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:16px}
.ghost{display:block;width:100%;margin-top:8px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:700}
#result h2{font-size:30px;text-align:center} #result .rs{text-align:center;font-family:Bungee,Rubik,sans-serif;font-size:64px;color:#ffe27a;line-height:1;margin:6px 0} #result p{text-align:center;margin:4px 0;color:#d9d4e8}
@media (max-width:760px){
  #top{flex-wrap:wrap;left:8px;right:8px;gap:6px}
  .brand{padding:5px 9px} .brand b{font-size:14px}
  #score{order:3;margin:0;width:100%;justify-content:space-around;padding:4px 6px} #score b{font-size:18px}
  nav{flex:1;gap:4px} nav button{padding:6px 8px;font-size:12px}
  #roster{top:auto;bottom:calc(112px + env(safe-area-inset-bottom));left:8px;right:8px;flex-direction:row;flex-wrap:wrap;gap:4px;max-height:64px}
  .chip{min-width:0;padding:3px 7px;font-size:11px} .chip.rk{display:none} .chip b{max-width:70px}
  #round{top:calc(118px + env(safe-area-inset-top))}
  #call{bottom:calc(184px + env(safe-area-inset-bottom));font-size:12px;padding:4px 10px}
  .rhd{width:100%;margin:0;font-size:10px}
  #score #rivName{max-width:70px}
}
</style>
</head>
<body>
<div id="top">
  <div class="brand"><b>CHAIN NET CREW</b><span id="wallet">◆ 0</span> <span id="rankTag"></span></div>
  <div id="score">
    <div><small id="teamLbl">TEAM</small><b id="sTeam">0</b></div>
    <div id="rivBox" hidden><small id="rivName"></small><b id="sRiv">0</b></div>
    <div class="clock"><small>SHOT CLOCK</small><b id="sClock">24</b></div>
    <div><small>YOU</small><b id="sYou">0/0</b></div>
  </div>
  <nav>
    <button id="bShoot">Shootout</button>
    <button id="bCoach">Coach</button>
    <button id="bStats">Stats</button>
    <button id="bBoard" title="World leaderboard">🏆</button>
    <button id="bShare">Share</button>
    <button id="bConnect">Connect</button>
  </nav>
</div>
<div id="roster"></div>
<div id="round" hidden><span id="rTime">2:00</span><span id="rScore">0</span></div>
<div id="idle" hidden><b>Waiting for your agents…</b>Start a Claude Code or Codex session and your agents walk on court. Shoot around meanwhile.</div>
<div id="banner"></div>
<div id="call"></div>
<div id="meterWrap"><div id="meter"><i id="green"></i><i id="perfect"></i><b id="needle"></b></div><div id="hint">HOLD, RELEASE IN THE GREEN</div></div>

<section id="coach" class="panel" hidden><button class="x" data-close>✕</button><h2>Coach</h2><p class="sub" id="coachSub"></p><div id="coachList"></div></section>
<section id="stats" class="panel" hidden><button class="x" data-close>✕</button><h2>Stats</h2><div id="statsBody"></div><button class="big" id="bShare2">Share my agents' day</button></section>
<section id="result" class="panel" hidden><button class="x" data-close>✕</button><h2 id="resT">Shootout over</h2><div class="rs" id="resS">0</div><div id="resB"></div><button class="big" id="bAgain">Run it back</button><button class="ghost" id="bShare3">Share</button></section>
<script type="module" src="game.js"></script>
</body>
</html>
