<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leonida Stories 3D — open-world browser game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;user-select:none;color:#fff}
  canvas#c{display:block;width:100vw;height:100vh;cursor:crosshair}
  #ui{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  #ui .t{text-shadow:0 0 3px #000,0 0 6px #000,1px 1px 2px #000}
  #hurt{position:absolute;inset:0;background:rgba(200,0,0,0.5);opacity:0}
  #vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 45%,rgba(120,0,0,0.9) 100%);opacity:0}
  #topleft{position:absolute;left:24px;top:18px;font-weight:bold;text-shadow:0 0 4px #000,1px 1px 2px #000}
  #clock{font-family:monospace;font-size:24px}
  #radio{color:#ffb0e0;font-size:14px;margin-top:4px}
  #god{color:#f88;font-size:12px}
  #topright{position:absolute;right:24px;top:16px;width:200px;text-align:right;text-shadow:0 0 4px #000,1px 1px 2px #000}
  #money{font-family:monospace;font-weight:bold;font-size:30px;color:#5fd97a}
  .bar{background:rgba(0,0,0,0.55);border:2px solid rgba(0,0,0,0.55);height:12px;margin:6px 0 0 auto;width:184px}
  .bar div{height:100%;width:100%}
  #hpbar{background:#c23}#armorbar{background:#4a7fd0}
  .bar.thin{height:6px;margin-top:10px;display:none}
  #stars{margin-top:8px;font-size:24px;letter-spacing:4px;color:rgba(255,255,255,0.18)}
  #stars span.on{color:#ffd23f}#stars span.flash{color:#fff}
  #weapon{display:flex;align-items:center;justify-content:flex-end;gap:10px;background:rgba(0,0,0,0.55);border-radius:6px;padding:6px 10px;margin-top:10px;margin-left:auto;width:160px}
  #wname{font-size:13px;font-weight:bold}#wammo{font-family:monospace;font-size:18px;font-weight:bold;color:#ffd23f;text-align:left}
  #weapon>div{text-align:left;min-width:90px}
  #vname{font-size:18px;color:#e0e0ff;font-weight:bold;margin-top:8px}
  #mlines{font-size:14px;font-weight:bold;margin-top:14px}
  #notif{position:absolute;top:26px;left:50%;transform:translateX(-50%);text-align:center;font-size:18px;font-weight:bold;text-shadow:0 0 4px #000,1px 1px 2px #000;white-space:nowrap}
  #notif div{margin-bottom:6px}
  #big{position:absolute;top:40%;left:0;right:0;text-align:center;display:none}
  #bigtext{font-size:72px;font-weight:900;font-family:Impact,"Arial Black",sans-serif;letter-spacing:2px;text-shadow:0 0 10px #000,3px 3px 0 #000}
  #bigsub{font-size:26px;font-weight:bold;text-shadow:0 0 6px #000,2px 2px 0 #000}
  #speedo{position:absolute;right:28px;bottom:36px;text-align:right;display:none;text-shadow:0 0 4px #000}
  #speed{font-family:monospace;font-size:44px;font-weight:bold}
  #speedo .unit{font-size:14px;margin-left:4px;color:#ccc}
  #gear{display:inline-block;margin-left:12px;font-family:monospace;font-size:26px;font-weight:bold;color:#ffd23f;background:rgba(0,0,0,0.5);border-radius:4px;padding:0 8px}
  #rpm{height:6px;width:180px;background:rgba(0,0,0,0.5);margin-top:6px;margin-left:auto}#rpmbar{height:100%;background:#ffd23f;width:0}
  #bottom{position:absolute;left:0;right:0;bottom:30px;text-align:center}
  #hint{color:#cfe8ff;font-size:15px;font-weight:bold;text-shadow:0 0 4px #000,1px 1px 2px #000;height:20px}
  #timer{font-family:monospace;font-size:26px;font-weight:bold;text-shadow:0 0 4px #000;display:none}
  #objective{display:inline-block;background:rgba(0,0,0,0.6);border-radius:8px;padding:10px 24px;color:#ffe9a0;font-size:17px;font-weight:bold;margin-top:4px;max-width:640px}
  #crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);display:none}
  #crosshair .c{width:100%;height:100%;border:1.5px solid rgba(255,255,255,0.85);border-radius:50%;box-sizing:border-box;box-shadow:0 0 2px #000}
  #crosshair::before,#crosshair::after{content:"";position:absolute;background:rgba(255,255,255,0.85);left:50%;top:50%}
  #crosshair::before{width:2px;height:8px;transform:translate(-50%,-50%)}#crosshair::after{height:2px;width:8px;transform:translate(-50%,-50%)}
  #hitmarker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:bold;opacity:0;text-shadow:0 0 3px #000}
  #minimapwrap{position:absolute;left:18px;bottom:18px;width:240px;height:170px}
  #minimap{border-radius:10px}
  #wantedtag{position:absolute;right:8px;top:6px;font-size:11px;font-weight:bold;color:#ff7070;text-shadow:0 0 3px #000;display:none}
  #floats{position:absolute;inset:0}
  .float{position:absolute;transform:translate(-50%,-50%);font-weight:bold;font-size:18px;text-shadow:0 0 4px #000,1px 1px 2px #000;white-space:nowrap}
  #dialog{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);width:min(760px,calc(100vw - 40px));height:120px;background:rgba(10,5,20,0.92);border:2px solid #40e0d0;border-radius:12px;display:none;align-items:center;padding:0 16px;box-sizing:border-box;pointer-events:auto}
  #portrait{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:bold;color:#000;flex:none;margin-right:20px}
  #dlgbody{flex:1;position:relative;height:100%}
  #dlgwho{font-weight:bold;font-size:15px;margin-top:14px}
  #dlgtext{font-size:16px;margin-top:6px;line-height:21px}
  #dlgnext{position:absolute;right:0;bottom:8px;font-size:12px;color:#aaa}
  #menu{position:absolute;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;pointer-events:auto}
  #menubox{width:min(560px,calc(100vw - 40px));background:rgba(20,10,30,0.95);border:2px solid #ff5fa0;border-radius:12px;padding:24px 16px}
  #menutitle{text-align:center;color:#ff9ad0;font-size:26px;font-weight:bold;margin-bottom:16px}
  .mi{display:flex;justify-content:space-between;padding:8px 16px;border-radius:6px;font-size:17px;font-weight:bold;cursor:pointer}
  .mi.sel{background:rgba(255,255,255,0.15);color:#ffd23f}.mi.dis{color:#777}.mi .r{font-family:monospace;color:#5fd97a}
  #menufooter{text-align:center;color:#aaa;font-size:13px;margin-top:14px}
  #controls{position:absolute;inset:0;background:rgba(0,0,0,0.88);display:none;pointer-events:auto;overflow:auto}
  #controls h1{text-align:center;color:#ff9ad0;font-size:32px;margin:40px 0 10px}
  #controls table{margin:0 auto;border-collapse:collapse;font-size:15px}
  #controls th{color:#40e0d0;text-align:left;padding:14px 12px 4px;font-size:16px}
  #controls td{padding:3px 12px}#controls td.k{color:#ffd23f;font-weight:bold;width:130px}
  #controls .foot{text-align:center;color:#aaa;margin-top:24px}
  #map{position:absolute;inset:0;background:rgba(0,0,0,0.88);display:none;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:0 30px;pointer-events:auto}
  #maptitle{width:100%;text-align:center;color:#ff9ad0;font-size:28px;font-weight:bold;margin:14px 0 8px}
  #mapcanvas{image-rendering:pixelated;border:2px solid #444}
  #maplegend{font-size:13px;font-weight:bold;padding-top:10px}
  #maplegend div{margin-bottom:8px;display:flex;align-items:center}
  .lk{display:inline-block;width:16px;height:16px;border-radius:3px;color:#000;font-size:11px;text-align:center;line-height:16px;margin-right:8px}
  #mapfoot{width:100%;text-align:center;color:#ccc;font-size:14px;margin-top:10px}
  #title{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:auto}
  #titlebg{position:absolute;inset:0;background:linear-gradient(#1a0b3a 0%,#7a2a6a 55%,#ff8a5a 80%,#ffd27a 100%)}
  #titlebg::after{content:"";position:absolute;left:50%;top:58%;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:#ffd06a;box-shadow:0 0 60px #ffb040}
  #titleinner{position:relative;text-align:center}
  #tlogo{font-family:Impact,"Arial Black",sans-serif;font-size:96px;font-weight:900;line-height:0.9;background:linear-gradient(#fff0a0,#ff5fa0 55%,#40e0d0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(4px 4px 0 #2a0a3a) drop-shadow(0 0 12px rgba(0,0,0,0.6))}
  #tlogo span{display:block;font-size:48px;color:#40e0d0;-webkit-text-fill-color:#40e0d0}
  #tsub{color:#ffd0f0;margin:18px 0 40px;font-size:16px;text-shadow:0 0 4px #000}
  .ti{width:300px;margin:12px auto;padding:12px;border-radius:8px;background:rgba(0,0,0,0.35);font-size:20px;font-weight:bold;cursor:pointer;border:2px solid transparent}
  .ti.sel{background:rgba(255,255,255,0.25);border-color:#ffd23f}.ti.dis{color:#777}
  #tctrls{margin-top:50px;font-size:13px;color:#eee;line-height:20px;text-shadow:0 0 4px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/cannon-es.js"></script>
<script src="js/util.js"></script>
<script src="js/world.js"></script>
<script src="js/scene.js"></script>
<script src="js/physics.js"></script>
<script src="js/audio.js"></script>
<script src="js/effects.js"></script>
<script src="js/vehicle.js"></script>
<script src="js/ped.js"></script>
<script src="js/police.js"></script>
<script src="js/ui.js"></script>
<script src="js/missions.js"></script>
<script src="js/main.js"></script>
</body>
</html>
