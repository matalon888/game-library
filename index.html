<style>
:root { --ink: #15171B; --paper: #F5F3E9; --acid: #E5FF54; --lilac: #AC9CFF; --coral: #FF785A; --surface: #23262D; --muted: #B5B7BE; --acid-side: #A9BD2E;
  --font: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif; --ease: cubic-bezier(.2, .8, .2, 1); color-scheme: dark }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { height: 100%; margin: 0 }
body { background: var(--ink); color: var(--paper); font: 500 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden }
button, a { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--acid); outline-offset: 3px; border-radius: 8px }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y }
.flat { display: none; position: fixed; width: min(56vw, 300px); left: 50%; top: 14%; transform: translateX(-50%) rotate(-8deg) }
body.no3d .flat { display: block }
@media (min-width: 900px) { .flat { left: 72%; top: 22% } }
.shade { position: fixed; inset: auto 0 0 0; height: 62%; background: linear-gradient(to top, var(--ink) 38%, rgba(21, 23, 27, 0)); pointer-events: none }

.ui { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px calc(env(safe-area-inset-bottom, 0px) + 18px) }
.ui > * { pointer-events: auto }
.top { display: flex; align-items: center; justify-content: space-between }
.mark { display: flex; align-items: center; gap: 9px; text-decoration: none; font-weight: 700; font-size: 18px; letter-spacing: .03em }
.mark svg { width: 28px; height: 28px; color: var(--acid) }
.top a.web { font-size: 14px; text-decoration: none; padding: 8px 13px; border-radius: 999px; background: rgba(35, 38, 45, .8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px) }

.bottom { width: 100%; max-width: 560px; margin: 0 auto; display: grid; gap: 18px }
h1 { margin: 0; font-weight: 700; font-size: clamp(46px, 11vw, 96px); line-height: .9; letter-spacing: -.045em; text-wrap: balance }
h1 em { font-style: normal; color: var(--ink); background: var(--acid); padding: 0 .12em; border-radius: .1em; display: inline-block; transform: rotate(-2.5deg) }
.sub { margin: 0; color: var(--muted); font-size: 17px }
.ais { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
.ai { display: grid; justify-items: center; gap: 8px; padding: 16px 6px 13px; border: 0; border-radius: 20px; cursor: pointer; background: var(--surface);
  box-shadow: 0 5px 0 #0b0c0e; transition: transform .14s var(--ease), box-shadow .14s var(--ease), background .14s }
.ai svg { width: 34px; height: 34px; fill: var(--paper) }
.ai b { font-size: 16px; font-weight: 700 }
.ai:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #0b0c0e }
.ai:active { transform: translateY(5px); box-shadow: 0 0 0 #0b0c0e }
.ai.claude { background: var(--acid); color: var(--ink); box-shadow: 0 5px 0 var(--acid-side) }
.ai.claude svg { fill: var(--ink) }
.ai.claude:hover { box-shadow: 0 8px 0 var(--acid-side) }
.fine { text-align: center; font-size: 13px; color: var(--muted); margin: 0 }
.home { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 13px; border-radius: 16px; cursor: pointer;
  background: transparent; color: var(--paper); border: 1.5px solid var(--lilac); font-weight: 700; font-size: 15px }
.home svg { width: 20px; height: 20px; flex: none }
.home[hidden] { display: none }
.howto { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: h }
.howto li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; counter-increment: h; font-size: 16px }
.howto li::before { content: counter(h); width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--acid); display: grid; place-items: center; font-weight: 700 }
.howto .ic { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: #e4e1d4; vertical-align: middle; margin: 0 2px }
.howto .ic svg { width: 17px; height: 17px }

/* sheet */
.veil { position: fixed; inset: 0; background: rgba(10, 11, 13, .55); opacity: 0; pointer-events: none; transition: opacity .2s }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; background: var(--paper); color: var(--ink); border-radius: 26px 26px 0 0;
  padding: 22px 20px calc(env(safe-area-inset-bottom, 0px) + 22px); display: grid; gap: 14px; transform: translateY(105%); transition: transform .22s var(--ease) }
body.open .veil { opacity: 1; pointer-events: auto }
body.open .sheet { transform: none }
.sheet h2 { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 26px; letter-spacing: -.02em }
.sheet h2 svg { width: 30px; height: 30px; fill: var(--ink) }
.x { position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: #e4e1d4; cursor: pointer; font-size: 20px; line-height: 1 }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; border: 0; cursor: pointer; font-weight: 700; font-size: 18px;
  padding: 16px; border-radius: 16px; background: var(--acid); color: var(--ink); box-shadow: 0 5px 0 var(--acid-side); transition: transform .14s var(--ease), box-shadow .14s var(--ease) }
.btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--acid-side) }
.btn.dark { background: var(--ink); color: var(--paper); box-shadow: 0 5px 0 #000 }
.step { margin: 0; font-size: 15px; color: #45474d }
.step b { color: var(--ink) }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 18px); transform: translate(-50%, -20px); background: var(--acid); color: var(--ink); padding: 10px 16px; border-radius: 999px; font-weight: 700; opacity: 0; transition: .18s; pointer-events: none; z-index: 9 }
.toast.on { opacity: 1; transform: translate(-50%, 0) }

@media (min-width: 900px) {
  .bottom { margin: 0 0 4vh 4vw; max-width: 600px }
  .shade { inset: 0 auto 0 0; width: 70%; height: 100%; background: linear-gradient(to right, var(--ink) 30%, rgba(21, 23, 27, 0)) }
  .fine { text-align: left }
}
@media (max-height: 640px) { h1 { font-size: 42px } .sub { display: none } }
.step.note{opacity:.7;font-size:.86em}

// ---------------------------------------------------------------- 3D: matte game pieces, directional light, no glow
(function () {
  const no3d = () => document.body.classList.add('no3d');
  if (!window.THREE) return no3d();
  const canvas = $('#scene');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false }); } catch (e) { return no3d(); }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x15171b);
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x15171b, 16, 34);
  const cam = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3456, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-6, 9, 8); scene.add(sun);
  const rim = new THREE.DirectionalLight(0xac9cff, 0.35); rim.position.set(7, -3, -4); scene.add(rim);

  // brand hexes are sRGB; the renderer works in linear light
  const mat = c => new THREE.MeshStandardMaterial({ color: new THREE.Color(c).convertSRGBToLinear(), roughness: 0.55, metalness: 0 });
  const C = { acid: 0xe5ff54, lilac: 0xac9cff, coral: 0xff785a, paper: 0xf5f3e9, ink: 0x15171b };
  const extrude = (pts, depth, bevel = 1.2) => {
    const s = new THREE.Shape(); pts.forEach(([x, y], i) => i ? s.lineTo(x, -y) : s.moveTo(x, -y)); s.closePath();
    const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3 });
    g.center(); return g;
  };
  const world = new THREE.Group(); scene.add(world);

  // the Exchange symbol, as two thick matte pieces that slide together
  const hero = new THREE.Group();
  const A = new THREE.Mesh(extrude([[40, 8], [69, 8], [39, 39], [61, 61], [32, 61], [10, 39]], 16), mat(C.acid));
  const B = new THREE.Mesh(extrude([[68, 39], [39, 39], [61, 61], [31, 92], [60, 92], [90, 61]], 16), mat(C.lilac));
  // re-place the centred halves where they sit in the symbol
  A.position.set((10 + 69) / 2 - 50, -((8 + 61) / 2 - 50), 0); B.position.set((31 + 90) / 2 - 50, -((39 + 92) / 2 - 50), 0);
  hero.add(A, B); hero.scale.setScalar(0.056); world.add(hero);

  // floating pieces
  const pieces = [];
  const add = (mesh, x, y, z, s = 1) => { mesh.position.set(x, y, z); mesh.scale.setScalar(s); mesh.userData = { y, ph: Math.random() * 6, sp: 0.5 + Math.random() * 0.5, rx: (Math.random() - .5) * .6, ry: (Math.random() - .5) * .8 }; world.add(mesh); pieces.push(mesh); return mesh; };
  const dpad = extrude([[8, 0], [16, 0], [16, 8], [24, 8], [24, 16], [16, 16], [16, 24], [8, 24], [8, 16], [0, 16], [0, 8], [8, 8]], 6, 0.8);
  add(new THREE.Mesh(dpad, mat(C.coral)), -4.2, -1.6, 1, 0.075);
  const btn = (c, x, y, z) => { const g = new THREE.Group(); const top = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.34, 40), mat(c)); top.rotation.x = Math.PI / 2; g.add(top); return add(g, x, y, z); };
  btn(C.acid, 3.9, -1.2, 1.2); btn(C.lilac, 4.6, 0.3, -0.6);
  // die
  const dieG = new THREE.Group();
  dieG.add(new THREE.Mesh(new THREE.BoxGeometry(1.25, 1.25, 1.25, 1, 1, 1), mat(C.paper)));
  const pip = new THREE.CylinderGeometry(0.12, 0.12, 0.05, 20), pipM = mat(C.ink);
  [[-0.32, 0.32], [0, 0], [0.32, -0.32]].forEach(([x, y]) => { const p = new THREE.Mesh(pip, pipM); p.rotation.x = Math.PI / 2; p.position.set(x, y, 0.63); dieG.add(p); });
  [[-0.3, -0.3], [0.3, 0.3]].forEach(([x, y]) => { const p = new THREE.Mesh(pip, pipM); p.position.set(x, 0.63, y); dieG.add(p); });
  add(dieG, 3.4, 2.6, 0.2);
  // pixel heart
  const heart = extrude([[0, 2], [2, 2], [2, 1], [4, 1], [4, 2], [5, 2], [5, 1], [7, 1], [7, 2], [9, 2], [9, 5], [8, 5], [8, 6], [7, 6], [6, 6], [6, 7], [5, 7], [5, 8], [4, 8], [4, 7], [3, 7], [3, 6], [1, 6], [1, 5], [0, 5]], 2, 0.2);
  add(new THREE.Mesh(heart, mat(C.lilac)), -3.4, 1.9, -0.4, 0.16);
  // coins
  for (const [x, y, z] of [[-1.9, 3.4, -2], [1.6, -3.1, 0.5], [-5.4, 0.6, -3], [5.6, 2.9, -3.5]]) {
    const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.12, 36), mat(C.acid)); coin.rotation.x = Math.PI / 2; add(coin, x, y, z);
  }

  // real game covers orbit behind
  const ring = new THREE.Group(); ring.position.z = -6; world.add(ring);
  window.__onCovers = () => {
    const list = (window.__covers || []).slice(0, 8), loader = new THREE.TextureLoader();
    list.forEach((src, i) => loader.load(src, t => {
      t.encoding = THREE.sRGBEncoding;
      const m = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 3), new THREE.MeshBasicMaterial({ map: t, fog: true }));
      const a = (i / list.length) * Math.PI * 2; m.userData.a = a; ring.add(m);
    }));
  };
  if (window.__covers) window.__onCovers();

  // layout: on wide screens the scene sits right of the text
  let wide = false;
  function size() {
    const w = innerWidth, h = innerHeight; wide = w >= 900;
    renderer.setSize(w, h, false); cam.aspect = w / h;

  // pointer / touch tilt
  let tx = 0, ty = 0, px = 0, py = 0;
  const point = (x, y) => { tx = (x / innerWidth - 0.5) * 2; ty = (y / innerHeight - 0.5) * 2; };

  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    px += (tx - px) * 0.06; py += (ty - py) * 0.06;
    world.rotation.y = px * 0.35 + (still ? 0 : Math.sin(t * 0.3) * 0.12);
    world.rotation.x = py * 0.22;

    hero.rotation.x = -0.12;
    if (!still) pieces.forEach(p => { const u = p.userData; p.position.y = u.y + Math.sin(t * u.sp + u.ph) * 0.22; p.rotation.y += u.ry * 0.01; p.rotation.z = Math.sin(t * 0.4 + u.ph) * u.rx; });
    ring.children.forEach(m => { const a = m.userData.a + (still ? 0 : t * 0.12); m.position.set(Math.cos(a) * 7.5, Math.sin(a * 2) * 0.6, Math.sin(a) * 3); m.lookAt(cam.position); });
    renderer.render(scene, cam);
    if (!still || k < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (still) addEventListener('pointermove', () => requestAnimationFrame(frame), { passive: true });
})();
